name: Release Governance

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semver governance
        run: pnpm tsx tooling/release/semver-governance.ts

      - name: Stage release state
        env:
          LEFTHOOK: "0"
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet || git commit -m "chore(release): update release state [skip ci]"

      - name: Auto tag release
        run: pnpm exec tsx scripts/release/tag-release.ts --bump patch --allow-unsigned --allow-non-main --skip-branch-push --skip-if-exists
        env:
          LEFTHOOK: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Placeholder gates only run on explicit dispatch so pushes to main never queue
  # production approvals that can sit waiting indefinitely.
  staging-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: governance
    environment: staging
    steps:
      - name: Staging gate placeholder
        run: |
          echo "::error::Staging environment selection is not release certification. A verified deployment and evidence gate must be wired before this job can pass."
          exit 1

  production-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: staging-gate
    environment:
      name: production
    steps:
      - name: Production approval gate placeholder
        run: |
          echo "::error::Production approval cannot be represented by a placeholder. Governed runtime evidence and required human authority must be verified."
          exit 1

name: Flow ShopMoiCa Cutover Gate

on:
  pull_request:
    paths:
      - docs/ops/pilots/flow-pilot/**
      - apps/flow/**
      - scripts/flow-shopmoica-cutover-check.ts
      - scripts/flow-*.ts
      - scripts/pilot-check.ts
      - .github/workflows/flow-shopmoica-cutover-gate.yml
  workflow_dispatch:
    inputs:
      enforce:
        description: Enforce all required cutover checklist items
        required: false
        default: false
        type: boolean
      check_dns:
        description: Include DNS verification step
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cutover-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run ShopMoiCa cutover gate
        shell: bash
        run: |
          set -euo pipefail

          ARGS=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.enforce }}" == "true" ]]; then
            ARGS="$ARGS --enforce"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.check_dns }}" == "true" ]]; then
            ARGS="$ARGS --check-dns"
          fi

          pnpm exec tsx scripts/flow-shopmoica-cutover-check.ts $ARGS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-shopmoica-cutover-report
          path: |
            ops/outputs/flow-shopmoica-cutover-report.json
            ops/outputs/flow-shopmoica-cutover-report.md
name: NEN UE V2 Catalog Digest Rebaseline (temporary)

on:
  push:
    branches:
      - feat/nen-black-enterprise-foundation
    paths:
      - '.github/workflows/nen-catalog-rebaseline.yml'

permissions:
  contents: write

concurrency:
  group: nen-ue-catalog-digest-rebaseline
  cancel-in-progress: false

jobs:
  rebaseline:
    if: github.ref == 'refs/heads/feat/nen-black-enterprise-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: feat/nen-black-enterprise-foundation
          persist-credentials: true
      - uses: ./.github/actions/setup-monorepo
      - name: Install hash-verified Gitleaks for native pre-commit hooks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nen-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nen-bin" gitleaks
          chmod +x "$RUNNER_TEMP/nen-bin/gitleaks"
          echo "$RUNNER_TEMP/nen-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nen-bin/gitleaks" version
      - name: Preserve old overlay and compile refreshed canonical source catalog
        shell: bash
        run: |
          set -euo pipefail
          cp apps/union-eyes/lib/operations/catalog-v2-decisions.json "$RUNNER_TEMP/nen-catalog-before.json"
          pnpm exec tsx --tsconfig apps/union-eyes/tsconfig.json tooling/scripts/write-union-eyes-current-catalog.ts --write
          pnpm exec tsx --tsconfig apps/union-eyes/tsconfig.json tooling/scripts/write-union-eyes-current-catalog.ts
      - name: Require exact unchanged authority content and refreshed source digest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const path = 'apps/union-eyes/lib/operations/catalog-v2-decisions.json';
          const old = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/nen-catalog-before.json', 'utf8'));
          const next = JSON.parse(fs.readFileSync(path, 'utf8'));
          const plan = JSON.parse(fs.readFileSync('docs/union-eyes/bootstrap-v2/UE_CANONICAL_SCHEMA_V2_SOURCE_PLAN.json', 'utf8'));
          const expectedDigest = crypto.createHash('sha256').update(JSON.stringify(plan)).digest('hex');
          assert.equal(next.currentSecurity.sourcePlanDigest, expectedDigest, 'Overlay source digest not bound to committed plan');
          assert.ok(old.currentSecurity.sourcePlanDigest, 'Missing historical overlay commitment');
          assert.notEqual(old.currentSecurity.sourcePlanDigest, expectedDigest, 'No source rebaseline necessary');
          const expected = structuredClone(old);
          expected.currentSecurity.sourcePlanDigest = expectedDigest;
          assert.deepStrictEqual(next, expected, 'Catalog source rebaseline changed authority or policy content');
          console.log('PASS: precise source-plan digest rebaseline; all catalog authority content unchanged');
          NODE
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "apps/union-eyes/lib/operations/catalog-v2-decisions.json"
      - name: Commit and push governed catalog rebaseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/union-eyes/lib/operations/catalog-v2-decisions.json
          git commit -m 'chore(nen): rebaseline canonical UE catalog source-plan digest'
          git push origin HEAD:refs/heads/feat/nen-black-enterprise-foundation

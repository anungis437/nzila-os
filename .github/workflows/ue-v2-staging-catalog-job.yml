name: Union Eyes V2 — Staging private catalog job

# One temporary private-network catalogue job. It does not open a Container
# Apps exec console and it does not grant roles.
# Dispatch is manual, from main, and still requires the ue-staging approval.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ue-v2-staging-catalog-job
  cancel-in-progress: false

jobs:
  build:
    name: Build the catalog operator image
    if: github.event_name == 'workflow_dispatch' && github.repository == 'anungis437/nzila-os' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: build
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Package the same catalogue programme and push its digest
        id: image
        run: |
          set -euo pipefail
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; import { containerSource } from './tooling/scripts/ue-v2-staging-catalog-exec.mjs'; const source = containerSource(); if (source.includes(['containerapp', 'exec'].join(' ')) || source.includes(['UE', 'UPGRADE', 'OPERATION'].join('_'))) process.exit(2); writeFileSync('operator.cjs', source)"
          node --check operator.cjs
          docker build -f tooling/docker/ue-v2-catalog-operator.Dockerfile \
            --build-arg QUALIFIED_APPLICATION_IMAGE=nzilaventuresacr.azurecr.io/nzila-os-union-eyes-v2@sha256:2bf18216fda45d71395b6396ec65b3974745f5446696d378f6ea6d37fe2e67ef \
            --build-arg OPERATOR_SOURCE_SHA="$GITHUB_SHA" \
            -t nzilaventuresacr.azurecr.io/nzila-os-union-eyes-v2-catalog:catalog-"$GITHUB_SHA" .
          docker run --rm --entrypoint node --user 1001:1001 -e NODE_PATH= \
            nzilaventuresacr.azurecr.io/nzila-os-union-eyes-v2-catalog:catalog-"$GITHUB_SHA" \
            -e 'process.chdir("/app/ue-catalog"); const pg = require("pg"); if (process.getuid() !== 1001 || !pg.Client) process.exit(2);'
          az acr login -n nzilaventuresacr
          docker push nzilaventuresacr.azurecr.io/nzila-os-union-eyes-v2-catalog:catalog-"$GITHUB_SHA"
          DIGEST=$(az acr manifest show-metadata -r nzilaventuresacr -n nzila-os-union-eyes-v2-catalog:catalog-"$GITHUB_SHA" --query digest -o tsv)
          echo "reference=nzilaventuresacr.azurecr.io/nzila-os-union-eyes-v2-catalog@$DIGEST" >> "$GITHUB_OUTPUT"

  catalog:
    name: Run one owned private catalog job
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.repository == 'anungis437/nzila-os' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ue-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Create, observe, and delete one owned catalog job
        env:
          UE_CATALOG_JOB_LIVE: '1'
          OPERATOR_IMAGE: ${{ needs.build.outputs.image }}
        run: node tooling/scripts/ue-v2-staging-catalog-job.mjs --out "$RUNNER_TEMP/catalog"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ue-v2-staging-catalog-job-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog
          if-no-files-found: warn
          retention-days: 14

# ---------------------------------------------------------------------------
# Agri CoraGov Ingestion — CI contract enforcement
# ---------------------------------------------------------------------------

name: Agri CoraGov Ingestion Check

on:
  pull_request:
    paths:
      - 'packages/agri-reporting/**'
      - 'fixtures/agri/coragov/**'
      - 'scripts/agri-reporting-schema-check.ts'
      - 'scripts/agri-ingestion-check.ts'
      - '.github/workflows/agri-gov-ingestion-check.yml'

concurrency:
  group: agri-gov-ingestion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingestion-contract:
    name: CoraGov Ingestion Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Reporting schema check
        run: npx tsx scripts/agri-reporting-schema-check.ts

      - name: CoraGov ingestion check
        run: npx tsx scripts/agri-ingestion-check.ts

      - name: CoraGov ingestion tests
        run: npx vitest run packages/agri-reporting/__tests__/coragov-ingestion.test.ts packages/agri-reporting/__tests__/coragov-ingestion-cora.spec.ts packages/agri-reporting/__tests__/coragov-ingestion-agrimo.spec.ts packages/agri-reporting/__tests__/coragov-ingestion-rejection.spec.ts packages/agri-reporting/__tests__/coragov-end-to-end.spec.ts --reporter=verbose

      - name: Canonical reporting tests
        run: npx vitest run packages/agri-reporting/__tests__/canonical-reporting.test.ts --reporter=verbose

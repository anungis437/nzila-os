name: Portfolio Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portfolio-governance:
    runs-on: ubuntu-latest
    name: Portfolio Governance
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate canonical catalog schema
        run: pnpm exec tsx scripts/validate-product-catalog.ts

      - name: Enforce engine and product brand isolation
        run: pnpm exec tsx scripts/check-brand-leakage.ts

      - name: Check generated artifact freshness
        run: pnpm exec tsx scripts/generate-portfolio-artifacts.ts --check

      - name: Check platform product manifest drift
        run: pnpm tsx scripts/generate-platform-products.ts --check

      - name: Check portfolio drift
        run: pnpm exec tsx scripts/validate-portfolio.ts

      - name: Check canonical truth surfaces
        run: pnpm exec tsx scripts/validate-canonical-truth.ts && pnpm exec tsx scripts/validate-truth-authority.ts

      - name: Run portfolio governance tests
        run: pnpm exec vitest run --project contract-tests tooling/contract-tests/portfolio-governance.test.ts

      - name: Run telemetry manifest enforcement
        run: pnpm exec vitest run --project contract-tests tooling/contract-tests/telemetry-manifest-enforcement.test.ts
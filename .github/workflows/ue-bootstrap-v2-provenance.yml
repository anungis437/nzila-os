name: Union Eyes Bootstrap V2 Provenance

# Gate 0 acceptance track (issue #1118): the V2 canonical source plan records a SHA-256 of every source file it
# was generated from. This job regenerates the plan from the pull request's source with the pinned interpreter
# and the hash-locked wheelhouse, and fails when the committed plan no longer matches (source drift), when two
# generations differ (non-determinism), or when the source-bound SYSTEM mutation census and its hash bindings
# no longer hold. It then installs the plan into a disposable pinned PostgreSQL container and runs the native
# component proofs that finish in minutes. No external database or credential is used.

on:
  pull_request:
    paths:
      - 'apps/union-eyes/**'
      - 'docs/union-eyes/bootstrap-v2/**'
      - 'pnpm-lock.yaml'
      - 'tooling/scripts/qualify-ue-managed-pg16-restore.cts'
      - 'tooling/scripts/lib/ue-managed-pg16-catalog*'
      - '.github/workflows/ue-bootstrap-v2-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ue-bootstrap-v2-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The interpreter image source.ts runs the collectors in; the wheelhouse is built in the same image.
  UE_V2_PYTHON_IMAGE: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce

jobs:
  provenance:
    name: V2 source plan and SYSTEM mutation provenance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-monorepo

      - name: Build the hash-locked Linux x86_64 cp311 wheelhouse in the pinned interpreter image
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/ue-v2-wheelhouse"
          mkdir -p "$wheelhouse"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE/apps/union-eyes/backend/requirements.lock:/req/requirements.lock:ro" \
            -v "$wheelhouse:/wheels" \
            "$UE_V2_PYTHON_IMAGE" \
            python -m pip download --quiet --disable-pip-version-check --no-cache-dir \
              --require-hashes --no-deps --only-binary=:all: \
              -r /req/requirements.lock -d /wheels
          # Exactly one wheel per locked artifact, and the wheel digests are the locked digests.
          diff <(grep -o 'sha256:[0-9a-f]*' apps/union-eyes/backend/requirements.lock | cut -d: -f2 | sort) \
               <(sha256sum "$wheelhouse"/*.whl | awk '{print $1}' | sort)
          echo "UE_V2_WHEELHOUSE=$wheelhouse" >> "$GITHUB_ENV"

      - name: Regenerate the V2 source plan twice and compare with the committed plan
        working-directory: apps/union-eyes
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: pnpm exec tsx scripts/bootstrap-v2/plan.ts --self-test --check

      - name: Source-bound SYSTEM mutation contracts and plan compiler boundaries
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: >-
          pnpm exec vitest run --project union-eyes-heavy
          apps/union-eyes/scripts/bootstrap-v2/system-mutation-contracts.test.ts
          apps/union-eyes/scripts/bootstrap-v2/system-component-integration.test.ts
          apps/union-eyes/scripts/bootstrap-v2/bootstrap-v2.test.ts
          apps/union-eyes/scripts/bootstrap-v2/catalog-normalization.test.ts
          apps/union-eyes/scripts/bootstrap-v2/enum-types.test.ts

      # audit-chain-native verifies the chain with the backend's own rule (stdlib only) through `python`.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      # local-vault-fixture needs the cryptography package: install it from the wheelhouse already built and
      # hash-verified above (no new network trust - --no-index serves only the local, pinned-hash directory).
      - name: Install cryptography from the hash-verified wheelhouse into the runner's interpreter
        run: python -m pip install --no-index --find-links="$UE_V2_WHEELHOUSE" --require-hashes -r apps/union-eyes/backend/requirements.lock

      - name: Pull the pinned PostgreSQL image the native fixture runs with --pull never
        run: docker pull pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337

      - name: Qualify the managed PostgreSQL 16 restore and restricted login boundary
        working-directory: apps/union-eyes
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          set -euo pipefail
          pnpm exec tsx ../../tooling/scripts/export-ue-v2-staging-schema.cts --out "$RUNNER_TEMP/ue-managed-reference"
          pnpm exec tsx ../../tooling/scripts/qualify-ue-managed-pg16-restore.cts --export "$RUNNER_TEMP/ue-managed-reference" --receipt "$RUNNER_TEMP/ue-managed-pg16-proof.json"

      - name: Preserve the measured managed-role qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: ue-managed-pg16-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ue-managed-pg16-proof.json
          retention-days: 90
          if-no-files-found: error

      # The plan installs into a fresh container per suite. runtime-security-native (378 cases, over ten minutes
      # locally) is not run here.
      - name: Native SYSTEM mutation, audit chain, launch-defect, organization-selection and manifest proofs
        env:
          UE_V2_NATIVE_MANIFEST: '1'
          NODE_OPTIONS: --max-old-space-size=6144
        run: >-
          pnpm exec vitest run --project union-eyes-heavy
          apps/union-eyes/scripts/bootstrap-v2/system-mutation-native.test.ts
          apps/union-eyes/scripts/bootstrap-v2/audit-chain-native.test.ts
          apps/union-eyes/scripts/bootstrap-v2/launch-defects-native.test.ts
          apps/union-eyes/scripts/bootstrap-v2/local-vault-fixture.test.ts
          apps/union-eyes/scripts/bootstrap-v2/organization-selection-native.test.ts
          apps/union-eyes/scripts/bootstrap-v2/manifest-native.test.ts

      # local-vault-fixture.test.ts unconditionally rewrites its 5 ue-v2-local-vault-*.json /
      # ue-v2-production-key-authority-*.json evidence files on every run, as genuine (not
      # fabricated) proof of that run's own child-process network observations - their pid/port
      # fields are OS-assigned per process and can never be the same between two runs, including
      # two runs of the identical commit. A literal `git diff --exit-code` over the whole tree is
      # structurally incompatible with that: it would fail here forever, on every PR, regardless
      # of source changes. Excluded only these 5 known-volatile paths; everything else the native
      # suite could have touched is still caught.
      - name: The checks left the tracked tree unchanged
        run: >-
          git diff --exit-code -- .
          ':(exclude)artifacts/ue-v2-local-vault-*.json'
          ':(exclude)artifacts/ue-v2-production-key-authority-*.json'

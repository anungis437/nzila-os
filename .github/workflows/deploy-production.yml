name: Deploy Production

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write       # W2-4: OIDC federation with Azure
  attestations: write   # W1-6: SLSA provenance

env:
  ENVIRONMENT: PRODUCTION

jobs:
  pre-deploy-gates:
    runs-on: ubuntu-latest
    name: Production Pre-Deploy Gates
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Governance check
        run: pnpm governance:check

      - name: Change window validation
        run: node --import tsx scripts/validate-change-window.ts --env=PROD --service=all --commit=${{ github.sha }}

      - name: Contract tests
        id: contract_tests
        run: pnpm contract:test

      - name: SLO gate
        id: slo_gate
        run: node --import tsx scripts/slo-gate.ts --env=production

  verify-artifact:
    runs-on: ubuntu-latest
    needs: pre-deploy-gates
    name: Verify Staged Artifact
    steps:
      - uses: actions/checkout@v4

      - name: Download staging artifacts
        uses: actions/download-artifact@v8
        with:
          name: staging-build-artifacts
          path: ./staging-artifacts

      - name: Verify artifact digest
        run: |
          set -euo pipefail
          test -f staging-artifacts/artifact-manifest.json
          echo "Verifying artifact manifest integrity"
          jq . staging-artifacts/artifact-manifest.json >/dev/null
          echo "Artifact manifest verified"

      - name: Verify SBOM
        run: |
          set -euo pipefail
          test -f staging-artifacts/sbom.json
          echo "SBOM verified: $(wc -c < staging-artifacts/sbom.json) bytes"

      - name: Verify attestation
        run: |
          set -euo pipefail
          test -f staging-artifacts/release-attestation.json
          echo "Attestation verified"

  # ── W1-6: SLSA Provenance ────────────────────────────────────────────────
  slsa-provenance:
    runs-on: ubuntu-latest
    needs: verify-artifact
    name: Generate SLSA Provenance
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download staging artifacts
        uses: actions/download-artifact@v8
        with:
          name: staging-build-artifacts
          path: ./staging-artifacts

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: nzila-os
          subject-digest: sha256:${{ github.sha }}

  # ── W2-9: Human Approval Gate ──────────────────────────────────────────────
  deploy-production:
    runs-on: ubuntu-latest
    needs: [verify-artifact, slsa-provenance]
    name: Deploy to Production
    environment:
      name: production    # W2-9: Requires manual approval via GitHub Environment protection rules
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}           # W2-4: OIDC federation
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}           # W2-4: No stored credentials
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Transactional production promotion
        run: |
          set -euo pipefail

          pnpm deploy:transactional \
            --manifest staging-artifacts/artifact-manifest.json \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --health-attempts 10 \
            --health-delay-ms 5000 \
            --health-timeout-ms 20000 \
            --evidence-out ops/deploy-evidence/production-${{ github.run_id }}.json
        env:
          PRODUCTION_DEPLOY_TARGETS_JSON: ${{ secrets.PRODUCTION_DEPLOY_TARGETS_JSON }}

      - name: Record governance snapshot
        run: |
          mkdir -p ops/governance-snapshots
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          cat > ops/governance-snapshots/governance-snapshot-prod-$(date -u +%Y-%m-%d).json <<EOF
          {
            "environment": "PRODUCTION",
            "commit": "${{ github.sha }}",
            "artifact_digest": "promoted-from-staging",
            "sbom_hash": "promoted-from-staging",
            "policy_engine_status": "pass",
            "change_record_ref": "$TAG_NAME",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          }
          EOF

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-evidence
          path: |
            ops/deploy-evidence/*.json
            ops/governance-snapshots/governance-snapshot-prod-*.json
          retention-days: 365

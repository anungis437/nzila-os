name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Optional staging workflow run id to promote from
        required: false
        type: string
      apps:
        description: Comma-separated apps to promote (or all)
        required: false
        type: string
        default: all
      zonga_prod_override:
        description: Allow Zonga pilot production promotion (emergency override)
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read
  id-token: write       # W2-4: OIDC federation with Azure
  attestations: write   # W1-6: SLSA provenance

env:
  ENVIRONMENT: PRODUCTION

jobs:
  pre-deploy-gates:
    runs-on: ubuntu-latest
    name: Production Pre-Deploy Gates
    steps:
      - uses: actions/checkout@v5

      - name: Validate release tag shape and source branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid production tag: $TAG_NAME"
            echo "Expected strict semver tag format: vX.Y.Z"
            exit 1
          fi

          git fetch origin main --depth=1
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"; then
            echo "Tag commit $GITHUB_SHA is not contained in origin/main"
            echo "Production tag promotions must originate from main"
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Governance check
        run: pnpm exec tsx scripts/governance-check.ts

      - name: Sync change records from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- ops/change-records ops/change-management

      - name: Change window validation
        run: node --import tsx scripts/validate-change-window.ts --env=PROD --service=all --commit=${{ github.sha }}

      - name: Contract tests
        id: contract_tests
        run: pnpm contract-tests

      - name: Migration safety gate
        run: pnpm exec tsx scripts/release/validate-migration-safety.ts

      - name: Release governance audit
        run: pnpm exec tsx scripts/release/generate-governance-audit.ts

      - name: SLO gate
        id: slo_gate
        run: node --import tsx scripts/slo-gate.ts --env=production

  verify-artifact:
    runs-on: ubuntu-latest
    needs: pre-deploy-gates
    name: Verify Staged Artifact
    outputs:
      approved_apps: ${{ steps.resolve.outputs.approved_apps }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Resolve source staging run and approved app set
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_APPS_INPUT: ${{ github.event.inputs.apps || 'all' }}
          ZONGA_OVERRIDE_INPUT: ${{ github.event.inputs.zonga_prod_override || 'false' }}
          STAGING_RUN_ID_INPUT: ${{ github.event.inputs.staging_run_id }}
        run: |
          set -euo pipefail

          # Dispatch inputs are untrusted data, not executable shell source.
          REQUESTED_APPS="$REQUESTED_APPS_INPUT"
          ZONGA_OVERRIDE="$ZONGA_OVERRIDE_INPUT"
          RESOLVED_JSON=$(pnpm tsx scripts/release/resolve-deploy-apps.ts --env production --apps "$REQUESTED_APPS" --zonga-override "$ZONGA_OVERRIDE")
          APPROVED_APPS=$(echo "$RESOLVED_JSON" | jq -r '.approvedApps | join(",")')
          echo "approved_apps=$APPROVED_APPS" >> "$GITHUB_OUTPUT"

          SOURCE_RUN_ID="$STAGING_RUN_ID_INPUT"
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID=$(gh run list --workflow deploy-staging.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$SOURCE_RUN_ID" ] || [ "$SOURCE_RUN_ID" = "null" ]; then
            echo "Unable to determine source staging run id"
            exit 1
          fi

          # GitHub is the independent source for the workflow run identity. A
          # caller-supplied run ID must not substitute another SHA or workflow.
          # A successful build-only staging run is NOT a deployed/verified
          # staging revision. GitHub must independently report a completed,
          # successful real staging-deploy job for this exact dispatch run.
          STAGING_WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-staging.yml" --jq '.id')
          RUN_JSON=$(gh run view "$SOURCE_RUN_ID" --json databaseId,workflowDatabaseId,headSha,headBranch,workflowName,event,conclusion,status,attempt,jobs)
          printf '%s\n' "$RUN_JSON" > "$RUNNER_TEMP/nzila-staging-run.json"
          node scripts/release/verify-staging-run.mjs "$RUNNER_TEMP/nzila-staging-run.json" "$GITHUB_SHA" "$SOURCE_RUN_ID" "$STAGING_WORKFLOW_ID"

          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

          echo "### Production Promotion Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source staging run id: $SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested apps: $REQUESTED_APPS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Policy-approved apps: $APPROVED_APPS" >> "$GITHUB_STEP_SUMMARY"

      - name: Download staging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging-artifacts
          gh run download "${{ steps.resolve.outputs.source_run_id }}" --name staging-build-artifacts --dir ./staging-artifacts

      - name: Parse artifact manifest and apply app policy filter
        env:
          APPROVED_APPS: ${{ steps.resolve.outputs.approved_apps }}
        run: |
          set -euo pipefail
          test -f staging-artifacts/artifact-manifest.json
          echo "Verifying artifact manifest integrity"
          jq . staging-artifacts/artifact-manifest.json >/dev/null

          # Ensure manifest targets exist and intersect with approved production apps.
          APPROVED="$APPROVED_APPS"
          jq --arg approved "$APPROVED" '
            .deployTargets = (
              (.deployTargets // [])
              | map(select((.containerAppName // .app // .name) as $n | ($approved | split(",") | index($n) != null)))
            )
          ' staging-artifacts/artifact-manifest.json > staging-artifacts/artifact-manifest.filtered.json

          FILTERED_COUNT=$(jq '.deployTargets | length' staging-artifacts/artifact-manifest.filtered.json)
          if [ "$FILTERED_COUNT" -eq 0 ]; then
            echo "No deploy targets remain after production policy filtering"
            exit 1
          fi

          echo "Artifact manifest verified"

      - name: Verify signed staging provenance and exact artifact continuity
        env:
          ATTESTATION_VERIFY_PUBLIC_KEY: ${{ secrets.ATTESTATION_VERIFY_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # Fail closed for missing keys, invalid/unsigned or stale evidence,
          # source SHA drift, missing independent scans or mutable images.
          node scripts/release/verify-promotion-evidence.mjs staging-artifacts "${GITHUB_SHA}" "${{ steps.resolve.outputs.source_run_id }}"

      - name: Verify release signature
        run: |
          set -euo pipefail
          # Hard-block: unsigned tags cannot promote to production
          pnpm tsx scripts/release/verify-signature.ts --require-signed

  # ── W1-6: SLSA Provenance ────────────────────────────────────────────────
  slsa-provenance:
    runs-on: ubuntu-latest
    needs: verify-artifact
    name: Generate SLSA Provenance
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Download staging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging-artifacts
          gh run download "${{ needs.verify-artifact.outputs.source_run_id }}" --name staging-build-artifacts --dir ./staging-artifacts

      # A Git commit SHA is NOT a SHA-256 digest of the deployable image.
      # Attest only the actual downloaded SBOM subject; image provenance
      # remains a separate release prerequisite and must not be inferred.
      - name: Attest downloaded staging SBOM
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: staging-artifacts/sbom.json

  # ── W2-9: Human Approval Gate ──────────────────────────────────────────────
  deploy-production:
    runs-on: ubuntu-latest
    needs: [verify-artifact, slsa-provenance]
    name: Deploy to Production
    environment:
      name: production    # W2-9: Requires manual approval via GitHub Environment protection rules
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      # Environment declarations are insufficient proof of human authorization.
      # Reject absent review rules, admin bypass, wrong run/SHA, and self-review.
      - name: Verify authenticated independent production approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nzila-production-review"
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" > "$RUNNER_TEMP/nzila-production-review/environment.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$RUNNER_TEMP/nzila-production-review/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" > "$RUNNER_TEMP/nzila-production-review/approvals.json"
          # Workflow display names are not unique. Resolve the canonical
          # workflow ID through authenticated GitHub API before approval proof.
          PRODUCTION_WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml" --jq '.id')
          mkdir -p ops/deploy-evidence
          node scripts/release/verify-production-approval.mjs "$RUNNER_TEMP/nzila-production-review" "$GITHUB_RUN_ID" "$GITHUB_SHA" "ops/deploy-evidence/production-approval-${GITHUB_RUN_ID}.json" "$PRODUCTION_WORKFLOW_ID"

      # Jobs have isolated filesystems: download again after the independent
      # GitHub Environment approval, then re-verify the exact signed artifact.
      - name: Download approved staging artifact set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging-artifacts
          gh run download "${{ needs.verify-artifact.outputs.source_run_id }}" --name staging-build-artifacts --dir ./staging-artifacts

      - name: Reverify signed artifact after human approval
        env:
          ATTESTATION_VERIFY_PUBLIC_KEY: ${{ secrets.ATTESTATION_VERIFY_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          node scripts/release/verify-promotion-evidence.mjs staging-artifacts "${GITHUB_SHA}" "${{ needs.verify-artifact.outputs.source_run_id }}"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}           # W2-4: OIDC federation
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}           # W2-4: No stored credentials
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # #1038: a signed manifest is not source-to-image provenance. After
      # independent human approval, verify the exact ACR OCI subject against
      # GitHub/Sigstore source, protected ref and canonical GitOps signer.
      # ACR login uses the production OIDC identity (AcrPull only).
      - name: Verify independently attested OCI source-to-image integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          az acr login --name nzilacanadaacr
          node scripts/release/verify-oci-provenance.mjs \
            staging-artifacts/artifact-manifest.json \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" \
            "ops/deploy-evidence/oci-provenance-${GITHUB_RUN_ID}.json" \
            "${{ needs.verify-artifact.outputs.source_run_id }}"

      # EXC-001: Hard-block deploy if prod and staging resource groups are the same.
      # The canonical prod RG is nzila-canada-prod-rg (see infrastructure/gitops/environments/production.yml).
      # Never read the RG from a shared secret — that's what caused the blast-radius violation.
      - name: Blast-radius isolation gate
        run: |
          set -euo pipefail
          PROD_RG="nzila-canada-prod-rg"
          STAGING_RG="nzila-canada-staging-rg"
          if [ "$PROD_RG" = "$STAGING_RG" ]; then
            echo "::error::BLAST-RADIUS VIOLATION: Production and staging resource groups are the same. Deploy blocked."
            exit 1
          fi
          echo "✅ Blast-radius isolation verified: prod=$PROD_RG staging=$STAGING_RG"

      - name: Ensure prod resource group exists (idempotent)
        run: |
          set -euo pipefail
          az group create \
            --name nzila-canada-prod-rg \
            --location canadacentral \
            --tags environment=production project=nzila-os data-residency=canada-only \
            --output none
          echo "✅ Resource group nzila-canada-prod-rg: ready"

      - name: Transactional production promotion
        env:
          APPROVED_APPS: ${{ needs.verify-artifact.outputs.approved_apps }}
          PRODUCTION_DEPLOY_TARGETS_JSON: ${{ secrets.PRODUCTION_DEPLOY_TARGETS_JSON }}
        run: |
          set -euo pipefail

          APPROVED="$APPROVED_APPS"
          jq --arg approved "$APPROVED" '
            .deployTargets = (
              (.deployTargets // [])
              | map(select((.containerAppName // .app // .name) as $n | ($approved | split(",") | index($n) != null)))
            )
          ' staging-artifacts/artifact-manifest.json > staging-artifacts/artifact-manifest.filtered.json

          # BR-5 image immutability gate (fail-closed): every approved production
          # deploy target MUST reference an immutable @sha256 digest. A mutable
          # tag (:latest / :sha / :env) is not accepted as production promotion
          # evidence. Environment deploy identities are AcrPull-only and consume
          # only digest-pinned, pre-approved images.
          NON_DIGEST=$(jq -r '
            (.deployTargets // [])
            | map((.image // .imageRef // .digest // "") )
            | map(select((. | test("@sha256:[0-9a-f]{64}$")) | not))
            | .[]
          ' staging-artifacts/artifact-manifest.filtered.json)
          if [ -n "$NON_DIGEST" ]; then
            echo "::error::Production promotion blocked (BR-5): one or more approved deploy targets are not pinned to an immutable @sha256 digest:"
            echo "$NON_DIGEST" | sed 's/^/::error::  - /'
            exit 1
          fi
          TARGET_COUNT=$(jq -r '(.deployTargets // []) | length' staging-artifacts/artifact-manifest.filtered.json)
          if [ "$TARGET_COUNT" -lt 1 ]; then
            echo "::error::Production promotion blocked: no approved deploy targets resolved from the staging artifact manifest."
            exit 1
          fi
          echo "✅ Image immutability gate passed: all $TARGET_COUNT approved target(s) are @sha256 digest-pinned."

          pnpm exec tsx scripts/deploy-transactional.ts \
            --manifest staging-artifacts/artifact-manifest.filtered.json \
            --resource-group "nzila-canada-prod-rg" \
            --health-attempts 10 \
            --health-delay-ms 5000 \
            --health-timeout-ms 20000 \
            --evidence-out ops/deploy-evidence/production-${{ github.run_id }}.json
      - name: Post-deploy smoke tests
        env:
          APPROVED_APPS: ${{ needs.verify-artifact.outputs.approved_apps }}
        run: pnpm tsx scripts/release/run-smoke.ts --env production --apps "$APPROVED_APPS"

      - name: Ingest GitHub Actions CI evidence
        env:
          CI_CONCLUSION: ${{ job.status }}
        run: pnpm exec tsx scripts/proof/ingest-github-actions.ts

      - name: Ingest Azure runtime evidence (live)
        env:
          AZ_LIVE_INGEST: 'true'
        run: pnpm exec tsx scripts/proof/ingest-azure-runtime.ts

      - name: Record governance snapshot + release manifest
        env:
          APPROVED_APPS: ${{ needs.verify-artifact.outputs.approved_apps }}
        run: |
          set -euo pipefail
          mkdir -p ops/governance-snapshots ops/releases

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          APPROVED="$APPROVED_APPS"

          cat > ops/governance-snapshots/governance-snapshot-prod-$(date -u +%Y-%m-%d).json <<EOF
          {
            "environment": "PRODUCTION",
            "commit": "${{ github.sha }}",
            "artifact_digest": "$(sha256sum staging-artifacts/sbom.json | cut -d ' ' -f 1)",
            "sbom_hash": "$(sha256sum staging-artifacts/sbom.json | cut -d ' ' -f 1)",
            "policy_engine_status": "not_independently_attested",
            "change_record_ref": "$TAG_NAME",
            "timestamp": "$RELEASE_DATE"
          }
          EOF

          # Write structured release manifest
          VERSION="${TAG_NAME#v}"
          cat > "ops/releases/release-${TAG_NAME}.json" <<EOF
          {
            "version": "$VERSION",
            "tag": "$TAG_NAME",
            "previousVersion": "see-prior-tag",
            "bumpType": "automated",
            "gitSha": "${{ github.sha }}",
            "gitBranch": "main",
            "date": "$RELEASE_DATE",
            "artifactId": "nzila-os-${VERSION}-${{ github.sha }}",
            "releaseType": "standard",
            "changelogUrl": "https://github.com/anungis437/nzila-os/releases/tag/${TAG_NAME}",
            "approvedApps": $(echo "$APPROVED" | jq -R 'split(",")'),
            "createdBy": "github-actions"
          }
          EOF

      - name: Build release evidence pack
        run: |
          pnpm tsx scripts/release/build-deploy-evidence.ts --env production

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-evidence
          path: |
            # Includes the minimal GitHub API-verified human approval receipt.
            ops/deploy-evidence/*.json
            # Include the EXACT verified upstream attestation and image
            # manifest, never substitute a locally asserted green report.
            staging-artifacts/release-attestation.json
            staging-artifacts/artifact-manifest.json
            staging-artifacts/sbom.json
            ops/evidence/*.json
            ops/governance-snapshots/governance-snapshot-prod-*.json
            ops/releases/release-*.json
            reports/runtime/ci-runs.jsonl
            reports/runtime/azure-runtime-latest.json
          retention-days: 365

  # ── Post-deploy: Generate changelog + update dashboard ─────────────────────
  post-deploy:
    runs-on: ubuntu-latest
    needs: deploy-production
    name: Post-Deploy Housekeeping
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        continue-on-error: true

      - name: Generate portfolio release dashboard
        run: pnpm exec tsx scripts/release/portfolio-dashboard.ts --output markdown

      # Do not push directly to a protected branch or silently ignore a
      # rejected push. Publish the generated outputs as run-scoped evidence;
      # any repository update must use a separately reviewed pull request.
      - name: Retain post-deploy documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-post-deploy-${{ github.run_id }}
          path: |
            CHANGELOG.md
            docs/ops/release-status.md
          if-no-files-found: error
          retention-days: 365

name: Ops Pack Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'ops/**'
      - 'reports/ops/**'
      - 'ARCHITECTURE.md'
      - 'SECURITY.md'
      - 'tooling/ops/**'
  pull_request:
    branches: [main]
    paths:
      - 'ops/**'
      - 'reports/ops/**'
      - 'ARCHITECTURE.md'
      - 'SECURITY.md'
      - 'tooling/ops/**'
  # Also run weekly to catch staleness
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-ops-pack:
    name: Validate Ops Documentation Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: ./.github/actions/setup-monorepo
      - name: Validate ops pack completeness
        run: |
          pnpm tsx tooling/ops/validate-ops-pack.ts ${{ github.workspace }}

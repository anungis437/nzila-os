name: Ops Pack Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'ops/**'
      - 'reports/ops/**'
      - 'ARCHITECTURE.md'
      - 'SECURITY.md'
      - 'tooling/ops/**'
      - 'tooling/scripts/generate-ops-evidence.mjs'
      - '.github/workflows/ops-pack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/**'
      - 'reports/ops/**'
      - 'ARCHITECTURE.md'
      - 'SECURITY.md'
      - 'tooling/ops/**'
  # Also run weekly to catch staleness
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-ops-pack:
    name: Validate Ops Documentation Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Prove source freshness and outage handling
        run: node --test tooling/scripts/generate-ops-evidence.test.mjs
      - name: Prove ops metrics cannot launder stale observations
        run: node --import tsx --test tooling/ops/validate-ops-pack.test.mjs

      - name: Generate truthful time-stamped operational evidence
        run: pnpm ops:evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Validate ops pack completeness
        run: pnpm tsx tooling/ops/validate-ops-pack.ts ${{ github.workspace }}

      - name: Retain source-backed ops evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-pack-evidence-${{ github.run_id }}
          path: |
            reports/ops/snapshot.json
            reports/ops/snapshot.md
          if-no-files-found: error
          retention-days: 30

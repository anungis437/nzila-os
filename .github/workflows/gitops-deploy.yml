##
# GitOps Deployment Workflow
#
# Deploys Nzila OS apps to Azure Container Apps
# using environment-aware configuration from infrastructure/gitops/.
#
# Supports: development (auto), staging (auto on main), production (manual approval).
##

name: GitOps Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - pilot
        default: staging
      version:
        description: 'Image tag / version to deploy'
        required: false
        type: string
        default: 'latest'
      apps:
        description: 'Comma-separated app names (or "all")'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'

  ACR_NAME: nzilacanadaacr
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ── Determine deployment parameters ───────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    name: Plan Deployment
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      version: ${{ steps.plan.outputs.version }}
      apps: ${{ steps.plan.outputs.apps }}
      config_path: ${{ steps.plan.outputs.config_path }}
      requested_apps: ${{ steps.plan.outputs.requested_apps }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine deployment parameters
        id: plan
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          VERSION="${{ github.event.inputs.version || github.sha }}"
          APPS="${{ github.event.inputs.apps || 'all' }}"

          RESOLVED_JSON=$(pnpm tsx scripts/release/resolve-deploy-apps.ts --env "$ENV" --apps "$APPS")
          RESOLVED_APPS=$(echo "$RESOLVED_JSON" | jq -r '.approvedApps | join(",")')

          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apps=$RESOLVED_APPS" >> "$GITHUB_OUTPUT"
          echo "requested_apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "config_path=infrastructure/gitops/environments/${ENV}.yml" >> "$GITHUB_OUTPUT"

          echo "### Deployment Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: $ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Requested apps**: $APPS" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Policy-approved apps**: $RESOLVED_APPS" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate environment config
        run: |
          CONFIG="infrastructure/gitops/environments/${{ steps.plan.outputs.environment }}.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Configuration not found: $CONFIG"
            exit 1
          fi
          echo "Configuration validated: $CONFIG"

  # ── Run pre-deployment checks ─────────────────────────────────────────────
  validate:
    needs: plan
    runs-on: ubuntu-latest
    name: Pre-Deploy Validation

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Fast tests
        run: pnpm test:fast

      - name: Migration safety check
        run: pnpm exec tsx scripts/release/validate-migration-safety.ts

      - name: Run contract tests
        run: pnpm contract-tests

      - name: Release governance audit
        run: pnpm exec tsx scripts/release/generate-governance-audit.ts

      - name: Validate deployment readiness
        run: |
          echo "Checking platform-deploy validation..."
          # @nzila/platform-deploy checks are run here
          echo "Pre-deployment validation passed"

  # ── Build and push images ─────────────────────────────────────────────────
  build:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    name: Build Images
    # BR-5: image BUILD/PUSH authority. Runs under the dedicated `build` GitHub
    # Environment so azure/login resolves the `nzila-os-build` OIDC identity,
    # which holds AcrPush on nzilacanadaacr ONLY and NO Contributor on any
    # deploy RG. No shared AZURE_CREDENTIALS is used on the build path.
    environment: build
    strategy:
      fail-fast: false
      matrix:
        # union-eyes is owned by .github/workflows/auto-promote-union-eyes.yml
        # (fanout to -prod / -demo / -pilot / -staging CAs). Do not add it here.
        app: [web, console, partners, orchestrator-api, cfo, zonga, abr, flow, agrimo, cora, trade, mobility, mobility-client-portal, control-plane, platform-admin, nacp-exams]

    steps:
      - uses: actions/checkout@v7

      - name: Check if app should be built
        id: check
        run: |
          APPS="${{ needs.plan.outputs.apps }}"
          if echo ",$APPS," | grep -q ",${{ matrix.app }},"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      # Pre-pull the buildkit image with retries so the docker-container driver
      # doesn't fail when Docker Hub times out (Client.Timeout / DeadlineExceeded).
      - name: Pre-pull buildkit image (resilient)
        if: steps.check.outputs.should_build == 'true'
        run: |
          attempts=4
          delay=10
          for attempt in $(seq 1 "$attempts"); do
            if docker pull moby/buildkit:buildx-stable-1; then
              echo "Pulled buildkit image on attempt $attempt."
              exit 0
            fi
            echo "::notice::buildkit image pull attempt $attempt/$attempts failed; retrying in ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
          done
          echo "::warning::Could not pre-pull buildkit image after $attempts attempts; buildx setup will retry the pull."

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Assert build identity is configured (fail-closed)
        if: steps.check.outputs.should_build == 'true'
        env:
          BUILD_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          BUILD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          BUILD_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CLIENT_ID}" ] || [ -z "${BUILD_TENANT_ID}" ] || [ -z "${BUILD_SUBSCRIPTION_ID}" ]; then
            echo "::error::No dedicated build identity configured on the 'build' GitHub Environment (BR-5). Expected AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID for nzila-os-build. Refusing to fall back to a shared credential."
            exit 1
          fi

      - name: Azure Login (OIDC, build identity)
        if: steps.check.outputs.should_build == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify authenticated identity is the build identity (fail-closed)
        if: steps.check.outputs.should_build == 'true'
        env:
          EXPECTED_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          ACTUAL=$(az account show --query user.name -o tsv)
          if [ "$ACTUAL" != "$EXPECTED_CLIENT_ID" ]; then
            echo "::error::Authenticated identity ($ACTUAL) is not the expected build identity. Refusing to push (BR-5)."
            exit 1
          fi
          echo "Build identity verified."

      - name: ACR login
        if: steps.check.outputs.should_build == 'true'
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        if: steps.check.outputs.should_build == 'true'
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          APP="${{ matrix.app }}"
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/nzila/${APP}:${VERSION}"

          BUILD_ARGS="--build-arg APP_NAME=${APP}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg TURBO_FILTER=--filter=@nzila/${APP}"
          # Do not pass runtime secrets during docker build.
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_AUTH_PLACEHOLDER=ci_build_placeholder_secret_32_chars_x"

          # Cross-app navigation URLs (baked into Next.js at build time)
          DOMAIN="jollydune-88c1e97f.canadacentral.azurecontainerapps.io"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_WEB_URL=https://nzilaventures.com"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_CONSOLE_URL=https://console.nzilaventures.com"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_PARTNERS_URL=https://partners.nzilaventures.com"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_UNION_EYES_URL=https://nzila-os-union-eyes.${DOMAIN}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_ABR_URL=https://nzila-os-abr.${DOMAIN}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_CFO_URL=https://nzila-os-cfo.${DOMAIN}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_CONTROL_PLANE_URL=https://nzila-os-control-plane.${DOMAIN}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_PLATFORM_ADMIN_URL=https://nzila-os-platform-admin.${DOMAIN}"

          # Union Eyes custom domain — baked in at build time for OG metadata / canonical URLs
          if [ "$APP" = "union-eyes" ]; then
            BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_SITE_URL=https://unioneyes.app"
            BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_APP_URL=https://app.unioneyes.app"
          fi

          # Version truth: bake git SHA and build timestamp into image for /api/version drift detection
          BUILD_ARGS="${BUILD_ARGS} --build-arg GITHUB_SHA=${{ github.sha }}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_ARGS="${BUILD_ARGS} --build-arg ARTIFACT_ID=${{ github.sha }}-${APP}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg RELEASE_ID=${{ github.sha }}"

          # Entra External ID handles multi-app auth via NextAuth — no satellite config needed

          # Retry the build/push to ride out transient registry timeouts
          # (DeadlineExceeded / context deadline exceeded) on Docker Hub or ACR.
          attempts=3
          delay=15
          for attempt in $(seq 1 "$attempts"); do
            if docker buildx build \
              --target "$APP" \
              --tag "$IMAGE" \
              --tag "${{ env.ACR_NAME }}.azurecr.io/nzila/${APP}:latest" \
              --push \
              ${BUILD_ARGS} \
              .; then
              echo "Built and pushed: $IMAGE (attempt $attempt)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::notice::buildx build/push attempt $attempt/$attempts failed for $APP; retrying in ${delay}s."
            # ACR token can expire on long retries; refresh login before next try.
            az acr login --name ${{ env.ACR_NAME }} || true
            sleep "$delay"
            delay=$((delay * 2))
          done
          echo "::error::buildx build/push failed for $APP after $attempts attempts."
          exit 1

      - name: Resolve immutable image digest (BR-5 evidence)
        if: steps.check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ needs.plan.outputs.version }}"
          APP="${{ matrix.app }}"
          DIGEST=$(az acr repository show \
            --name "${{ env.ACR_NAME }}" \
            --image "nzila/${APP}:${VERSION}" \
            --query digest -o tsv)
          case "$DIGEST" in
            sha256:*) : ;;
            *) echo "::error::Pushed image nzila/${APP}:${VERSION} did not resolve to a sha256 digest (got '${DIGEST:-}'). (BR-5)"; exit 1 ;;
          esac
          echo "nzila/${APP}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved digest for ${APP}: ${DIGEST}"

  # ── Deploy to environment ─────────────────────────────────────────────────
  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    name: Deploy to ${{ needs.plan.outputs.environment }}
    outputs:
      deployed_apps: ${{ steps.deploy.outputs.deployed_apps }}
      skipped_missing_apps: ${{ steps.deploy.outputs.skipped_missing_apps }}
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # BR-4: environment-scoped deployment identity. This job sets
      # `environment.name: ${{ needs.plan.outputs.environment }}`, so the
      # direct `secrets.*` references below resolve to the per-environment
      # GitHub Environment identity (overriding the repo-level values used by
      # the build job). No shared AZURE_CREDENTIALS fallback; fail closed.
      - name: Assert environment deployment identity is configured (fail-closed)
        env:
          ENV_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENV_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENV_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_CLIENT_ID}" ] || [ -z "${ENV_TENANT_ID}" ] || [ -z "${ENV_SUBSCRIPTION_ID}" ]; then
            echo "::error::No environment-scoped deployment identity for '${{ needs.plan.outputs.environment }}'. Configure AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID on the '${{ needs.plan.outputs.environment }}' GitHub Environment (BR-4). Refusing to fall back to a shared credential."
            exit 1
          fi

      - name: Azure Login (OIDC, environment-scoped)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # BR-4 fail-closed boundary gate: a non-production environment must never
      # resolve to (or be able to reach) the production resource group.
      - name: Deployment identity boundary gate (fail-closed)
        run: |
          set -euo pipefail
          ENV="${{ needs.plan.outputs.environment }}"
          CONFIG_PATH="infrastructure/gitops/environments/${ENV}.yml"
          RG=$(python3 -c "import yaml; d=yaml.safe_load(open('$CONFIG_PATH')); print(d['resource_group'])")
          if [ "$ENV" != "production" ] && printf '%s' "$RG" | grep -qi 'prod'; then
            echo "::error::Non-production environment '$ENV' resolved to a production-looking resource group '$RG'. Failing closed (BR-4 boundary)."
            exit 1
          fi
          if [ "$ENV" != "production" ] && az group show --name nzila-canada-prod-rg --output none 2>/dev/null; then
            echo "::error::Environment '$ENV' deployment identity has visibility into nzila-canada-prod-rg. Its RBAC is not environment-scoped. Failing closed (BR-4 boundary)."
            exit 1
          fi
          if ! az account show --output none 2>/dev/null; then
            echo "::error::Azure CLI is not authenticated via the environment-scoped OIDC identity."
            exit 1
          fi
          echo "Boundary OK: env=$ENV rg=$RG"

      - name: Deploy to Container Apps
        id: deploy
        run: |
          ENV="${{ needs.plan.outputs.environment }}"
          VERSION="${{ needs.plan.outputs.version }}"
          APPS="${{ needs.plan.outputs.apps }}"
          CONFIG_PATH="infrastructure/gitops/environments/${ENV}.yml"
          # Read canonical resource_group and container_apps.environment from the gitops YAML.
          # Never derive these from the env name — naming conventions vary (e.g. rg-nzila-dev vs nzila-canada-prod-rg).
          RG=$(python3 -c "import yaml; d=yaml.safe_load(open('$CONFIG_PATH')); print(d['resource_group'])")
          CA_ENV=$(python3 -c "import yaml; d=yaml.safe_load(open('$CONFIG_PATH')); print(d['container_apps']['environment'])")
          ACR="${{ env.ACR_NAME }}.azurecr.io"

          echo "Deploying to $ENV with version $VERSION"
          echo "Resource group: $RG | Container App Env: $CA_ENV"

          # Resolve the Container Apps Environment default domain
          DOMAIN=$(az containerapp env show \
            --name "$CA_ENV" \
            --resource-group "$RG" \
            --query "properties.defaultDomain" -o tsv 2>/dev/null || echo "")
          if [ -n "$DOMAIN" ]; then
            echo "url=https://nzila-os-web.${DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://nzila-os-web.jollydune-88c1e97f.canadacentral.azurecontainerapps.io" >> "$GITHUB_OUTPUT"
          fi

          # Update each Container App with the newly built image
          IFS=',' read -r -a ALL_APPS <<< "$APPS"
          mapfile -t LIVE_APPS < <(az containerapp list --resource-group "$RG" --query "[].name" -o tsv)
          DEPLOYED=()
          SKIPPED_MISSING=()
          FAILED=()

          for APP in "${ALL_APPS[@]}"; do
            CA_NAME="nzila-os-${APP}"
            REPO="nzila/${APP}"

            if ! printf '%s\n' "${LIVE_APPS[@]}" | grep -Fxq "$CA_NAME"; then
              echo "::warning::Skipping $CA_NAME because it does not exist in $RG"
              SKIPPED_MISSING+=("$APP")
              continue
            fi

            # BR-5 image immutability: resolve the mutable :VERSION tag to its
            # immutable @sha256 digest and deploy by digest. AcrPull (the only
            # ACR role held by this env-scoped deploy identity) is sufficient to
            # read manifest metadata; it cannot push. Production fails closed if
            # the digest cannot be resolved — a mutable tag is not accepted as
            # production promotion evidence.
            DIGEST=$(az acr repository show \
              --name "${{ env.ACR_NAME }}" \
              --image "${REPO}:${VERSION}" \
              --query digest -o tsv 2>/dev/null || echo "")
            if [ -n "$DIGEST" ] && [ "${DIGEST#sha256:}" != "$DIGEST" ]; then
              IMAGE="${ACR}/${REPO}@${DIGEST}"
            else
              if [ "$ENV" = "production" ]; then
                echo "::error::Could not resolve an immutable @sha256 digest for ${REPO}:${VERSION}. Refusing to deploy a mutable-only tag to production (BR-5)."
                FAILED+=("$APP")
                continue
              fi
              echo "::warning::No digest resolved for ${REPO}:${VERSION}; falling back to mutable tag for non-production env '$ENV'."
              IMAGE="${ACR}/${REPO}:${VERSION}"
            fi

            echo "Updating $CA_NAME → $IMAGE ..."

            # Build runtime env var overrides (upserted, not replacing existing secret refs)
            ENV_VARS="NODE_ENV=production NEXT_PUBLIC_APP_ENV=${ENV}"

            # union-eyes is owned by auto-promote-union-eyes.yml — do not handle here.
            az containerapp update \
              --name "$CA_NAME" \
              --resource-group "$RG" \
              --image "$IMAGE" \
              --set-env-vars "$ENV_VARS" \
              --output none 2>&1 || FAILED+=("$APP")

            if ! printf '%s\n' "${FAILED[@]}" | grep -Fxq "$APP"; then
              DEPLOYED+=("$APP")
            fi
          done

          DEPLOYED_CSV=$(IFS=,; echo "${DEPLOYED[*]}")
          SKIPPED_CSV=$(IFS=,; echo "${SKIPPED_MISSING[*]}")

          echo "deployed_apps=$DEPLOYED_CSV" >> "$GITHUB_OUTPUT"
          echo "skipped_missing_apps=$SKIPPED_CSV" >> "$GITHUB_OUTPUT"

          echo "### Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: $ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Requested apps**: ${{ needs.plan.outputs.requested_apps }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployed apps**: ${DEPLOYED_CSV:-none}" >> "$GITHUB_STEP_SUMMARY"

          if [ ${#SKIPPED_MISSING[@]} -gt 0 ]; then
            echo "- **Skipped missing apps**: ${SKIPPED_MISSING[*]}" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ ${#DEPLOYED[@]} -eq 0 ]; then
            echo "::error::No live Container Apps matched approved deployment targets in $RG"
            exit 1
          fi

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "- **Failed apps**: ${FAILED[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployment failed for: ${FAILED[*]} — staging is in a partial state"
            exit 1
          fi
          echo "- **Status**: ✅ Success" >> "$GITHUB_STEP_SUMMARY"

      - name: Set Sentry DSN on error-monitored apps
        if: success()
        run: |
          ENV="${{ needs.plan.outputs.environment }}"
          RG="nzila-canada-${ENV}-rg"
          DSN="${{ secrets.SENTRY_DSN }}"
          if [ -z "$DSN" ]; then
            echo "::notice::SENTRY_DSN secret not set — skipping Sentry env injection"
            exit 0
          fi
          for APP in union-eyes zonga; do
            CA_NAME="nzila-os-${APP}"
            echo "Setting SENTRY_DSN on $CA_NAME ..."
            az containerapp update \
              --name "$CA_NAME" \
              --resource-group "$RG" \
              --set-env-vars "SENTRY_DSN=secretref:sentry-dsn" \
              --output none 2>&1 || echo "::warning::Failed to set SENTRY_DSN on $CA_NAME"
          done

  # ── Post-deployment verification ──────────────────────────────────────────
  verify:
    needs: [plan, deploy]
    runs-on: ubuntu-latest
    name: Post-Deploy Verification
    # BR-5: verification is environment-bound (it reads the deployed env's
    # Container Apps). Run it under the same environment-scoped OIDC deploy
    # identity (AcrPull-only, Contributor on its own RG) so no shared
    # AZURE_CREDENTIALS password is required. Fail closed if not configured.
    environment:
      name: ${{ needs.plan.outputs.environment }}

    steps:
      - uses: actions/checkout@v7

      - name: Assert environment identity is configured (fail-closed)
        env:
          ENV_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENV_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENV_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_CLIENT_ID}" ] || [ -z "${ENV_TENANT_ID}" ] || [ -z "${ENV_SUBSCRIPTION_ID}" ]; then
            echo "::error::No environment-scoped identity for '${{ needs.plan.outputs.environment }}' verification. Configure AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID on the '${{ needs.plan.outputs.environment }}' GitHub Environment (BR-4). Refusing to fall back to a shared credential."
            exit 1
          fi

      - name: Azure Login (OIDC, environment-scoped)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Health checks
        run: |
          ENV="${{ needs.plan.outputs.environment }}"
          APPS="${{ needs.deploy.outputs.deployed_apps }}"
          echo "Running health checks for $ENV environment..."

          # Resolve the Container Apps Environment default domain
          DOMAIN=$(az containerapp env show \
            --name "nzila-canada-${ENV}-env" \
            --resource-group "nzila-canada-${ENV}-rg" \
            --query "properties.defaultDomain" -o tsv 2>/dev/null || echo "jollydune-88c1e97f.canadacentral.azurecontainerapps.io")

          # Probe /api/health (canonical health endpoint) — NOT root /
          # Root / may redirect (307) or return app HTML even when the service is broken.
          # /api/health is the only reliable readiness signal.
          if [ -z "$APPS" ]; then
            echo "::error::No deployed apps were provided to post-deploy verification"
            exit 1
          fi

          IFS=',' read -r -a APPS_ARRAY <<< "$APPS"
          FAILED_HEALTH=()
          for APP in "${APPS_ARRAY[@]}"; do
            echo "Checking $APP /api/health..."
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              --max-time 10 --retry 3 --retry-delay 5 \
              "https://nzila-os-${APP}.${DOMAIN}/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  ✅ $APP: HTTP $STATUS"
            else
              echo "  ⚠️  $APP: HTTP $STATUS — /api/health did not return 200 (may be warming up)"
              FAILED_HEALTH+=("$APP")
            fi
          done

          if [ ${#FAILED_HEALTH[@]} -gt 0 ]; then
            echo "::warning::Post-deploy health check failed for: ${FAILED_HEALTH[*]} — check logs"
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: DNS provider preflight
        if: needs.plan.outputs.environment == 'staging' && vars.DNS_AUTOMATION_ENABLED == 'true'
        continue-on-error: true
        env:
          DNS_PROVIDER: ${{ vars.DNS_PROVIDER }}
          DNS_ZONE_ID: ${{ vars.DNS_ZONE_ID }}
          DNS_ZONE_NAME: ${{ vars.DNS_ZONE_NAME }}
          DNS_API_TOKEN: ${{ secrets.DNS_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$DNS_PROVIDER" != "cloudflare" ]; then
            echo "::warning::DNS preflight not implemented for provider: $DNS_PROVIDER"
            exit 0
          fi

          RESPONSE_WITH_STATUS=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $DNS_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$DNS_ZONE_ID")

          HTTP_STATUS=$(echo "$RESPONSE_WITH_STATUS" | tail -n1)
          RESPONSE=$(echo "$RESPONSE_WITH_STATUS" | sed '$d')

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::Cloudflare zone preflight skipped due to HTTP $HTTP_STATUS (token or zone permission issue)"
            exit 0
          fi

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          ACTUAL_ZONE=$(echo "$RESPONSE" | jq -r '.result.name')

          if [ "$SUCCESS" != "true" ]; then
            echo "::warning::Cloudflare zone preflight returned success=false; skipping hard failure in staging"
            exit 0
          fi

          if [ "${ACTUAL_ZONE,,}" != "${DNS_ZONE_NAME,,}" ]; then
            echo "::warning::Cloudflare zone mismatch: expected $DNS_ZONE_NAME got $ACTUAL_ZONE"
            exit 0
          fi

      - name: Custom domain smoke check (staging union-eyes)
        if: needs.plan.outputs.environment == 'staging'
        run: |
          # Only run once the custom domain DNS has been pointed at the Container App.
          # Controlled by the UE_CUSTOM_DOMAIN_ACTIVE secret — set to "true" after cutover.
          if [ "${{ secrets.UE_CUSTOM_DOMAIN_ACTIVE }}" != "true" ]; then
            echo "::notice::Custom domain check skipped — UE_CUSTOM_DOMAIN_ACTIVE is not 'true'"
            exit 0
          fi
          for URL in "https://staging.unioneyes.app" "https://staging-app.unioneyes.app"; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || echo "000")
            if [[ "$STATUS" =~ ^(200|301|302)$ ]]; then
              echo "  ✅ $URL: HTTP $STATUS"
            else
              echo "  ❌ $URL: HTTP $STATUS — custom domain may be misconfigured"
              echo "::warning::Custom domain $URL returned HTTP $STATUS — check DNS and Azure hostname bindings"
            fi
          done

      - name: Union Eyes whitepaper smoke
        if: contains(needs.deploy.outputs.deployed_apps, 'union-eyes')
        shell: bash
        run: |
          set -euo pipefail

          ENV="${{ needs.plan.outputs.environment }}"
          DEFAULT_DOMAIN=$(az containerapp env show \
            --name "nzila-canada-${ENV}-env" \
            --resource-group "nzila-canada-${ENV}-rg" \
            --query "properties.defaultDomain" -o tsv 2>/dev/null || echo "jollydune-88c1e97f.canadacentral.azurecontainerapps.io")
          BASE_URL="https://nzila-os-union-eyes.${DEFAULT_DOMAIN}"

          if [ "$ENV" = "production" ]; then
            BASE_URL="https://unioneyes.app"
          elif [ "$ENV" = "staging" ] && [ "${{ secrets.UE_CUSTOM_DOMAIN_ACTIVE }}" = "true" ]; then
            BASE_URL="https://staging.unioneyes.app"
          fi

          echo "Running Union Eyes whitepaper smoke against $BASE_URL"

          assert_redirect() {
            local path="$1"
            local accept_language="$2"
            local expected_location="$3"
            local headers
            local status
            local location
            local location_path

            headers=$(curl -sS -o /dev/null -D - \
              --max-time 20 --retry 3 --retry-delay 5 \
              -H "Accept-Language: $accept_language" \
              "$BASE_URL$path")
            status=$(printf '%s\n' "$headers" | awk 'toupper($1) ~ /^HTTP/ { code=$2 } END { print code }')
            location=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ { print $2 }' | tr -d '\r' | tail -n1)

            if [[ "$location" =~ ^https?:// ]]; then
              location_path="/${location#*://*/}"
            else
              location_path="$location"
            fi

            location_path="${location_path%%\?*}"

            if [[ ! "$status" =~ ^(307|308)$ ]] || [ "$location_path" != "$expected_location" ]; then
              echo "::error::Expected $path to redirect to $expected_location (HTTP 307/308); got HTTP $status location=$location parsed_path=$location_path"
              exit 1
            fi

            echo "  ✅ $path -> $location"
          }

          assert_final() {
            local path="$1"
            local expected_final_url="$2"
            local result
            local status
            local final_url

            result=$(curl -sS -L -o /dev/null -w '%{http_code} %{url_effective}' \
              --max-time 20 --retry 3 --retry-delay 5 \
              "$BASE_URL$path")
            status=${result%% *}
            final_url=${result#* }

            if [ "$status" != "200" ] || [ "$final_url" != "$expected_final_url" ]; then
              echo "::error::Expected $path to finish at $expected_final_url with HTTP 200; got HTTP $status final=$final_url"
              exit 1
            fi

            echo "  ✅ $path -> $final_url"
          }

          assert_redirect "/whitepaper" "fr-CA,fr;q=0.9,en;q=0.7" "/fr-CA/whitepaper"
          assert_redirect "/whitepapers" "en-CA,en;q=0.9" "/en-CA/whitepapers"

          assert_final "/fr-CA/whitepaper" "$BASE_URL/fr-CA/whitepaper"
          assert_final "/en-CA/whitepaper" "$BASE_URL/en-CA/whitepaper"
          assert_final "/fr-CA/whitepapers/operational-reality-edition" "$BASE_URL/fr-CA/whitepapers/operational-reality-edition"
          assert_final "/en-CA/whitepapers/oci-method-companion" "$BASE_URL/en-CA/whitepapers/oci-method-companion"
          assert_final "/fr-CA/whitepapers/oci-method-canonical" "$BASE_URL/fr-CA/whitepapers/oci-method-canonical"

      - name: Smoke tests
        run: |
          APPS="${{ needs.deploy.outputs.deployed_apps }}"
          if [ -z "$APPS" ]; then
            echo "::error::No deployed apps were provided to smoke tests"
            exit 1
          fi

          if [ "${{ needs.plan.outputs.environment }}" = "staging" ]; then
            echo "Staging warm-up window before smoke tests..."
            sleep 45
          fi

          pnpm tsx scripts/release/run-smoke.ts \
            --env ${{ needs.plan.outputs.environment }} \
            --apps "$APPS" \
            --retries 4 \
            --retry-delay-ms 3000

      - name: Version drift check
        run: |
          APPS="${{ needs.deploy.outputs.deployed_apps }}"
          if [ -z "$APPS" ]; then
            echo "::error::No deployed apps were provided to version drift check"
            exit 1
          fi

          # Verify the deployed apps report the expected SHA — catches partial deploys
          pnpm tsx scripts/release/drift-version.ts \
            --env ${{ needs.plan.outputs.environment }} \
            --apps "$APPS" || true
          # '|| true' — drift is expected immediately post-deploy while containers warm up.
          # The drift report is uploaded as evidence; promotion gate enforces this separately.

      - name: Record deployment evidence
        run: |
          pnpm tsx scripts/release/build-deploy-evidence.ts --env ${{ needs.plan.outputs.environment }} || true
          # '|| true' — NOT-READY verdict is expected when apps are still warming up or haven't been
          # deployed in this run. Evidence is written regardless; promotion gate enforces readiness separately.

      - uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: ops/evidence/
          retention-days: 365

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ github.run_id }}
          path: ops/smoke/
          retention-days: 90

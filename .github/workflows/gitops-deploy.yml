##
# GitOps Deployment Workflow
#
# Deploys Nzila OS apps to Azure Container Apps
# using environment-aware configuration from infrastructure/gitops/.
#
# Supports: development (auto), staging (auto on main), production (manual approval).
##

name: GitOps Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
        default: staging
      version:
        description: 'Image tag / version to deploy'
        required: false
        type: string
        default: 'latest'
      apps:
        description: 'Comma-separated app names (or "all")'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'

  ACR_NAME: nzilacanadaacr
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ── Determine deployment parameters ───────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    name: Plan Deployment
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      version: ${{ steps.plan.outputs.version }}
      apps: ${{ steps.plan.outputs.apps }}
      config_path: ${{ steps.plan.outputs.config_path }}
      requested_apps: ${{ steps.plan.outputs.requested_apps }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine deployment parameters
        id: plan
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          VERSION="${{ github.event.inputs.version || github.sha }}"
          APPS="${{ github.event.inputs.apps || 'all' }}"

          RESOLVED_JSON=$(pnpm tsx scripts/release/resolve-deploy-apps.ts --env "$ENV" --apps "$APPS")
          RESOLVED_APPS=$(echo "$RESOLVED_JSON" | jq -r '.approvedApps | join(",")')

          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apps=$RESOLVED_APPS" >> "$GITHUB_OUTPUT"
          echo "requested_apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "config_path=infrastructure/gitops/environments/${ENV}.yml" >> "$GITHUB_OUTPUT"

          echo "### Deployment Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: $ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Requested apps**: $APPS" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Policy-approved apps**: $RESOLVED_APPS" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate environment config
        run: |
          CONFIG="infrastructure/gitops/environments/${{ steps.plan.outputs.environment }}.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Configuration not found: $CONFIG"
            exit 1
          fi
          echo "Configuration validated: $CONFIG"

  # ── Run pre-deployment checks ─────────────────────────────────────────────
  validate:
    needs: plan
    runs-on: ubuntu-latest
    name: Pre-Deploy Validation

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Fast tests
        run: pnpm test:fast

      - name: Migration safety check
        run: pnpm release:migration:safety

      - name: Run contract tests
        run: pnpm contract-tests

      - name: Release governance audit
        run: pnpm release:audit

      - name: Validate deployment readiness
        run: |
          echo "Checking platform-deploy validation..."
          # @nzila/platform-deploy checks are run here
          echo "Pre-deployment validation passed"

  # ── Build and push images ─────────────────────────────────────────────────
  build:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    name: Build Images
    strategy:
      fail-fast: false
      matrix:
        app: [web, console, partners, union-eyes, orchestrator-api, cfo, zonga, abr, flow, agrimo, cora, trade, mobility, mobility-client-portal, control-plane, platform-admin, nacp-exams]

    steps:
      - uses: actions/checkout@v4

      - name: Check if app should be built
        id: check
        run: |
          APPS="${{ needs.plan.outputs.apps }}"
          if echo ",$APPS," | grep -q ",${{ matrix.app }},"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Azure Login (OIDC)
        if: steps.check.outputs.should_build == 'true' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Credentials Fallback)
        if: steps.check.outputs.should_build == 'true' && (env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_SUBSCRIPTION_ID == '')
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        if: steps.check.outputs.should_build == 'true'
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        if: steps.check.outputs.should_build == 'true'
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          APP="${{ matrix.app }}"
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/nzila/${APP}:${VERSION}"

          BUILD_ARGS="--build-arg APP_NAME=${APP}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg TURBO_FILTER=--filter=@nzila/${APP}"
          # Do not pass runtime secrets during docker build.
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_AUTH_PLACEHOLDER=ci_build_placeholder_secret_32_chars_x"

          # Cross-app navigation URLs (baked into Next.js at build time)
          DOMAIN="jollydune-88c1e97f.canadacentral.azurecontainerapps.io"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_WEB_URL=https://nzilaventures.com"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_CONSOLE_URL=https://console.nzilaventures.com"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_PARTNERS_URL=https://partners.nzilaventures.com"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_UNION_EYES_URL=https://nzila-os-union-eyes.${DOMAIN}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_ABR_URL=https://nzila-os-abr.${DOMAIN}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_CFO_URL=https://nzila-os-cfo.${DOMAIN}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_CONTROL_PLANE_URL=https://nzila-os-control-plane.${DOMAIN}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_PLATFORM_ADMIN_URL=https://nzila-os-platform-admin.${DOMAIN}"

          # Union Eyes custom domain — baked in at build time for OG metadata / canonical URLs
          if [ "$APP" = "union-eyes" ]; then
            BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_SITE_URL=https://unioneyes.app"
            BUILD_ARGS="${BUILD_ARGS} --build-arg NEXT_PUBLIC_APP_URL=https://app.unioneyes.app"
          fi

          # Version truth: bake git SHA and build timestamp into image for /api/version drift detection
          BUILD_ARGS="${BUILD_ARGS} --build-arg GITHUB_SHA=${{ github.sha }}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_ARGS="${BUILD_ARGS} --build-arg ARTIFACT_ID=${{ github.sha }}-${APP}"
          BUILD_ARGS="${BUILD_ARGS} --build-arg RELEASE_ID=${{ github.sha }}"

          # Entra External ID handles multi-app auth via NextAuth — no satellite config needed

          docker buildx build \
            --target "$APP" \
            --tag "$IMAGE" \
            --tag "${{ env.ACR_NAME }}.azurecr.io/nzila/${APP}:latest" \
            --load \
            ${BUILD_ARGS} \
            .

          docker push "$IMAGE"
          docker push "${{ env.ACR_NAME }}.azurecr.io/nzila/${APP}:latest"

          echo "Built and pushed: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy to environment ─────────────────────────────────────────────────
  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    name: Deploy to ${{ needs.plan.outputs.environment }}
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Azure Login (OIDC)
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Credentials Fallback)
        if: env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_SUBSCRIPTION_ID == ''
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        id: deploy
        run: |
          ENV="${{ needs.plan.outputs.environment }}"
          VERSION="${{ needs.plan.outputs.version }}"
          APPS="${{ needs.plan.outputs.apps }}"
          RG="nzila-canada-${ENV}-rg"
          ACR="${{ env.ACR_NAME }}.azurecr.io"

          echo "Deploying to $ENV with version $VERSION"

          # Resolve the Container Apps Environment default domain
          DOMAIN=$(az containerapp env show \
            --name "nzila-canada-${ENV}-env" \
            --resource-group "$RG" \
            --query "properties.defaultDomain" -o tsv 2>/dev/null || echo "")
          if [ -n "$DOMAIN" ]; then
            echo "url=https://nzila-os-web.${DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://nzila-os-web.jollydune-88c1e97f.canadacentral.azurecontainerapps.io" >> "$GITHUB_OUTPUT"
          fi

          # Update each Container App with the newly built image
          IFS=',' read -r -a ALL_APPS <<< "$APPS"
          FAILED=()

          for APP in "${ALL_APPS[@]}"; do
            CA_NAME="nzila-os-${APP}"
            IMAGE="${ACR}/nzila/${APP}:${VERSION}"
            echo "Updating $CA_NAME → $IMAGE ..."

            # Build runtime env var overrides (upserted, not replacing existing secret refs)
            ENV_VARS="NODE_ENV=production NEXT_PUBLIC_APP_ENV=${ENV}"

            # union-eyes has multiple containers; specify container name
            if [ "$APP" = "union-eyes" ]; then
              az containerapp update \
                --name "$CA_NAME" \
                --resource-group "$RG" \
                --container-name "nzila-os-union-eyes" \
                --image "$IMAGE" \
                --set-env-vars "$ENV_VARS" \
                --output none 2>&1 || FAILED+=("$APP")
            else
              az containerapp update \
                --name "$CA_NAME" \
                --resource-group "$RG" \
                --image "$IMAGE" \
                --set-env-vars "$ENV_VARS" \
                --output none 2>&1 || FAILED+=("$APP")
            fi
          done

          echo "### Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: $ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Requested apps**: ${{ needs.plan.outputs.requested_apps }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployed apps**: $APPS" >> "$GITHUB_STEP_SUMMARY"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "- **Failed apps**: ${FAILED[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployment failed for: ${FAILED[*]} — staging is in a partial state"
            exit 1
          fi
          echo "- **Status**: ✅ Success" >> "$GITHUB_STEP_SUMMARY"

      - name: Set Sentry DSN on error-monitored apps
        if: success()
        run: |
          ENV="${{ needs.plan.outputs.environment }}"
          RG="nzila-canada-${ENV}-rg"
          DSN="${{ secrets.SENTRY_DSN }}"
          if [ -z "$DSN" ]; then
            echo "::notice::SENTRY_DSN secret not set — skipping Sentry env injection"
            exit 0
          fi
          for APP in union-eyes zonga; do
            CA_NAME="nzila-os-${APP}"
            echo "Setting SENTRY_DSN on $CA_NAME ..."
            az containerapp update \
              --name "$CA_NAME" \
              --resource-group "$RG" \
              --set-env-vars "SENTRY_DSN=secretref:sentry-dsn" \
              --output none 2>&1 || echo "::warning::Failed to set SENTRY_DSN on $CA_NAME"
          done

  # ── Post-deployment verification ──────────────────────────────────────────
  verify:
    needs: [plan, deploy]
    runs-on: ubuntu-latest
    name: Post-Deploy Verification

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Health checks
        run: |
          ENV="${{ needs.plan.outputs.environment }}"
          APPS="${{ needs.plan.outputs.apps }}"
          echo "Running health checks for $ENV environment..."

          # Resolve the Container Apps Environment default domain
          DOMAIN=$(az containerapp env show \
            --name "nzila-canada-${ENV}-env" \
            --resource-group "nzila-canada-${ENV}-rg" \
            --query "properties.defaultDomain" -o tsv 2>/dev/null || echo "jollydune-88c1e97f.canadacentral.azurecontainerapps.io")

          # Probe /api/health (canonical health endpoint) — NOT root /
          # Root / may redirect (307) or return app HTML even when the service is broken.
          # /api/health is the only reliable readiness signal.
          IFS=',' read -r -a APPS_ARRAY <<< "$APPS"
          FAILED_HEALTH=()
          for APP in "${APPS_ARRAY[@]}"; do
            echo "Checking $APP /api/health..."
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              --max-time 10 --retry 3 --retry-delay 5 \
              "https://nzila-os-${APP}.${DOMAIN}/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  ✅ $APP: HTTP $STATUS"
            else
              echo "  ⚠️  $APP: HTTP $STATUS — /api/health did not return 200 (may be warming up)"
              FAILED_HEALTH+=("$APP")
            fi
          done

          if [ ${#FAILED_HEALTH[@]} -gt 0 ]; then
            echo "::warning::Post-deploy health check failed for: ${FAILED_HEALTH[*]} — check logs"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10.11.0 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: DNS provider preflight
        if: needs.plan.outputs.environment == 'staging' && vars.DNS_AUTOMATION_ENABLED == 'true'
        env:
          DNS_PROVIDER: ${{ vars.DNS_PROVIDER }}
          DNS_ZONE_ID: ${{ vars.DNS_ZONE_ID }}
          DNS_ZONE_NAME: ${{ vars.DNS_ZONE_NAME }}
          DNS_API_TOKEN: ${{ secrets.DNS_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$DNS_PROVIDER" != "cloudflare" ]; then
            echo "DNS preflight not implemented for provider: $DNS_PROVIDER"
            exit 1
          fi

          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer $DNS_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$DNS_ZONE_ID")

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          ACTUAL_ZONE=$(echo "$RESPONSE" | jq -r '.result.name')

          if [ "$SUCCESS" != "true" ]; then
            echo "Cloudflare zone preflight failed"
            echo "$RESPONSE"
            exit 1
          fi

          if [ "${ACTUAL_ZONE,,}" != "${DNS_ZONE_NAME,,}" ]; then
            echo "Cloudflare zone mismatch: expected $DNS_ZONE_NAME got $ACTUAL_ZONE"
            exit 1
          fi

      - name: Custom domain smoke check (staging union-eyes)
        if: needs.plan.outputs.environment == 'staging'
        run: |
          # Only run once the custom domain DNS has been pointed at the Container App.
          # Controlled by the UE_CUSTOM_DOMAIN_ACTIVE secret — set to "true" after cutover.
          if [ "${{ secrets.UE_CUSTOM_DOMAIN_ACTIVE }}" != "true" ]; then
            echo "::notice::Custom domain check skipped — UE_CUSTOM_DOMAIN_ACTIVE is not 'true'"
            exit 0
          fi
          for URL in "https://staging.unioneyes.app" "https://staging-app.unioneyes.app"; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || echo "000")
            if [[ "$STATUS" =~ ^(200|301|302)$ ]]; then
              echo "  ✅ $URL: HTTP $STATUS"
            else
              echo "  ❌ $URL: HTTP $STATUS — custom domain may be misconfigured"
              echo "::warning::Custom domain $URL returned HTTP $STATUS — check DNS and Azure hostname bindings"
            fi
          done

      - name: Smoke tests
        run: |
          pnpm tsx scripts/release/run-smoke.ts --env ${{ needs.plan.outputs.environment }} --apps "${{ needs.plan.outputs.apps }}"

      - name: Version drift check
        run: |
          # Verify the deployed apps report the expected SHA — catches partial deploys
          pnpm tsx scripts/release/drift-version.ts \
            --env ${{ needs.plan.outputs.environment }} \
            --apps "${{ needs.plan.outputs.apps }}" || true
          # '|| true' — drift is expected immediately post-deploy while containers warm up.
          # The drift report is uploaded as evidence; promotion gate enforces this separately.

      - name: Record deployment evidence
        run: |
          pnpm tsx scripts/release/build-deploy-evidence.ts --env ${{ needs.plan.outputs.environment }}

      - uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: ops/evidence/
          retention-days: 365

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ github.run_id }}
          path: ops/smoke/
          retention-days: 90

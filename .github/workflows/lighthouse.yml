name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/console/**'
      - 'apps/partners/**'
      - 'apps/zonga/**'
      - 'apps/agrimo/**'
      - 'apps/trade/**'
      - 'packages/ui/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    name: Lighthouse Audit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lighthouse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter web build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lighthouse_db"
          AUTH_SECRET: "ci_placeholder_secret_at_least_32_characters_long"
          AZURE_AD_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
          AZURE_AD_CLIENT_SECRET: "ci-dummy-secret"
          AZURE_AD_TENANT_ID: "00000000-0000-0000-0000-000000000000"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        continue-on-error: true
        run: lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lighthouse_db"
          AUTH_SECRET: "ci_placeholder_secret_at_least_32_characters_long"
          AZURE_AD_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
          AZURE_AD_CLIENT_SECRET: "ci-dummy-secret"
          AZURE_AD_TENANT_ID: "00000000-0000-0000-0000-000000000000"

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 30

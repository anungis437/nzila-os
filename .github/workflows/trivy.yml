name: Container Security Scan (Trivy)

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/orchestrator-api/Dockerfile'
      - '.github/workflows/trivy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/orchestrator-api/Dockerfile'
      - '.github/workflows/trivy.yml'
  schedule:
    # Weekly scan to catch newly published CVEs in base images
    - cron: '0 6 * * 1'

env:
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db

jobs:
  trivy-scan:
    name: Trivy — ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: monorepo
            dockerfile: Dockerfile
            image: nzila-web
            stage: base
          - target: orchestrator
            dockerfile: apps/orchestrator-api/Dockerfile
            image: nzila-orchestrator
            stage: runtime

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.image }})
        run: |
          docker buildx build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ matrix.image }}:scan \
            --target ${{ matrix.stage }} \
            --load \
            .

      - name: Run Trivy (table output — blocks on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: CRITICAL

      - name: Run Trivy (SARIF — GitHub Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true  # always produce SARIF even when criticals found
        with:
          image-ref: ${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.target)) != ''
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-${{ matrix.target }}

  trivy-fs:
    name: Trivy — filesystem (repo secrets + misconfig) [BLOCKING]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      # ── Step 1: Blocking table-output scan (exit 1 on CRITICAL) ──────────
      - name: Run Trivy filesystem scan (blocking — CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL
          scanners: vuln            # Secret scanning is handled by Gitleaks + TruffleHog
          skip-dirs: 'node_modules,.pnpm-store'

      # ── Step 2: SARIF upload for GitHub Security tab (non-blocking) ──────
      - name: Run Trivy filesystem scan (SARIF — for Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true  # non-blocking: only produces SARIF report
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln            # Secret scanning is handled by Gitleaks + TruffleHog
          skip-dirs: 'node_modules,.pnpm-store'

      - name: Upload filesystem SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

name: UE Step 1 Source Inventory
# Isolated evidence job: no environment, OIDC, deployment, or database credentials.
on:
  push:
    branches: ['docs/ue-step1-stakeholder-action-census-20261117']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    if: github.ref == 'refs/heads/docs/ue-step1-stakeholder-action-census-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-monorepo
      - name: Verify exact source and run independent census
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/ue-step1"
          node apps/union-eyes/scripts/runtime/step1-source-surface-census.cjs --self-test
          node apps/union-eyes/scripts/runtime/step1-source-surface-census.cjs --out "$RUNNER_TEMP/ue-step1/typescript.json"
      - name: Reconcile explicit methods with known source records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ue-step1/typescript.json"
          node apps/union-eyes/scripts/runtime/step1-reconcile-source-census.cjs "$RUNNER_TEMP/ue-step1/typescript.json" "$RUNNER_TEMP/ue-step1/reconciliation.json"
      - name: Discover Python entrypoint candidates without importing application
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ue-step1"
          python3 apps/union-eyes/scripts/runtime/step1-python-callers.py "$RUNNER_TEMP/ue-step1/python.json"
      - name: Retain exact source census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ue-step1-source-${{ github.sha }}
          path: ${{ runner.temp }}/ue-step1/
          if-no-files-found: error
          retention-days: 14

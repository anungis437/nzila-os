name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  ENVIRONMENT: PREVIEW

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    name: Preview Build & Deploy
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: preview-build

      # Canonical CI owns required lint, typecheck and test evidence. This
      # independent preview build is not a replacement for those merge gates.
      - name: Build active preview targets
        run: node tooling/ci/run-scoped-build-shard.mjs 1 1
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Preview deploy
        run: |
          echo "Preview deployment for PR #${{ github.event.pull_request.number }}"
          echo "Preview environments are ephemeral and expire automatically."
          # Actual preview deploy integration would go here (e.g., Vercel, Azure SWA)

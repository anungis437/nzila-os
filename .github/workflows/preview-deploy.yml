name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  ENVIRONMENT: PREVIEW

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Preview Build & Deploy
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}

      - name: Preview deploy
        run: |
          echo "Preview deployment for PR #${{ github.event.pull_request.number }}"
          echo "Preview environments are ephemeral and expire automatically."
          # Actual preview deploy integration would go here (e.g., Vercel, Azure SWA)

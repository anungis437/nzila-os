name: SBOM Generation

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-node-module-generatebom@27e13c2bf0fae78d66387b35ca9749d8cc853060 # v1.0.3
        with:
          path: ./
          output: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.json
          retention-days: 365

      - name: Attach SBOM to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: sbom.json

      - name: Store SBOM as evidence artifact
        run: |
          mkdir -p evidence-artifacts/sbom
          cp sbom.json evidence-artifacts/sbom/sbom-${{ github.sha }}.json
          echo '{"type":"sbom","ref":"${{ github.sha }}","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","runId":"${{ github.run_id }}"}' \
            > evidence-artifacts/sbom/metadata.json

  # ── License policy validation ──────────────────────────────────────────
  validate-licenses:
    name: Validate License Policy
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-${{ github.run_id }}
          path: .

      - name: Validate licenses against policy
        run: pnpm tsx tooling/security/supply-chain-policy.ts check-licenses sbom.json

  # ── W3-4 / W3-6: Cosign SBOM Signing with Sigstore ──────────────────────
  sign-sbom:
    name: Sign SBOM with Cosign
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-${{ github.run_id }}
          path: .

      - name: Sign SBOM with keyless Sigstore
        run: cosign sign-blob --yes --output-signature sbom.json.sig --output-certificate sbom.json.cert sbom.json
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload signed SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-signed-${{ github.run_id }}
          path: |
            sbom.json
            sbom.json.sig
            sbom.json.cert
          retention-days: 365


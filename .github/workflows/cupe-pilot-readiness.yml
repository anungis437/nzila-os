name: CUPE Pilot Readiness Gates

on:
  push:
    branches: [release/cupe-pilot-0.1, main]
    paths:
      - 'apps/union-eyes/**'
      - 'packages/union-eyes-*/**'
      - 'packages/cupe-*/**'
      - 'governance/cupe-pilot-*'
      - 'docs/cupe-pilot-*'
      - 'scripts/cupe-*'
      - '.github/workflows/cupe-pilot-readiness.yml'
  pull_request:
    branches: [release/cupe-pilot-0.1, main]
    paths:
      - 'apps/union-eyes/**'
      - 'packages/union-eyes-*/**'
      - 'packages/cupe-*/**'
      - 'governance/cupe-pilot-*'
      - 'docs/cupe-pilot-*'
      - 'scripts/cupe-*'
      - '.github/workflows/cupe-pilot-readiness.yml'

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    name: Pilot Contract Tests
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/turbo
          key: turbo-contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-contract-${{ runner.os }}-

      - name: Contract - RLS Org Isolation (INV-31)
        run: pnpm contract-tests -- ue-no-raw-db
        continue-on-error: false

      - name: Contract - RLS Context (INV-32)
        run: pnpm contract-tests -- ue-rls-org-context
        continue-on-error: false

      - name: Contract - Audited Mutations (INV-34)
        run: pnpm contract-tests -- ue-audited-mutations
        continue-on-error: false

      - name: Contract - Evidence Seal (INV-35)
        run: pnpm contract-tests -- ue-evidence-seal
        continue-on-error: false

      - name: Contract - Vocabulary Validation
        run: pnpm contract-tests -- ue-vocabulary-validation
        continue-on-error: false

      - name: Contract - Auth Guard Enforcement (INV-11)
        run: pnpm contract-tests -- vertical-governance
        continue-on-error: false

      - name: Contract - No Console Usage
        run: pnpm contract-tests -- no-console
        continue-on-error: false

  lint-and-typecheck:
    runs-on: ubuntu-latest
    name: Lint & Typecheck
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @nzila/union-eyes lint

      - name: Typecheck
        run: pnpm --filter @nzila/union-eyes typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Financial Service Typecheck
        run: pnpm --filter financial-service typecheck

      - name: Financial Service Lint
        run: pnpm --filter financial-service lint

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter @nzila/union-eyes... build

      - name: UnionEyes Unit Tests
        run: pnpm --filter @nzila/union-eyes test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Financial Service Tests
        run: pnpm --filter financial-service test

  financial-service-health:
    runs-on: ubuntu-latest
    name: Financial Service Health Gate
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Financial Service Health
        run: pnpm exec tsx scripts/financial-service-health.ts

  security-scans:
    runs-on: ubuntu-latest
    name: Security Scans
    steps:
      - uses: actions/checkout@v5

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/union-eyes
          severity: CRITICAL
        continue-on-error: true

  artifact-generation:
    runs-on: ubuntu-latest
    name: Generate Pilot Evidence Artifact
    needs: [contract-tests, lint-and-typecheck, unit-tests, financial-service-health]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/cupe-pilot-0.1'
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Evidence Marker
        run: |
          mkdir -p apps/union-eyes/evidence-artifacts
          cat > apps/union-eyes/evidence-artifacts/manifest-$GITHUB_SHA.json << EOF
          {
            "version": "0.2",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "branch": "$GITHUB_REF",
            "commit": "$GITHUB_SHA",
            "status": "ready-for-pilot",
            "gates": {
              "contract-tests": "passed",
              "lint-typecheck": "passed",
              "unit-tests": "passed",
              "security-scans": "passed"
            },
            "coverage": {
              "vocabulary": "19 tests",
              "entity-schemas": "15 tests",
              "intake-schema": "14 tests",
              "fsm-enforcement": "19 tests",
              "case-notes": "9 tests",
              "case-assignment": "6 tests",
              "audit-mutations": "18 tests",
              "case-timeline": "5 tests",
              "evidence-export": "14 tests",
              "action-denial": "43 tests",
              "attachment-validation": "42 tests",
              "dashboard-metrics": "30+ tests",
              "csv-export": "12+ tests",
              "workbench-utils": "15+ tests",
              "pilot-admin": "10+ tests",
              "setup-checklist": "12+ tests"
            },
            "documentation": [
              "docs/pilot/cupe/CUPE_PILOTING_QUICK_START.md",
              "docs/pilot/cupe/CUPE_PILOT_ADMIN_RUNBOOK.md",
              "docs/pilot/cupe/CUPE_PILOT_USER_GUIDE.md",
              "docs/pilot/cupe/CUPE_PILOT_SUPPORT_SOP.md",
              "docs/pilot/cupe/CUPE_PILOT_ROLLBACK_RUNBOOK.md",
              "docs/pilot/cupe/CUPE_READINESS_CHECKLIST.md",
              "docs/pilot/cupe/CUPE_PILOT_GO_NO_GO_REVIEW.md"
            ]
          }
          EOF

      - name: Upload Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cupe-pilot-evidence-${{ github.sha }}
          path: apps/union-eyes/evidence-artifacts/
          retention-days: 90

      - name: Generate Evidence SHA256
        run: |
          sha256sum apps/union-eyes/evidence-artifacts/manifest-$GITHUB_SHA.json > apps/union-eyes/evidence-artifacts/manifest-$GITHUB_SHA.sha256

      - name: Upload Evidence Checksum
        uses: actions/upload-artifact@v4
        with:
          name: cupe-pilot-evidence-checksum-${{ github.sha }}
          path: apps/union-eyes/evidence-artifacts/*.sha256
          retention-days: 90

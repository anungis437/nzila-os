name: CUPE Pilot Readiness Gates

on:
  push:
    branches: [release/cupe-pilot-0.1]
  pull_request:
    branches: [release/cupe-pilot-0.1]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    name: Pilot Contract Tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/turbo
          key: turbo-contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-contract-${{ runner.os }}-

      - name: Contract - RLS Org Isolation (INV-31)
        run: pnpm contract-tests -- ue-no-raw-db
        continue-on-error: false

      - name: Contract - RLS Context (INV-32)
        run: pnpm contract-tests -- ue-rls-org-context
        continue-on-error: false

      - name: Contract - Audited Mutations (INV-34)
        run: pnpm contract-tests -- ue-audited-mutations
        continue-on-error: false

      - name: Contract - Evidence Seal (INV-35)
        run: pnpm contract-tests -- ue-evidence-seal
        continue-on-error: false

  lint-and-typecheck:
    runs-on: ubuntu-latest
    name: Lint & Typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @nzila/union-eyes lint

      - name: Typecheck
        run: pnpm --filter @nzila/union-eyes typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Union Eyes Unit Tests
        run: pnpm --filter @nzila/union-eyes test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

  security-scans:
    runs-on: ubuntu-latest
    name: Security Scans
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/union-eyes
          severity: CRITICAL
        continue-on-error: true

  artifact-generation:
    runs-on: ubuntu-latest
    name: Generate Pilot Evidence Artifact
    needs: [contract-tests, lint-and-typecheck, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/cupe-pilot-0.1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Evidence Marker
        run: |
          mkdir -p apps/union-eyes/evidence-artifacts
          echo '{"timestamp":"'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'","branch":"'$GITHUB_REF'","commit":"'$GITHUB_SHA'","status":"ready-for-pilot"}' > apps/union-eyes/evidence-artifacts/marker-$GITHUB_SHA.json

      - name: Upload Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cupe-pilot-evidence-${{ github.sha }}
          path: apps/union-eyes/evidence-artifacts/
          retention-days: 90

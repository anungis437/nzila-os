name: Dependency Audit

on:
  push:
    branches: [main, develop]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
  schedule:
    # Daily audit at 06:00 UTC
    - cron: '0 6 * * *'

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit at critical level — capture report for waiver evaluation.
      # Exit code is intentionally suppressed here; the waiver policy step
      # is the authoritative gate (it accounts for accepted/waived CVEs).
      - name: Run pnpm audit (fail on critical)
        id: audit
        run: |
          # Write report to file; allow non-zero so waiver policy is the gate (ga-check:exempt)
          node tooling/security/npm-bulk-audit.mjs --audit-level=critical --output=audit-report.json || true
          echo "Audit report written to audit-report.json"

      # Also capture a high-severity JSON report for artifact upload (always runs)
      - name: Capture high-severity audit report
        if: always()
        run: |
          set +e; node tooling/security/npm-bulk-audit.mjs --audit-level=high --output=audit-report-high.json; set -e
          echo "High/critical audit report written to audit-report-high.json"

      - name: Enforce vulnerability waiver policy
        run: |
          REPORT=audit-report.json
          [ -f "$REPORT" ] || REPORT=audit-report-high.json
          pnpm tsx tooling/security/supply-chain-policy.ts check-vulns "$REPORT"

      - name: Upload audit reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            audit-report.json
            audit-report-high.json
          retention-days: 90

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python requirements files
        run: |
          EXIT_CODE=0
          for req in $(find . -name 'requirements*.txt' -not -path '*/node_modules/*' -not -path '*/.venv/*' -not -path '*/tech-repo-scaffold/*'); do
            echo "── Auditing $req ──"
            pip-audit -r "$req" --desc || EXIT_CODE=1
          done
          exit $EXIT_CODE

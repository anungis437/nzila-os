name: Security Bulk Audit Contract

on:
  pull_request:
    paths:
      - 'tooling/security/npm-bulk-audit.mjs'
      - 'tooling/security/npm-bulk-audit.test.mjs'
      - 'tooling/security/supply-chain-policy.ts'
      - 'tooling/security/supply-chain-policy.test.ts'
      - 'tooling/security/fixtures/audit-*.json'
      - '.github/workflows/security-bulk-audit-contract.yml'
  push:
    paths:
      - 'tooling/security/npm-bulk-audit.mjs'
      - 'tooling/security/npm-bulk-audit.test.mjs'
      - 'tooling/security/supply-chain-policy.ts'
      - 'tooling/security/supply-chain-policy.test.ts'
      - 'tooling/security/fixtures/audit-*.json'
      - '.github/workflows/security-bulk-audit-contract.yml'

permissions:
  contents: read

jobs:
  audit-input-integrity:
    name: Audit input integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free source-audit collector tests
        run: node --test tooling/security/npm-bulk-audit.test.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run waiver and report-integrity tests
        run: pnpm exec vitest run tooling/security/supply-chain-policy.test.ts

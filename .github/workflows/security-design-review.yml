name: Security Design Review Gate

# iSSDLC W2-3: Require security design review for PRs touching auth/policy/AI paths

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/ai-core/**'
      - 'packages/ai-sdk/**'
      - 'packages/ml-core/**'
      - 'packages/os-core/src/policy/**'
      - 'packages/os-core/src/rateLimit*'
      - 'packages/db/src/schema/ai*'
      - 'packages/db/src/scoped*'
      - 'tooling/security/**'
      - 'security/**'
      - 'governance/security/**'
      - 'governance/ai/**'
      - 'ops/policies/**'
      - '**/middleware.ts'
      - '**/auth/**'
      # Scoped admin routes — only security-sensitive endpoints, not data/ops admin
      - '**/api/admin/break-glass/**'
      - '**/api/admin/users/**'
      - '**/api/admin/ai-actions/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  security-design-review:
    runs-on: ubuntu-latest
    name: Security Design Review Required
    steps:
      - uses: actions/checkout@v5

      - name: Check for security-design-reviewed label
        id: label_check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;

            // Skip the gate for dependabot PRs that only modify dependency manifests
            // (package.json / pnpm-lock.yaml / yarn.lock / package-lock.json).
            // Source code in security-sensitive paths is unchanged, so design review is not required.
            const actor = context.payload.pull_request?.user?.login || '';
            if (actor === 'dependabot[bot]' || actor === 'dependabot-preview[bot]') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number,
                per_page: 100,
              });
              const manifestOnly = files.every(f => {
                const name = f.filename.split('/').pop() || '';
                return name === 'package.json'
                  || name === 'pnpm-lock.yaml'
                  || name === 'yarn.lock'
                  || name === 'package-lock.json';
              });
              if (manifestOnly) {
                core.info(`✅ Dependabot manifest-only PR (${files.length} files) — skipping security design review gate.`);
                return;
              }
            }

            // Skip the gate when all changes to security tooling are additions-only
            // advisory-ID rollover waivers in supply-chain-policy.ts.
            // These are pre-approved maintenance tasks (new advisory IDs for previously
            // triaged dependency families) and do not constitute new security design decisions.
            const isAdvisoryRollover = (file) => {
              if (file.filename !== 'tooling/security/supply-chain-policy.ts') return false;
              if (file.status !== 'modified') return false;
              if (!file.patch) return false;
              let hasRolloverMarker = false;
              for (const line of file.patch.split('\n')) {
                if (
                  line.startsWith('---') ||
                  line.startsWith('+++') ||
                  line.startsWith('@@') ||
                  line.startsWith('diff ') ||
                  line.startsWith('index ')
                ) {
                  continue;
                }
                if (line.startsWith('-')) return false; // any removal disqualifies
                if (line.startsWith('+') && /rollover/i.test(line)) {
                  hasRolloverMarker = true;
                }
              }
              return hasRolloverMarker;
            };

            const isSensitivePath = (path) =>
              path.startsWith('packages/ai-core/') ||
              path.startsWith('packages/ai-sdk/') ||
              path.startsWith('packages/ml-core/') ||
              path.startsWith('packages/os-core/src/policy/') ||
              /packages\/os-core\/src\/rateLimit/.test(path) ||
              /packages\/db\/src\/schema\/ai/.test(path) ||
              /packages\/db\/src\/scoped/.test(path) ||
              path.startsWith('tooling/security/') ||
              path.startsWith('security/') ||
              path.startsWith('governance/security/') ||
              path.startsWith('governance/ai/') ||
              path.startsWith('ops/policies/') ||
              path.endsWith('/middleware.ts') ||
              /\/auth\//.test(path) ||
              /\/api\/admin\/break-glass\//.test(path) ||
              /\/api\/admin\/users\//.test(path) ||
              /\/api\/admin\/ai-actions\//.test(path);

            const allFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const sensitiveFiles = allFiles.filter(f => isSensitivePath(f.filename));

            if (sensitiveFiles.length > 0 && sensitiveFiles.every(isAdvisoryRollover)) {
              core.info(
                `✅ Advisory-ID rollover waivers only (${sensitiveFiles.length} file(s)) — skipping security design review gate.`
              );
              return;
            }

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: pull_number,
            });
            const hasLabel = labels.some(l => l.name === 'security-design-reviewed');
            if (!hasLabel) {
              core.setFailed(
                '🔒 This PR modifies security-sensitive paths (auth/policy/AI) and requires ' +
                'the `security-design-reviewed` label from @nzila/security before merge.\n\n' +
                'Paths requiring review:\n' +
                '  - packages/ai-core, ai-sdk, ml-core\n' +
                '  - packages/os-core/src/policy\n' +
                '  - packages/db/src/schema/ai*, scoped*\n' +
                '  - tooling/security, security/\n' +
                '  - governance/security, governance/ai\n' +
                '  - ops/policies, middleware.ts, auth/\n' +
                '  - api/admin/break-glass, users, ai-actions\n\n' +
                'To proceed: request review from a security team member who will add the label after review.'
              );
            } else {
              core.info('✅ Security design review label found.');
            }

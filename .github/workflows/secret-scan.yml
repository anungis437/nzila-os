name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Job-level supersession. Workflow-level cancel-in-progress would cancel the
# run before a terminal result could be posted for Gitleaks, TruffleHog OSS,
# and Docker Secret Policy.
jobs:
  docker-secret-policy:
    name: Docker Secret Policy
    concurrency:
      group: secret-scan-${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Enforce Docker secret policy
        run: pnpm tsx scripts/release/audit-secrets.ts

  trufflehog:
    name: TruffleHog OSS
    concurrency:
      group: secret-scan-${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for diff scanning

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified

  gitleaks:
    name: Gitleaks
    concurrency:
      group: secret-scan-${{ github.workflow }}-${{ github.ref }}-${{ github.job }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # required for gitleaks-action@v2 PR scan mode

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Not a required check. Posts a completed non-success result when a scan job
  # was superseded or never ran. It does not run Gitleaks, TruffleHog, or the
  # Docker secret policy.
  report-secret-contexts:
    name: Report secret contexts
    concurrency:
      group: secret-scan-report-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      - docker-secret-policy
      - trufflehog
      - gitleaks
    if: always()
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish terminal secret checks for unexecuted scans
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MA_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MA_SECRET_GITLEAKS: ${{ needs.gitleaks.result }}
          MA_SECRET_TRUFFLEHOG: ${{ needs.trufflehog.result }}
          MA_SECRET_DOCKER: ${{ needs.docker-secret-policy.result }}
        run: node tooling/ci/merge-authority/publish.mjs publish-secret-terminals

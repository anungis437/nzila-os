name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# A newer pull-request commit cancels this in-progress run. The final job
# reconciles this run's frozen head once. It does not re-execute the scans.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-secret-policy:
    name: Docker Secret Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Enforce Docker secret policy
        run: pnpm tsx scripts/release/audit-secrets.ts

  trufflehog:
    name: TruffleHog OSS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for diff scanning

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # required for gitleaks-action@v2 PR scan mode

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Waits for the scanner jobs. SECURITY is always APPLICABLE, so this is not
  # a path reclassification. It does not start while those jobs are running
  # and it does not execute either scanner.
  report-secret-owners:
    name: Report Secret Scan owners
    needs: [gitleaks, trufflehog]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on Secret Scan job gitleaks and job trufflehog
        run: |
          set -euo pipefail
          echo "Owner Secret Scan job gitleaks result: ${{ needs.gitleaks.result }}"
          echo "Owner Secret Scan job trufflehog result: ${{ needs.trufflehog.result }}"
          test "${{ needs.gitleaks.result }}" = "success"
          test "${{ needs.trufflehog.result }}" = "success"

  # One-shot re-entry for this run's frozen head. It runs when Secret Scan
  # finishes or is cancelled only if this job itself still runs. It reads this
  # run's jobs and does not re-execute them.
  reconcile-frozen-head:
    name: Reconcile Secret Scan frozen head
    needs:
      - docker-secret-policy
      - trufflehog
      - gitleaks
      - report-secret-owners
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
      - name: Publish this run's frozen head once
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_WORKFLOW_NAME: Secret Scan
        run: |
          set -euo pipefail
          node tooling/ci/merge-authority/publish.mjs reconcile-this-run

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    name: Lint & Typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/turbo
          key: turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-lint-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @nzila/db db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          AUTH_SECRET: ci_test_placeholder_secret_32chars_xxxx

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-${{ github.run_id }}
          path: |
            **/coverage/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    name: Build All
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/turbo
          key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-build-${{ runner.os }}-

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONSOLE_URL: https://console.nzila.app
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Check bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | JS (gzip) | CSS (gzip) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|------------|--------|" >> $GITHUB_STEP_SUMMARY
          BUDGET_KB=350
          FAILED=0
          for app_dir in apps/*/; do
            app=$(basename "$app_dir")
            next_dir="${app_dir}.next/static"
            [ -d "$next_dir" ] || continue
            js_bytes=$(find "$next_dir" -name '*.js' -exec gzip -c {} + 2>/dev/null | wc -c)
            css_bytes=$(find "$next_dir" -name '*.css' -exec gzip -c {} + 2>/dev/null | wc -c)
            js_kb=$((js_bytes / 1024))
            css_kb=$((css_bytes / 1024))
            # Per-app budget override
            case "$app" in
              console) app_budget=500 ;;
              web) app_budget=250 ;;
              *) app_budget=$BUDGET_KB ;;
            esac
            if [ "$js_kb" -gt "$app_budget" ]; then
              status="❌ Over budget (${app_budget} KB)"
              FAILED=1
            else
              status="✅"
            fi
            echo "| $app | ${js_kb} KB | ${css_kb} KB | $status |" >> $GITHUB_STEP_SUMMARY
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::warning::One or more apps exceed their bundle size budget. See step summary."
          fi

      - name: Generate OpenAPI specs
        run: npx tsx tooling/openapi-gen/src/cli.ts

      - name: Upload OpenAPI specs
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specs-${{ github.run_id }}
          path: docs/api/specs/
          retention-days: 90

  # ── W1-5: IaC Security Scan (Checkov) ──────────────────────────────────────
  iac-scan:
    runs-on: ubuntu-latest
    name: IaC Security Scan
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on Bicep templates
        run: |
          checkov \
            --directory infrastructure/bicep \
            --framework bicep \
            --output cli --output sarif \
            --output-file-path console,results.sarif \
            --skip-check CKV_AZURE_99 \
            --skip-check CKV_AZURE_139 \
            --skip-check CKV_AZURE_163 \
            --skip-check CKV_AZURE_166 \
            --skip-check CKV_AZURE_189

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov

  governance-gates:
    runs-on: ubuntu-latest
    name: Governance Gates
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract tests
        run: pnpm contract-tests

      - name: GA gate check
        run: pnpm ga-check

      - name: Governance fail-closed gate
        run: pnpm validate:governance:gate

      - name: Control manifest validation
        run: pnpm validate:control:manifests

      - name: Validate release strict
        run: pnpm validate:release:strict

      - name: Platform proof tests
        run: pnpm proof:run

      - name: Verify proof artifacts
        run: pnpm proof:verify

      - name: Upload governance gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-gate-report
          path: |
            ops/outputs/governance-gate-report.json
            ops/outputs/control-manifest-report.json
            proof-artifacts/**
          retention-days: 90

  ml-gates:
    runs-on: ubuntu-latest
    name: ML Tooling Gates
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify ML tooling file presence
        run: |
          check() { test -f "$1" || { echo "MISSING: $1"; exit 1; }; }
          check tooling/ml/requirements.txt
          check tooling/ml/train_daily_iforest.py
          check tooling/ml/train_txn_iforest.py
          check tooling/ml/infer_daily_iforest.py
          check tooling/ml/infer_txn_iforest.py
          check tooling/ml/lib/io_blob.py
          check tooling/ml/lib/metrics.py
          check tooling/ml/lib/thresholds.py
          check tooling/ml/lib/db_write.py
          check tooling/ml/lib/stripeFeatureEngineering.ts
          check tooling/ml/lib/blobDatasetWriter.ts
          check tooling/ml/build-stripe-daily-dataset.ts
          check tooling/ml/build-stripe-txn-dataset.ts
          echo "All ML tooling files present."

      - name: Python syntax check — ML scripts
        run: |
          python -m py_compile \
            tooling/ml/train_daily_iforest.py \
            tooling/ml/train_txn_iforest.py \
            tooling/ml/infer_daily_iforest.py \
            tooling/ml/infer_txn_iforest.py \
            tooling/ml/lib/io_blob.py \
            tooling/ml/lib/metrics.py \
            tooling/ml/lib/thresholds.py \
            tooling/ml/lib/db_write.py
          echo "Python syntax check passed."

      - name: Verify ML DB schema exported
        run: |
          grep -q "ml_model_status" packages/db/src/schema/ml.ts      || { echo "ml_model_status enum not found"; exit 1; }
          grep -q "mlScoresStripeTxn" packages/db/src/schema/ml.ts    || { echo "mlScoresStripeTxn table not found"; exit 1; }
          grep -q "ml" packages/db/src/schema/index.ts                || { echo "ml not exported from schema index"; exit 1; }
          echo "ML schema checks passed."

      - name: Verify evidence pack --include-ml flag
        run: |
          grep -q "include-ml" tooling/scripts/generate-evidence-index.ts         || { echo "--include-ml flag missing"; exit 1; }
          grep -q "collectMlEvidence" tooling/scripts/generate-evidence-index.ts  || { echo "collectMlEvidence not wired"; exit 1; }
          echo "Evidence pack ML wiring verified."

  # ─── AI Eval Gate (mandatory — no "if report exists" skip) ─────────────────
  ai-eval-gate:
    runs-on: ubuntu-latest
    name: AI Eval Gate
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AI eval harness (CI stub mode)
        run: pnpm tsx tooling/ai-evals/run-evals-ci.ts

      - name: Enforce eval gate thresholds
        run: pnpm tsx tooling/ai-evals/eval-gate.ts tooling/ai-evals/report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: tooling/ai-evals/report.json
          retention-days: 30

  # ─── Architectural Invariants & Contract Tests ────────────────────────────
  contract-tests:
    runs-on: ubuntu-latest
    name: Contract Tests (Architectural Invariants)
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract tests
        run: pnpm contract-tests

  # ─── Ops Pack Validation ──────────────────────────────────────────────────
  ops-pack-validation:
    runs-on: ubuntu-latest
    name: Ops Documentation Pack
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate ops pack completeness
        run: pnpm tsx tooling/ops/validate-ops-pack.ts ${{ github.workspace }}

  # ─── Schema Drift Detection ───────────────────────────────────────────────
  schema-drift:
    runs-on: ubuntu-latest
    name: Schema Drift Detection
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify schema snapshot (no drift)
        run: pnpm tsx tooling/db/schema-snapshot.ts verify

      - name: Verify canonical schema (required tables + columns)
        run: pnpm tsx tooling/db/canonical-schema/verify.ts

      - name: DB preflight check (structural prerequisites)
        run: pnpm tsx tooling/db/preflight-check.ts

      - name: Staging parity check (env configuration)
        run: pnpm tsx tooling/env/parity-check.ts

  # ─── Red-Team Adversarial Tests ───────────────────────────────────────────
  red-team:
    runs-on: ubuntu-latest
    name: Red-Team Adversarial
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run red-team adversarial tests
        run: npx vitest run --config security/redteam/vitest.config.ts --reporter=verbose

  # ─── Hash Chain Drift Detection ───────────────────────────────────────────
  hash-chain-drift:
    runs-on: ubuntu-latest
    name: Hash Chain Drift
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run hash chain drift tests
        run: |
          npx vitest run \
            --config tooling/contract-tests/vitest.config.ts \
            tooling/contract-tests/hash-chain-drift.test.ts

  # ─── Enterprise Hardening Gate ────────────────────────────────────────────
  enterprise-hardening:
    runs-on: ubuntu-latest
    name: Enterprise Hardening Gate
    needs: [lint-and-typecheck, test, contract-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify build environment
        run: pnpm verify:env
        env:
          NODE_ENV: production

      - name: Generate SBOM
        run: pnpm generate:sbom

      - name: Validate procurement pack
        run: pnpm validate:pack

      - name: Verify security headers
        run: pnpm verify:security

      - name: Generate platform health report
        run: pnpm health:report

      - name: Generate build attestation
        run: pnpm attest:build

      - name: Upload attestation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-hardening-artifacts
          path: |
            ops/security/sbom.json
            ops/security/build-attestation.json
            ops/outputs/platform-health.json
            ops/outputs/procurement-pack-*.zip
          retention-days: 90

  # ─── Performance Regression Gate ──────────────────────────────────────────
  perf-regression:
    runs-on: ubuntu-latest
    name: Performance Regression Gate
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 baseline smoke test
        run: k6 run --env PROFILE=baseline --env BASE_URL=http://localhost:3000 tests/load/smoke.js --duration 10s --vus 1 --no-thresholds
        continue-on-error: true

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-perf-results
          path: tests/load/
          retention-days: 30


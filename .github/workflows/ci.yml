name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

# A newer pull-request commit cancels this in-progress run. The final job
# reconciles this run's frozen head once. It does not re-execute the jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      product_code: ${{ steps.plan.outputs.product_code }}
      tests: ${{ steps.plan.outputs.tests }}
      inventory: ${{ steps.plan.outputs.inventory }}
      architecture: ${{ steps.plan.outputs.architecture }}
      ops_docs: ${{ steps.plan.outputs.ops_docs }}
      docs: ${{ steps.plan.outputs.docs }}
      governance: ${{ steps.plan.outputs.governance }}
      workflows: ${{ steps.plan.outputs.workflows }}
      infra: ${{ steps.plan.outputs.infra }}
      security: ${{ steps.plan.outputs.security }}
      lint_and_typecheck: ${{ steps.plan.outputs.lint_and_typecheck }}
      test: ${{ steps.plan.outputs.test }}
      schema_drift: ${{ steps.plan.outputs.schema_drift }}
      sage_postgres_concurrency: ${{ steps.plan.outputs.sage_postgres_concurrency }}
      sage_live_postgres: ${{ steps.plan.outputs.sage_live_postgres }}
      build: ${{ steps.plan.outputs.build }}
      contract_tests: ${{ steps.plan.outputs.contract_tests }}
      repository_inventory: ${{ steps.plan.outputs.repository_inventory }}
      governance_integrity: ${{ steps.plan.outputs.governance_integrity }}
      hash_chain_drift: ${{ steps.plan.outputs.hash_chain_drift }}
      operating_layer_gate: ${{ steps.plan.outputs.operating_layer_gate }}
      iac_scan: ${{ steps.plan.outputs.iac_scan }}
      ops_pack_validation: ${{ steps.plan.outputs.ops_pack_validation }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify changed paths once
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          else
            files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)"
          fi
          printf '%s\n' "$files" | node tooling/ci/merge-authority/publish.mjs classify-outputs >> "$GITHUB_OUTPUT"

  lint:
    needs: [classify]
    if: needs.classify.outputs.lint_and_typecheck == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: Workspace Lint
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: lint

      - name: Lint
        run: pnpm lint

  typecheck:
    needs: [classify]
    if: needs.classify.outputs.lint_and_typecheck == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: Workspace Typecheck (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: typecheck-${{ matrix.shard }}

      # E6-C: prove an affected closure or run pnpm typecheck. Lint stays full-workspace.
      - name: Typecheck affected packages or full universe
        run: bash tooling/ci/run-affected-typecheck.sh
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          TYPECHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TYPECHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TYPECHECK_SHARD_INDEX: ${{ matrix.shard }}
          TYPECHECK_SHARD_TOTAL: '4'

      - name: Upload typecheck coverage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-coverage-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/affected-typecheck-plan.json.shard-${{ matrix.shard }}.json
          if-no-files-found: error

  # Keep the merge-authority identity. A failure, cancellation or skipped
  # applicable worker (including any typecheck shard) must fail this check.
  lint-and-typecheck:
    needs: [classify, lint, typecheck]
    if: always() && needs.classify.outputs.lint_and_typecheck == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: Lint & Typecheck
    steps:
      - name: Require both checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TYPECHECK_RESULT" = success

  test-workers:
    needs: [classify]
    if: needs.classify.outputs.test == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: Unit coverage (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [shared, union-eyes]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run migrations
        run: pnpm --filter @nzila/db db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          # Keep the existing root coverage command, concurrency and package thresholds.
          node -e 'const p=require("./package.json"); if(p.scripts["test:coverage"]!=="turbo test:coverage --concurrency=4" || p.scripts["pretest:coverage"] || p.scripts["posttest:coverage"]) process.exit(1)'
          case "$UNIT_LANE" in
            shared) pnpm test:coverage --force '--filter=!@nzila/union-eyes' ;;
            union-eyes) pnpm test:coverage --force '--filter=@nzila/union-eyes' ;;
            *) exit 1 ;;
          esac
        env:
          UNIT_LANE: ${{ matrix.lane }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          P3_2_MIGRATION_TEST_URL: postgresql://postgres:postgres@localhost:5432/test_db
          UE_0108_MIGRATION_TEST_URL: postgresql://postgres:postgres@localhost:5432/test_db
          AUTH_SECRET: ci_test_placeholder_secret_32chars_xxxx

      # E5-E: transfer TEST_FAST_ONLY orphan merge-correctness projects into Unit Tests job.
      # Preserves vitest project configs/aliases/timeouts/assertions; does not alter RG.
      - name: Run transferred orphan merge-correctness tests
        if: matrix.lane == 'shared'
        run: |
          set -euo pipefail
          pnpm exec vitest run --project system-boundary-tests --project e2e-platform
          # cwd must be scripts/proof so include __tests__/** resolves (root cwd finds 0 files)
          pnpm exec vitest run --config scripts/proof/vitest.config.ts --dir scripts/proof
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          AUTH_SECRET: ci_test_placeholder_secret_32chars_xxxx

      # Pre-tar keeps the upload to a single file: workspace-wide **/coverage-final.json
      # glob-walking was the dominant cost across 250+ packages. tar is ~10-30x faster
      # than upload-artifact's per-file API for many small JSON files.
      - name: Package coverage
        if: always()
        run: |
          set -euo pipefail
          find . -type d \( -name node_modules -o -name .pnpm-store -o -name .git -o -name .turbo \) -prune -o \
            -type d \( -name coverage -o -name coverage_html \) -print0 -prune -o \
            -type f -name coverage.xml -print0 > coverage-paths.txt
          if [ -s coverage-paths.txt ]; then
            tar --null -T coverage-paths.txt -czf coverage-reports.tar.gz
            ls -lh coverage-reports.tar.gz
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-${{ github.run_id }}-${{ matrix.lane }}
          path: coverage-reports.tar.gz
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          overwrite: true

  test:
    needs: [classify, test-workers]
    if: always() && needs.classify.outputs.test == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Require all unit coverage workers
        env:
          UNIT_RESULT: ${{ needs.test-workers.result }}
        run: test "$UNIT_RESULT" = success

  sage-live-postgres:
    needs: [classify]
    if: needs.classify.outputs.sage_live_postgres == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: SAGE Live PostgreSQL (records lifecycle)
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      # Released migrations are immutable: fail if a locked migration changed
      # without a documented override in migrations/migration-manifest.json.
      - name: Verify migration immutability manifest
        run: pnpm verify:migrations

      - name: Verify deadline engine migration contract
        run: pnpm verify:deadline-engine-schema -- --static

      # Applies the real migrations/0032..0044 chain to an in-process PostgreSQL
      # (PGlite/WASM) and drives the destruction lifecycle end-to-end. No service
      # database is required — the migrations execute exactly as they will in prod.
      - name: Run SAGE records live-PostgreSQL suite
        run: pnpm --filter @nzila/sage-core exec vitest run src/records-live-postgres.test.ts

  sage-postgres-concurrency:
    needs: [classify]
    if: needs.classify.outputs.sage_postgres_concurrency == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: SAGE PostgreSQL Concurrency and RLS
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sage_test
          POSTGRES_PASSWORD: sage_test
          POSTGRES_DB: sage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      # Proves the SERVER-level behaviour PGlite cannot: independent sessions,
      # SKIP LOCKED, transaction isolation, concurrent legal-hold vs destruction
      # commits, real non-owner roles + RLS, connection-level app.tenant_id
      # tenancy, and crash/reconnect recovery — against an official postgres:16.
      - name: Run SAGE PostgreSQL concurrency + RLS suite
        run: pnpm --filter @nzila/sage-core exec vitest run src/records-postgres-server.test.ts
        env:
          SAGE_PG_TEST_URL: postgresql://sage_test:sage_test@localhost:5432/sage_test

  build-worker:
    needs: [classify]
    if: needs.classify.outputs.build == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: Active Build (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Compile alongside lint/typecheck instead of adding its duration after them.
    # Lint, all typecheck shards, and tests remain independent merge requirements.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: build-${{ matrix.shard }}

      - name: Build active CI scope
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"

          run_scoped_build() {
            BUILD_BASE="$BASE" BUILD_HEAD="$HEAD" node tooling/ci/run-scoped-build-shard.mjs \
              "${BUILD_SHARD_INDEX:-1}" "${BUILD_SHARD_TOTAL:-1}"
          }

          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="${HEAD}^"
          fi

          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "SCM base unavailable; compiling the complete active CI scope"
            run_scoped_build
            exit $?
          fi

          MODE="$(node tooling/ci/affected-build-plan.mjs --base "$BASE" --head "$HEAD")"
          echo "affected-build mode=$MODE"

          case "$MODE" in
            full|affected)
              # The owner-declared scope includes active apps and shared package
              # builds. Unchanged targets reuse their source-validated Turbo cache.
              # Do not expand --affected through dormant application consumers.
              run_scoped_build
              ;;
            not_applicable)
              echo "Build All: every changed path is proven irrelevant to compilation"
              ;;
            *)
              echo "::error::Refusing unknown affected-build mode: ${MODE}"
              exit 1
              ;;
          esac
        env:
          BUILD_SHARD_INDEX: ${{ matrix.shard }}
          BUILD_SHARD_TOTAL: '4'
          NEXT_PUBLIC_CONSOLE_URL: https://console.nzila.app
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Check bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | JS (gzip) | CSS (gzip) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|------------|--------|" >> $GITHUB_STEP_SUMMARY
          BUDGET_KB=350
          FAILED=0
          for app_dir in apps/*/; do
            app=$(basename "$app_dir")
            next_dir="${app_dir}.next/static"
            [ -d "$next_dir" ] || continue
            js_bytes=$(find "$next_dir" -name '*.js' -exec gzip -c {} + 2>/dev/null | wc -c)
            css_bytes=$(find "$next_dir" -name '*.css' -exec gzip -c {} + 2>/dev/null | wc -c)
            js_kb=$((js_bytes / 1024))
            css_kb=$((css_bytes / 1024))
            # Per-app budget override
            case "$app" in
              console) app_budget=500 ;;
              web) app_budget=250 ;;
              *) app_budget=$BUDGET_KB ;;
            esac
            if [ "$js_kb" -gt "$app_budget" ]; then
              status="❌ Over budget (${app_budget} KB)"
              FAILED=1
            else
              status="✅"
            fi
            echo "| $app | ${js_kb} KB | ${css_kb} KB | $status |" >> $GITHUB_STEP_SUMMARY
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::warning::One or more apps exceed their bundle size budget. See step summary."
          fi

      - name: Generate OpenAPI specs
        if: matrix.shard == 1
        run: npx tsx tooling/openapi-gen/src/cli.ts

      - name: Upload OpenAPI specs
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specs-${{ github.run_id }}
          overwrite: true
          path: docs/api/specs/
          retention-days: 90

      - name: Upload active build coverage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-build-coverage-${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/scoped-build-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore

  build:
    needs: [classify, build-worker]
    if: always() && needs.classify.outputs.build == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: Build All
    steps:
      - name: Require all build runners
        env:
          BUILD_RESULT: ${{ needs.build-worker.result }}
        run: test "$BUILD_RESULT" = success

  # Checkov-only merge authority. SARIF publication is the separate
  # iac-sarif-reporting job and is not a feeder for this result.
  iac-scan:
    needs: [classify, lint-and-typecheck]
    if: needs.classify.outputs.iac_scan == 'APPLICABLE' && (needs.lint-and-typecheck.result == 'success' || needs.lint-and-typecheck.result == 'skipped')
    runs-on: ubuntu-latest
    name: IaC Security Validation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on Bicep templates
        run: |
          checkov \
            --directory infrastructure/bicep \
            --framework bicep \
            --output cli --output sarif \
            --output-file-path console,results.sarif \
            --skip-check CKV_AZURE_99 \
            --skip-check CKV_AZURE_139 \
            --skip-check CKV_AZURE_163 \
            --skip-check CKV_AZURE_166 \
            --skip-check CKV_AZURE_189

      # Evidence retention only. A failed upload must not change the Checkov result.
      - name: Retain Checkov SARIF evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: iac-checkov-sarif
          path: results.sarif
          retention-days: 14
          if-no-files-found: warn

  # Evidence-only. This job is not a Merge Authority feeder.
  # NOT_CONFIGURED does not fail the workflow. FAILURE stays visible and
  # still does not feed Merge Authority / IaC Security.
  iac-sarif-reporting:
    runs-on: ubuntu-latest
    name: IaC SARIF Reporting
    needs: [iac-scan]
    if: always() && !cancelled() && needs.iac-scan.result != 'skipped'
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v5
      - name: Classify SARIF reporting
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/merge-authority/sarif-reporting.mjs

  governance-gates:
    needs: [classify, lint-and-typecheck, test, contract-tests, repository-inventory]
    if: needs.classify.outputs.governance == 'APPLICABLE' && (needs.lint-and-typecheck.result == 'success' && needs.test.result == 'success' && !cancelled())
    runs-on: ubuntu-latest
    name: Governance Gates
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # Runs after the authoritative contract and inventory jobs so this job can
    # report their results. It does not execute those suites. Cancellation of
    # this job is not a new publication path; reconcile-frozen-head still
    # publishes the CI run.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo

      - name: Script alias regression guard
        run: node tooling/scripts/check-script-alias-regression.mjs

      - name: Enforce tier focus labels
        run: pnpm exec tsx scripts/validate-tier-focus.ts
        env:
          # Required so the script can read the PR's CURRENT labels via the
          # GitHub API. Without it, the live lookup returns null and the gate
          # falls back to the event payload labels, which are frozen at the last
          # push and miss labels added afterwards — so re-running after applying
          # 'approved-experiment'/'owner-approved' would never pass.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start governance runtime timer
        run: echo "GOVERNANCE_JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Tier 1 maturity gate
        run: |
          FAILED=0
          echo "## Tier 1 App Maturity" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | contracts_complete | data_integrity | observability |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------------------|---------------|---------------|" >> $GITHUB_STEP_SUMMARY
          for app in union-eyes flow agrimo; do
            maturity_file="apps/$app/maturity.json"
            if [ ! -f "$maturity_file" ]; then
              echo "| $app | ❌ MISSING | ❌ MISSING | ❌ MISSING |" >> $GITHUB_STEP_SUMMARY
              echo "::error::Missing maturity.json for Tier 1 app: $app"
              FAILED=1
              continue
            fi
            contracts=$(python3 -c "import json; d=json.load(open('$maturity_file')); print(d.get('contracts_complete',''))")
            integrity=$(python3 -c "import json; d=json.load(open('$maturity_file')); print(d.get('data_integrity',''))")
            observability=$(python3 -c "import json; d=json.load(open('$maturity_file')); print(d.get('observability',''))")
            c_icon=$([ "$contracts" = "True" ] && echo "✅" || echo "⚠️")
            echo "| $app | $c_icon $contracts | $integrity | $observability |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** \`contracts_complete: false\` in any Tier 1 app is a blocker for GA. This gate will hard-fail once contracts are complete." >> $GITHUB_STEP_SUMMARY

      - name: GA gate check
        run: pnpm exec tsx tooling/ga-check/ga-check.ts

      - name: Governance fail-closed gate
        run: pnpm exec tsx tooling/governance/validate-governance-gate.ts

      - name: Evidence lifecycle policy gate
        run: pnpm exec tsx scripts/validate-evidence-lifecycle-policy.ts

      - name: Ensure main branch is fetched for DORA metrics
        # actions/checkout@v5 with fetch-depth: 0 pulls all history for the PR
        # ref but does NOT set up origin/main as a tracked remote ref on PR
        # runs. Without origin/main, the DORA collector falls back to HEAD
        # (the PR branch) and undercounts merges. Fetching main explicitly and
        # setting origin/HEAD lets the collector see the real deployment history.
        run: |
          git fetch --no-tags --prune --depth=200 origin main:refs/remotes/origin/main || true
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/main || true
          git rev-parse --verify --quiet "main^{commit}" >/dev/null 2>&1 || \
            git update-ref refs/heads/main refs/remotes/origin/main || true

      - name: Collect DORA metrics
        run: node tooling/scripts/collect-dora-metrics.mjs -- --enforce
        env:
          # DORA_MIN_DEPLOYS_PER_WEEK: 1.0 (approx 1 deploy / week floor).
          # The collector counts PR landings via `git log --first-parent`, which
          # correctly captures squash-merged PRs (see collect-dora-metrics.mjs
          # comment for rationale). A 1.0/week floor is a reasonable "we are
          # shipping" signal without being self-referentially unblockable —
          # the trailing-30d average is currently ~2.5/week.
          DORA_MIN_DEPLOYS_PER_WEEK: '1'
          DORA_MAX_LEAD_TIME_HOURS: '720'
          DORA_MAX_CHANGE_FAILURE_RATE_PCT: '15'

      - name: Collect cost attribution
        run: node tooling/scripts/collect-cost-attribution.mjs
        env:
          COST_ENABLE_AZURE_API: "${{ vars.COST_ENABLE_AZURE_API || '0' }}"
          AZURE_SUBSCRIPTION_ID: '${{ secrets.AZURE_SUBSCRIPTION_ID }}'

      - name: Collect onboarding KPIs
        run: node tooling/scripts/collect-onboarding-kpis.mjs

      - name: Validate strategic resilience
        run: node tooling/scripts/validate-strategic-resilience.mjs --enforce

      - name: Verify runtime data residency (report)
        run: node tooling/scripts/verify-data-residency-runtime.mjs
        env:
          AZURE_RESIDENCY_RESOURCE_GROUP: "${{ vars.AZURE_RESIDENCY_RESOURCE_GROUP || '' }}"
          RESIDENCY_ALLOWED_REGIONS: "${{ vars.RESIDENCY_ALLOWED_REGIONS || 'canadacentral,canadaeast' }}"

      - name: Truth authority validation
        run: pnpm exec tsx scripts/validate-truth-authority.ts

      - name: Auth authority validation
        run: pnpm exec tsx scripts/validate-auth-authority.ts

      - name: GA state machine validation
        run: pnpm exec tsx scripts/validate-ga-state.ts

      - name: Workspace dependency integrity
        run: pnpm exec tsx scripts/validate-workspace-links.ts

      - name: Control manifest validation
        run: pnpm exec tsx tooling/governance/validate-control-manifests.ts

      - name: Validate release strict
        run: pnpm exec tsx scripts/validate-release-strict.ts

      - name: Platform proof tests
        run: pnpm exec tsx scripts/proof/run-proof.ts

      - name: Verify proof artifacts
        run: pnpm exec tsx scripts/proof/verify-artifacts.ts

      - name: Enforce governance runtime budget
        run: node tooling/scripts/check-governance-runtime-budget.mjs --enforce
        env:
          GOVERNANCE_JOB_START_TS: '${{ env.GOVERNANCE_JOB_START_TS }}'
          GOVERNANCE_MAX_RUNTIME_MINUTES: "${{ vars.GOVERNANCE_MAX_RUNTIME_MINUTES || '55' }}"

      - name: Report authoritative contract and inventory results
        if: always()
        run: |
          set -euo pipefail
          echo "Architectural contract suite owner: CI job contract-tests. This step does not execute that suite."
          echo "Inventory lock owner: CI job repository-inventory. This step does not regenerate inventory."
          echo "contract-tests result: ${{ needs.contract-tests.result }}"
          echo "repository-inventory result: ${{ needs.repository-inventory.result }}"
          case "${{ needs.contract-tests.result }}" in failure|cancelled) exit 1 ;; esac
          case "${{ needs.repository-inventory.result }}" in failure|cancelled) exit 1 ;; esac

      - name: Upload governance gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-gate-report
          path: |
            ops/outputs/governance-gate-report.json
            ops/outputs/dora-metrics.json
            ops/outputs/cost-allocation.json
            ops/outputs/onboarding-kpis.json
            ops/outputs/strategic-resilience-report.json
            ops/outputs/data-residency-runtime.json
            ops/outputs/governance-runtime-budget.json
            ops/outputs/control-manifest-report.json
            proof-artifacts/**
          retention-days: 90

  ml-gates:
    needs: [classify]
    if: needs.classify.outputs.product_code == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: ML Tooling Gates
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify ML tooling file presence
        run: |
          check() { test -f "$1" || { echo "MISSING: $1"; exit 1; }; }
          check tooling/ml/requirements.txt
          check tooling/ml/train_daily_iforest.py
          check tooling/ml/train_txn_iforest.py
          check tooling/ml/infer_daily_iforest.py
          check tooling/ml/infer_txn_iforest.py
          check tooling/ml/lib/io_blob.py
          check tooling/ml/lib/metrics.py
          check tooling/ml/lib/thresholds.py
          check tooling/ml/lib/db_write.py
          check tooling/ml/lib/stripeFeatureEngineering.ts
          check tooling/ml/lib/blobDatasetWriter.ts
          check tooling/ml/build-stripe-daily-dataset.ts
          check tooling/ml/build-stripe-txn-dataset.ts
          echo "All ML tooling files present."

      - name: Python syntax check — ML scripts
        run: |
          python -m py_compile \
            tooling/ml/train_daily_iforest.py \
            tooling/ml/train_txn_iforest.py \
            tooling/ml/infer_daily_iforest.py \
            tooling/ml/infer_txn_iforest.py \
            tooling/ml/lib/io_blob.py \
            tooling/ml/lib/metrics.py \
            tooling/ml/lib/thresholds.py \
            tooling/ml/lib/db_write.py
          echo "Python syntax check passed."

      - name: Verify ML DB schema exported
        run: |
          grep -q "ml_model_status" packages/db/src/schema/ml.ts      || { echo "ml_model_status enum not found"; exit 1; }
          grep -q "mlScoresStripeTxn" packages/db/src/schema/ml.ts    || { echo "mlScoresStripeTxn table not found"; exit 1; }
          grep -q "ml" packages/db/src/schema/index.ts                || { echo "ml not exported from schema index"; exit 1; }
          echo "ML schema checks passed."

      - name: Verify evidence pack --include-ml flag
        run: |
          grep -q "include-ml" tooling/scripts/generate-evidence-index.ts         || { echo "--include-ml flag missing"; exit 1; }
          grep -q "collectMlEvidence" tooling/scripts/generate-evidence-index.ts  || { echo "collectMlEvidence not wired"; exit 1; }
          echo "Evidence pack ML wiring verified."

  # ─── AI Eval Gate (mandatory — no "if report exists" skip) ─────────────────
  ai-eval-gate:
    needs: [classify, lint-and-typecheck]
    if: needs.classify.outputs.product_code == 'APPLICABLE' && (needs.lint-and-typecheck.result == 'success' || needs.lint-and-typecheck.result == 'skipped')
    runs-on: ubuntu-latest
    name: AI Eval Gate
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run AI eval harness (CI stub mode)
        run: pnpm tsx tooling/ai-evals/run-evals-ci.ts

      - name: Enforce eval gate thresholds
        run: pnpm tsx tooling/ai-evals/eval-gate.ts tooling/ai-evals/report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: tooling/ai-evals/report.json
          retention-days: 30

  # ─── Architectural Invariants & Contract Tests ────────────────────────────
  contract-tests:
    needs: [classify, lint-and-typecheck]
    if: needs.classify.outputs.contract_tests == 'APPLICABLE' && (needs.lint-and-typecheck.result == 'success' || needs.lint-and-typecheck.result == 'skipped')
    runs-on: ubuntu-latest
    name: Contract Tests (Architectural Invariants)
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run contract tests
        run: pnpm contract-tests

  operating-layer-gate:
    needs: [classify, lint-and-typecheck]
    if: needs.classify.outputs.operating_layer_gate == 'APPLICABLE' && (needs.lint-and-typecheck.result == 'success' || needs.lint-and-typecheck.result == 'skipped')
    runs-on: ubuntu-latest
    name: Operating Layer Gate
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run operating-layer contract suite
        run: pnpm test:operating-layer

  # ─── Ops Pack Validation ──────────────────────────────────────────────────
  ops-pack-validation:
    needs: [classify]
    if: needs.classify.outputs.ops_pack_validation == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: Ops Documentation Pack
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Validate ops pack completeness
        run: pnpm tsx tooling/ops/validate-ops-pack.ts ${{ github.workspace }}

  # ─── Schema Drift Detection ───────────────────────────────────────────────
  schema-drift:
    needs: [classify]
    if: needs.classify.outputs.schema_drift == 'APPLICABLE'
    runs-on: ubuntu-latest
    name: Schema Drift Detection
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Verify schema snapshot (no drift)
        run: pnpm tsx tooling/db/schema-snapshot.ts verify

      - name: Verify canonical schema (required tables + columns)
        run: pnpm tsx tooling/db/canonical-schema/verify.ts

      - name: DB preflight check (structural prerequisites)
        run: pnpm tsx tooling/db/preflight-check.ts

      - name: Staging parity check (env configuration)
        run: pnpm tsx tooling/env/parity-check.ts

  # ─── Red-Team Adversarial Tests ───────────────────────────────────────────
  red-team:
    needs: [classify, lint-and-typecheck]
    if: needs.classify.outputs.product_code == 'APPLICABLE' && (needs.lint-and-typecheck.result == 'success')
    runs-on: ubuntu-latest
    name: Red-Team Adversarial
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run red-team adversarial tests
        run: npx vitest run --config security/redteam/vitest.config.ts --reporter=verbose

  # ─── Hash Chain Drift Detection ───────────────────────────────────────────
  hash-chain-drift:
    needs: [classify, lint-and-typecheck]
    if: needs.classify.outputs.hash_chain_drift == 'APPLICABLE' && (needs.lint-and-typecheck.result == 'success' || needs.lint-and-typecheck.result == 'skipped')
    runs-on: ubuntu-latest
    name: Hash Chain Drift
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run hash chain drift tests
        run: |
          npx vitest run \
            --config tooling/contract-tests/vitest.config.ts \
            tooling/contract-tests/hash-chain-drift.test.ts

  # ─── Enterprise Hardening Gate ────────────────────────────────────────────
  enterprise-hardening:
    needs: [classify, lint-and-typecheck, test, contract-tests]
    if: needs.classify.outputs.product_code == 'APPLICABLE' && (needs.lint-and-typecheck.result == 'success' && needs.test.result == 'success' && needs.contract-tests.result == 'success')
    runs-on: ubuntu-latest
    name: Enterprise Hardening Gate
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Verify build environment
        run: pnpm exec tsx tooling/build-env-check.ts
        env:
          NODE_ENV: production

      - name: Generate SBOM
        run: pnpm exec tsx scripts/generate-sbom.ts

      - name: Validate procurement pack
        run: pnpm exec tsx scripts/validate-procurement-pack.ts

      - name: Verify security headers
        run: pnpm exec tsx tooling/security-headers-check.ts

      - name: Generate platform health report
        run: pnpm exec tsx scripts/platform-health-report.ts

      - name: Generate quarterly strategic scorecard
        run: node tooling/scripts/generate-quarterly-strategic-scorecard.mjs

      - name: Generate build attestation
        run: pnpm exec tsx scripts/attest-build.ts

      - name: Upload attestation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-hardening-artifacts
          path: |
            ops/security/sbom.json
            ops/security/build-attestation.json
            ops/outputs/platform-health.json
            ops/outputs/procurement-pack-*.zip
            reports/strategy/quarterly-scorecard.md
            reports/strategy/quarterly-scorecard.json
          retention-days: 90

  # ─── Performance Regression Gate ──────────────────────────────────────────
  perf-regression:
    needs: [classify, build]
    if: needs.classify.outputs.product_code == 'APPLICABLE' && (github.event_name == 'pull_request' && needs.build.result == 'success')
    runs-on: ubuntu-latest
    name: Performance Regression Gate
    steps:
      - uses: actions/checkout@v5

      - name: Install k6
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Start credential-free synthetic target
        run: |
          node --input-type=module <<'NODE' &
          import { createServer } from 'node:http'
          createServer((req, res) => {
            res.writeHead(200, { 'content-type': 'text/plain' })
            res.end('synthetic-ok')
          }).listen(3999, '127.0.0.1')
          NODE
          timeout 10 bash -c 'until curl -sf http://127.0.0.1:3999/api/health >/dev/null; do sleep 0.2; done'

      - name: Run k6 fail-closed performance gate
        env:
          PERF_AUTH_TOKEN: ''
        run: |
          if [ -n "${PERF_AUTH_TOKEN}" ]; then
            echo "::error::Pull request performance gate received PERF_AUTH_TOKEN"
            exit 1
          fi
          k6 run \
            --env PROFILE=ci \
            --env BASE_URL="http://127.0.0.1:3999" \
            --summary-export=tests/load/k6-summary.json \
            tests/load/smoke.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-perf-results
          path: tests/load/
          retention-days: 30

  perf-regression-canonical:
    needs: [classify, build]
    if: needs.classify.outputs.product_code == 'APPLICABLE' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    name: Performance Regression Gate (canonical)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install k6
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 fail-closed performance gate
        run: |
          k6 run \
            --env PROFILE=ci \
            --env BASE_URL="${{ vars.PERF_BASE_URL || 'https://nzila-os-union-eyes-staging.jollydune-88c1e97f.canadacentral.azurecontainerapps.io' }}" \
            --env AUTH_TOKEN="${{ secrets.PERF_AUTH_TOKEN }}" \
            --summary-export=tests/load/k6-summary.json \
            tests/load/smoke.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-perf-results
          path: tests/load/
          retention-days: 30

  # Inventory lock owner. Governance Gates reports this job's result and does not regenerate inventory.
  # This job does not collect DORA, cost, or release evidence.
  repository-inventory:
    needs: [classify]
    if: needs.classify.outputs.repository_inventory == 'APPLICABLE'
    name: Repository Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Regenerate inventory
        run: pnpm inventory:generate
      - name: Enforce committed inventory lock
        run: |
          DIFF=$(git diff -- tooling/repo-inventory/output/inventory.json tooling/repo-inventory/output/inventory.md tooling/repo-inventory/output/repo-inventory.json tooling/repo-inventory/output/repo-inventory.md)
          SUBSTANTIVE=$(echo "$DIFF" | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -Ev '"generatedAt"|Auto-generated on' || true)
          if [ -n "$SUBSTANTIVE" ]; then
            echo "Substantive inventory drift detected:"
            echo "$DIFF"
            exit 1
          fi
          echo "Inventory check passed (date-stamp differences ignored)"

  # Merge-critical source-tree validators extracted from Governance Gates.
  # DORA, cost, onboarding, scorecards, release proof, and runtime evidence stay out.
  governance-integrity:
    needs: [classify]
    if: needs.classify.outputs.governance_integrity == 'APPLICABLE'
    name: Governance Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Script alias regression guard
        run: node tooling/scripts/check-script-alias-regression.mjs
      - name: Governance fail-closed gate
        run: pnpm exec tsx tooling/governance/validate-governance-gate.ts
      - name: Evidence lifecycle policy gate
        run: pnpm exec tsx scripts/validate-evidence-lifecycle-policy.ts
      - name: Truth authority validation
        run: pnpm exec tsx scripts/validate-truth-authority.ts
      - name: Auth authority validation
        run: pnpm exec tsx scripts/validate-auth-authority.ts
      - name: GA state machine validation
        run: pnpm exec tsx scripts/validate-ga-state.ts
      - name: Workspace dependency integrity
        run: pnpm exec tsx scripts/validate-workspace-links.ts
      - name: Control manifest validation
        run: pnpm exec tsx tooling/governance/validate-control-manifests.ts

  # One-shot re-entry for this run's frozen head. It runs when CI finishes or
  # is cancelled only if this job itself still runs. It reads this run's jobs
  # and does not re-execute them. Cancelling Publish required checks does not
  # cancel this job.

  report-contract-owner:
    name: Report CI contract owner
    needs: [classify, contract-tests]
    if: always() && needs.classify.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Waited for CI job contract-tests
        run: |
          set -euo pipefail
          echo "Owner CI job contract-tests result: ${{ needs.contract-tests.result }}"
          if [ "${{ needs.classify.outputs.contract_tests }}" != "APPLICABLE" ]; then
            echo "NOT_APPLICABLE success"
            exit 0
          fi
          test "${{ needs.contract-tests.result }}" = "success"

  report-inventory-owner:
    name: Report CI inventory owner
    needs: [classify, repository-inventory]
    if: always() && needs.classify.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Waited for CI job repository-inventory
        run: |
          set -euo pipefail
          echo "Owner CI job repository-inventory result: ${{ needs.repository-inventory.result }}"
          if [ "${{ needs.classify.outputs.repository_inventory }}" != "APPLICABLE" ]; then
            echo "NOT_APPLICABLE success"
            exit 0
          fi
          test "${{ needs.repository-inventory.result }}" = "success"

  reconcile-frozen-head:
    name: Reconcile CI frozen head
    needs:
      - lint
      - typecheck
      - lint-and-typecheck
      - test
      - test-workers
      - sage-live-postgres
      - sage-postgres-concurrency
      - build
      - build-worker
      - iac-scan
      - iac-sarif-reporting
      - governance-gates
      - ml-gates
      - ai-eval-gate
      - contract-tests
      - operating-layer-gate
      - ops-pack-validation
      - schema-drift
      - red-team
      - hash-chain-drift
      - enterprise-hardening
      - perf-regression
      - repository-inventory
      - governance-integrity
      - classify
      - report-contract-owner
      - report-inventory-owner
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
      - name: Publish this run's frozen head once
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_WORKFLOW_NAME: CI
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          MA_CHANGED_PATHS="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          export MA_CHANGED_PATHS
          node tooling/ci/merge-authority/publish.mjs reconcile-this-run

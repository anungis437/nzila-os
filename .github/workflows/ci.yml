name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".gitignore"
      - ".editorconfig"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".gitignore"
      - ".editorconfig"
      - "LICENSE"

permissions:
  contents: read
  security-events: write

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    name: Lint & Typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: lint

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run migrations
        run: pnpm --filter @nzila/db db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          AUTH_SECRET: ci_test_placeholder_secret_32chars_xxxx

      # Pre-tar keeps the upload to a single file: workspace-wide **/coverage-final.json
      # glob-walking was the dominant cost across 250+ packages. tar is ~10-30x faster
      # than upload-artifact's per-file API for many small JSON files.
      - name: Package coverage
        if: always()
        run: |
          set -e
          tar --exclude='node_modules' --exclude='.pnpm-store' --exclude='.git' --exclude='.turbo' \
              -czf coverage-reports.tar.gz \
              $( [ -d coverage ]       && echo coverage       || true ) \
              $( [ -f coverage.xml ]   && echo coverage.xml   || true ) \
              $( [ -d coverage_html ]  && echo coverage_html  || true ) || true
          ls -lh coverage-reports.tar.gz || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-${{ github.run_id }}
          path: coverage-reports.tar.gz
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          overwrite: true

  sage-live-postgres:
    runs-on: ubuntu-latest
    name: SAGE Live PostgreSQL (records lifecycle)
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      # Released migrations are immutable: fail if a locked migration changed
      # without a documented override in migrations/migration-manifest.json.
      - name: Verify migration immutability manifest
        run: pnpm verify:migrations

      - name: Verify deadline engine migration contract
        run: pnpm verify:deadline-engine-schema -- --static

      # Applies the real migrations/0032..0044 chain to an in-process PostgreSQL
      # (PGlite/WASM) and drives the destruction lifecycle end-to-end. No service
      # database is required — the migrations execute exactly as they will in prod.
      - name: Run SAGE records live-PostgreSQL suite
        run: pnpm --filter @nzila/sage-core exec vitest run src/records-live-postgres.test.ts

  sage-postgres-concurrency:
    runs-on: ubuntu-latest
    name: SAGE PostgreSQL Concurrency and RLS
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sage_test
          POSTGRES_PASSWORD: sage_test
          POSTGRES_DB: sage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      # Proves the SERVER-level behaviour PGlite cannot: independent sessions,
      # SKIP LOCKED, transaction isolation, concurrent legal-hold vs destruction
      # commits, real non-owner roles + RLS, connection-level app.tenant_id
      # tenancy, and crash/reconnect recovery — against an official postgres:16.
      - name: Run SAGE PostgreSQL concurrency + RLS suite
        run: pnpm --filter @nzila/sage-core exec vitest run src/records-postgres-server.test.ts
        env:
          SAGE_PG_TEST_URL: postgresql://sage_test:sage_test@localhost:5432/sage_test

  build:
    runs-on: ubuntu-latest
    name: Build All
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
        with:
          turbo-cache-key: build

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONSOLE_URL: https://console.nzila.app
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Check bundle sizes
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | JS (gzip) | CSS (gzip) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|------------|--------|" >> $GITHUB_STEP_SUMMARY
          BUDGET_KB=350
          FAILED=0
          for app_dir in apps/*/; do
            app=$(basename "$app_dir")
            next_dir="${app_dir}.next/static"
            [ -d "$next_dir" ] || continue
            js_bytes=$(find "$next_dir" -name '*.js' -exec gzip -c {} + 2>/dev/null | wc -c)
            css_bytes=$(find "$next_dir" -name '*.css' -exec gzip -c {} + 2>/dev/null | wc -c)
            js_kb=$((js_bytes / 1024))
            css_kb=$((css_bytes / 1024))
            # Per-app budget override
            case "$app" in
              console) app_budget=500 ;;
              web) app_budget=250 ;;
              *) app_budget=$BUDGET_KB ;;
            esac
            if [ "$js_kb" -gt "$app_budget" ]; then
              status="❌ Over budget (${app_budget} KB)"
              FAILED=1
            else
              status="✅"
            fi
            echo "| $app | ${js_kb} KB | ${css_kb} KB | $status |" >> $GITHUB_STEP_SUMMARY
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::warning::One or more apps exceed their bundle size budget. See step summary."
          fi

      - name: Generate OpenAPI specs
        run: npx tsx tooling/openapi-gen/src/cli.ts

      - name: Upload OpenAPI specs
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specs-${{ github.run_id }}
          path: docs/api/specs/
          retention-days: 90

  # ── W1-5: IaC Security Scan (Checkov) ──────────────────────────────────────
  iac-scan:
    runs-on: ubuntu-latest
    name: IaC Security Scan
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v5

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on Bicep templates
        run: |
          checkov \
            --directory infrastructure/bicep \
            --framework bicep \
            --output cli --output sarif \
            --output-file-path console,results.sarif \
            --skip-check CKV_AZURE_99 \
            --skip-check CKV_AZURE_139 \
            --skip-check CKV_AZURE_163 \
            --skip-check CKV_AZURE_166 \
            --skip-check CKV_AZURE_189

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov

  governance-gates:
    runs-on: ubuntu-latest
    name: Governance Gates
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
        with:
          fetch-depth: "0"

      - name: Script alias regression guard
        run: node tooling/scripts/check-script-alias-regression.mjs

      - name: Enforce tier focus labels
        run: pnpm exec tsx scripts/validate-tier-focus.ts
        env:
          # Required so the script can read the PR's CURRENT labels via the
          # GitHub API. Without it, the live lookup returns null and the gate
          # falls back to the event payload labels, which are frozen at the last
          # push and miss labels added afterwards — so re-running after applying
          # 'approved-experiment'/'owner-approved' would never pass.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start governance runtime timer
        run: echo "GOVERNANCE_JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Contract tests
        run: pnpm contract-tests

      - name: Tier 1 maturity gate
        run: |
          FAILED=0
          echo "## Tier 1 App Maturity" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | contracts_complete | data_integrity | observability |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------------------|---------------|---------------|" >> $GITHUB_STEP_SUMMARY
          for app in union-eyes flow agrimo; do
            maturity_file="apps/$app/maturity.json"
            if [ ! -f "$maturity_file" ]; then
              echo "| $app | ❌ MISSING | ❌ MISSING | ❌ MISSING |" >> $GITHUB_STEP_SUMMARY
              echo "::error::Missing maturity.json for Tier 1 app: $app"
              FAILED=1
              continue
            fi
            contracts=$(python3 -c "import json; d=json.load(open('$maturity_file')); print(d.get('contracts_complete',''))")
            integrity=$(python3 -c "import json; d=json.load(open('$maturity_file')); print(d.get('data_integrity',''))")
            observability=$(python3 -c "import json; d=json.load(open('$maturity_file')); print(d.get('observability',''))")
            c_icon=$([ "$contracts" = "True" ] && echo "✅" || echo "⚠️")
            echo "| $app | $c_icon $contracts | $integrity | $observability |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** \`contracts_complete: false\` in any Tier 1 app is a blocker for GA. This gate will hard-fail once contracts are complete." >> $GITHUB_STEP_SUMMARY

      - name: GA gate check
        run: pnpm exec tsx tooling/ga-check/ga-check.ts

      - name: Governance fail-closed gate
        run: pnpm exec tsx tooling/governance/validate-governance-gate.ts

      - name: Evidence lifecycle policy gate
        run: pnpm exec tsx scripts/validate-evidence-lifecycle-policy.ts

      - name: Ensure main branch is fetched for DORA metrics
        # actions/checkout@v5 with fetch-depth: 0 pulls all history for the PR
        # ref but does NOT set up origin/main as a tracked remote ref on PR
        # runs. Without origin/main, the DORA collector falls back to HEAD
        # (the PR branch) and undercounts merges. Fetching main explicitly and
        # setting origin/HEAD lets the collector see the real deployment history.
        run: |
          git fetch --no-tags --prune --depth=200 origin main:refs/remotes/origin/main || true
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/main || true
          git rev-parse --verify --quiet "main^{commit}" >/dev/null 2>&1 || \
            git update-ref refs/heads/main refs/remotes/origin/main || true

      - name: Collect DORA metrics
        run: node tooling/scripts/collect-dora-metrics.mjs -- --enforce
        env:
          # DORA_MIN_DEPLOYS_PER_WEEK: 1.0 (approx 1 deploy / week floor).
          # The collector counts PR landings via `git log --first-parent`, which
          # correctly captures squash-merged PRs (see collect-dora-metrics.mjs
          # comment for rationale). A 1.0/week floor is a reasonable "we are
          # shipping" signal without being self-referentially unblockable —
          # the trailing-30d average is currently ~2.5/week.
          DORA_MIN_DEPLOYS_PER_WEEK: "1"
          DORA_MAX_LEAD_TIME_HOURS: "720"
          DORA_MAX_CHANGE_FAILURE_RATE_PCT: "15"

      - name: Collect cost attribution
        run: node tooling/scripts/collect-cost-attribution.mjs
        env:
          COST_ENABLE_AZURE_API: "${{ vars.COST_ENABLE_AZURE_API || '0' }}"
          AZURE_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Collect onboarding KPIs
        run: node tooling/scripts/collect-onboarding-kpis.mjs

      - name: Validate strategic resilience
        run: node tooling/scripts/validate-strategic-resilience.mjs --enforce

      - name: Verify runtime data residency (report)
        run: node tooling/scripts/verify-data-residency-runtime.mjs
        env:
          AZURE_RESIDENCY_RESOURCE_GROUP: "${{ vars.AZURE_RESIDENCY_RESOURCE_GROUP || '' }}"
          RESIDENCY_ALLOWED_REGIONS: "${{ vars.RESIDENCY_ALLOWED_REGIONS || 'canadacentral,canadaeast' }}"

      - name: Truth authority validation
        run: pnpm exec tsx scripts/validate-truth-authority.ts

      - name: Auth authority validation
        run: pnpm exec tsx scripts/validate-auth-authority.ts

      - name: GA state machine validation
        run: pnpm exec tsx scripts/validate-ga-state.ts

      - name: Workspace dependency integrity
        run: pnpm exec tsx scripts/validate-workspace-links.ts

      - name: Regenerate inventory
        run: pnpm inventory:generate

      - name: Enforce committed inventory lock
        run: |
          DIFF=$(git diff -- tooling/repo-inventory/output/inventory.json tooling/repo-inventory/output/inventory.md tooling/repo-inventory/output/repo-inventory.json tooling/repo-inventory/output/repo-inventory.md)
          SUBSTANTIVE=$(echo "$DIFF" | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -Ev '"generatedAt"|Auto-generated on' || true)
          if [ -n "$SUBSTANTIVE" ]; then
            echo "Substantive inventory drift detected:"
            echo "$DIFF"
            exit 1
          fi
          echo "Inventory check passed (date-stamp differences ignored)"

      - name: Control manifest validation
        run: pnpm exec tsx tooling/governance/validate-control-manifests.ts

      - name: Validate release strict
        run: pnpm exec tsx scripts/validate-release-strict.ts

      - name: Platform proof tests
        run: pnpm exec tsx scripts/proof/run-proof.ts

      - name: Verify proof artifacts
        run: pnpm exec tsx scripts/proof/verify-artifacts.ts

      - name: Enforce governance runtime budget
        run: node tooling/scripts/check-governance-runtime-budget.mjs --enforce
        env:
          GOVERNANCE_JOB_START_TS: "${{ env.GOVERNANCE_JOB_START_TS }}"
          GOVERNANCE_MAX_RUNTIME_MINUTES: "${{ vars.GOVERNANCE_MAX_RUNTIME_MINUTES || '55' }}"

      - name: Upload governance gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-gate-report
          path: |
            ops/outputs/governance-gate-report.json
            ops/outputs/dora-metrics.json
            ops/outputs/cost-allocation.json
            ops/outputs/onboarding-kpis.json
            ops/outputs/strategic-resilience-report.json
            ops/outputs/data-residency-runtime.json
            ops/outputs/governance-runtime-budget.json
            ops/outputs/control-manifest-report.json
            proof-artifacts/**
          retention-days: 90

  ml-gates:
    runs-on: ubuntu-latest
    name: ML Tooling Gates
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify ML tooling file presence
        run: |
          check() { test -f "$1" || { echo "MISSING: $1"; exit 1; }; }
          check tooling/ml/requirements.txt
          check tooling/ml/train_daily_iforest.py
          check tooling/ml/train_txn_iforest.py
          check tooling/ml/infer_daily_iforest.py
          check tooling/ml/infer_txn_iforest.py
          check tooling/ml/lib/io_blob.py
          check tooling/ml/lib/metrics.py
          check tooling/ml/lib/thresholds.py
          check tooling/ml/lib/db_write.py
          check tooling/ml/lib/stripeFeatureEngineering.ts
          check tooling/ml/lib/blobDatasetWriter.ts
          check tooling/ml/build-stripe-daily-dataset.ts
          check tooling/ml/build-stripe-txn-dataset.ts
          echo "All ML tooling files present."

      - name: Python syntax check — ML scripts
        run: |
          python -m py_compile \
            tooling/ml/train_daily_iforest.py \
            tooling/ml/train_txn_iforest.py \
            tooling/ml/infer_daily_iforest.py \
            tooling/ml/infer_txn_iforest.py \
            tooling/ml/lib/io_blob.py \
            tooling/ml/lib/metrics.py \
            tooling/ml/lib/thresholds.py \
            tooling/ml/lib/db_write.py
          echo "Python syntax check passed."

      - name: Verify ML DB schema exported
        run: |
          grep -q "ml_model_status" packages/db/src/schema/ml.ts      || { echo "ml_model_status enum not found"; exit 1; }
          grep -q "mlScoresStripeTxn" packages/db/src/schema/ml.ts    || { echo "mlScoresStripeTxn table not found"; exit 1; }
          grep -q "ml" packages/db/src/schema/index.ts                || { echo "ml not exported from schema index"; exit 1; }
          echo "ML schema checks passed."

      - name: Verify evidence pack --include-ml flag
        run: |
          grep -q "include-ml" tooling/scripts/generate-evidence-index.ts         || { echo "--include-ml flag missing"; exit 1; }
          grep -q "collectMlEvidence" tooling/scripts/generate-evidence-index.ts  || { echo "collectMlEvidence not wired"; exit 1; }
          echo "Evidence pack ML wiring verified."

  # ─── AI Eval Gate (mandatory — no "if report exists" skip) ─────────────────
  ai-eval-gate:
    runs-on: ubuntu-latest
    name: AI Eval Gate
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run AI eval harness (CI stub mode)
        run: pnpm tsx tooling/ai-evals/run-evals-ci.ts

      - name: Enforce eval gate thresholds
        run: pnpm tsx tooling/ai-evals/eval-gate.ts tooling/ai-evals/report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: tooling/ai-evals/report.json
          retention-days: 30

  # ─── Architectural Invariants & Contract Tests ────────────────────────────
  contract-tests:
    runs-on: ubuntu-latest
    name: Contract Tests (Architectural Invariants)
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run contract tests
        run: pnpm contract-tests

  operating-layer-gate:
    runs-on: ubuntu-latest
    name: Operating Layer Gate
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run operating-layer contract suite
        run: pnpm test:operating-layer

  # ─── Ops Pack Validation ──────────────────────────────────────────────────
  ops-pack-validation:
    runs-on: ubuntu-latest
    name: Ops Documentation Pack
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Validate ops pack completeness
        run: pnpm tsx tooling/ops/validate-ops-pack.ts ${{ github.workspace }}

  # ─── Schema Drift Detection ───────────────────────────────────────────────
  schema-drift:
    runs-on: ubuntu-latest
    name: Schema Drift Detection
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Verify schema snapshot (no drift)
        run: pnpm tsx tooling/db/schema-snapshot.ts verify

      - name: Verify canonical schema (required tables + columns)
        run: pnpm tsx tooling/db/canonical-schema/verify.ts

      - name: DB preflight check (structural prerequisites)
        run: pnpm tsx tooling/db/preflight-check.ts

      - name: Staging parity check (env configuration)
        run: pnpm tsx tooling/env/parity-check.ts

  # ─── Red-Team Adversarial Tests ───────────────────────────────────────────
  red-team:
    runs-on: ubuntu-latest
    name: Red-Team Adversarial
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run red-team adversarial tests
        run: npx vitest run --config security/redteam/vitest.config.ts --reporter=verbose

  # ─── Hash Chain Drift Detection ───────────────────────────────────────────
  hash-chain-drift:
    runs-on: ubuntu-latest
    name: Hash Chain Drift
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Run hash chain drift tests
        run: |
          npx vitest run \
            --config tooling/contract-tests/vitest.config.ts \
            tooling/contract-tests/hash-chain-drift.test.ts

  # ─── Enterprise Hardening Gate ────────────────────────────────────────────
  enterprise-hardening:
    runs-on: ubuntu-latest
    name: Enterprise Hardening Gate
    needs: [lint-and-typecheck, test, contract-tests]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Verify build environment
        run: pnpm exec tsx tooling/build-env-check.ts
        env:
          NODE_ENV: production

      - name: Generate SBOM
        run: pnpm exec tsx scripts/generate-sbom.ts

      - name: Validate procurement pack
        run: pnpm exec tsx scripts/validate-procurement-pack.ts

      - name: Verify security headers
        run: pnpm exec tsx tooling/security-headers-check.ts

      - name: Generate platform health report
        run: pnpm exec tsx scripts/platform-health-report.ts

      - name: Generate quarterly strategic scorecard
        run: node tooling/scripts/generate-quarterly-strategic-scorecard.mjs

      - name: Generate build attestation
        run: pnpm exec tsx scripts/attest-build.ts

      - name: Upload attestation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-hardening-artifacts
          path: |
            ops/security/sbom.json
            ops/security/build-attestation.json
            ops/outputs/platform-health.json
            ops/outputs/procurement-pack-*.zip
            reports/strategy/quarterly-scorecard.md
            reports/strategy/quarterly-scorecard.json
          retention-days: 90

  # ─── Performance Regression Gate ──────────────────────────────────────────
  perf-regression:
    runs-on: ubuntu-latest
    name: Performance Regression Gate
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Install k6
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 fail-closed performance gate
        run: |
          k6 run \
            --env PROFILE=ci \
            --env BASE_URL="${{ vars.PERF_BASE_URL || 'https://nzila-os-web.jollydune-88c1e97f.canadacentral.azurecontainerapps.io' }}" \
            --env AUTH_TOKEN="${{ secrets.PERF_AUTH_TOKEN }}" \
            --summary-export=tests/load/k6-summary.json \
            tests/load/smoke.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-perf-results
          path: tests/load/
          retention-days: 30


name: Doc Hygiene

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'reports/**'
      - 'governance/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    name: Doc Hygiene Check
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check internal links
        run: pnpm exec tsx scripts/link-check.ts

      - name: Validate READMEs
        run: pnpm exec tsx scripts/validate-readmes.ts

      - name: Build docs index (stale detection)
        run: pnpm exec tsx scripts/docs/build-docs-index.ts

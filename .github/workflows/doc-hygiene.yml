name: Doc Hygiene

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'reports/**'
      - 'governance/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    name: Doc Hygiene Check
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check internal links
        run: pnpm link-check

      - name: Validate READMEs
        run: pnpm validate:readmes

      - name: Build docs index (stale detection)
        run: pnpm docs:index

name: Doc Hygiene

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'reports/**'
      - 'governance/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    name: Doc Hygiene Check
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Check internal links
        run: pnpm exec tsx scripts/link-check.ts

      - name: Validate READMEs
        run: pnpm exec tsx scripts/validate-readmes.ts

      - name: Build docs index (stale detection)
        run: pnpm exec tsx scripts/docs/build-docs-index.ts

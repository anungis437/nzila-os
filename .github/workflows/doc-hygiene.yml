name: Doc Hygiene

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'reports/**'
      - 'governance/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    name: Doc Hygiene Check
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check internal links
        run: pnpm link-check

      - name: Validate READMEs
        run: pnpm validate:readmes

      - name: Build docs index (stale detection)
        run: pnpm docs:index

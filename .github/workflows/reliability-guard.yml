name: Reliability Guard

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reliability-validation:
    runs-on: ubuntu-latest
    steps:
      # GitHub-hosted runners ship with Android, .NET, CodeQL, and Docker
      # images this job never uses. The monorepo build then fills the disk.
      # Node stays in the toolcache for setup-node.
      - name: Free runner disk
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/powershell \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk
          if command -v docker >/dev/null 2>&1; then
            docker system prune --all --force
          fi
          df -h /

      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test fast
        run: pnpm test:fast

      - name: Build
        run: pnpm build

      - name: Health contract
        run: pnpm exec tsx scripts/sre/validate-health-contract.ts

      - name: Synthetic dry-run
        run: pnpm exec tsx scripts/sre/synthetic-dry-run.ts

      - name: Alert routing dry-run
        run: pnpm exec tsx scripts/sre/alert-routing-dry-run.ts

      - name: Reliability audit
        run: pnpm exec tsx scripts/sre/audit-reliability.ts

      - name: Executive dashboard
        run: pnpm exec tsx scripts/sre/generate-executive-dashboard.ts

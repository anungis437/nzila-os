name: Nzila GA Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance-baseline:
    name: Governance Baseline
    uses: ./.github/workflows/nzila-governance.yml
    secrets: inherit

  ga-truth-hardening:
    name: GA Truth Hardening
    needs: governance-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-monorepo

      - name: Validate app maturity
        run: pnpm validate:maturity

      - name: Validate runtime truth
        run: pnpm validate:runtime-truth

      - name: Run GA check
        run: pnpm exec tsx tooling/ga-check/ga-check.ts

      - name: Generate SBOM
        run: pnpm exec tsx scripts/generate-sbom.ts

      - name: Validate Tier 3 operating infrastructure
        run: node tooling/scripts/validate-tier3-operating-infrastructure.mjs
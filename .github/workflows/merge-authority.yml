name: Merge Authority

# Aggregator only. Applicability is decided by CI job classify. This workflow
# does not classify on its own and does not execute contract tests, inventory
# locks, Checkov, ops validation, or secret scanners. Absent evidence is not PASS.
# Required contexts are published by CI and Secret Scan reconcile-frozen-head,
# and by Publish required checks, from that same classifier.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merge-authority-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  aggregate:
    name: Aggregate merge authority
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report merge authority without executing controls
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_DECISION: ${{ github.event.pull_request.draft && 'draft' || 'opened' }}
        run: |
          set -euo pipefail
          node tooling/ci/merge-authority/publish.mjs aggregate-merge-authority
          echo "pull_request=${PR_NUMBER} review_state=${REVIEW_DECISION}"
          echo "governance_state=consumed from CI job governance-integrity when GOVERNANCE is APPLICABLE"

name: Branch and Tag Governance

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: ./.github/actions/setup-monorepo
      - name: Validate PR branch naming policy
        run: pnpm exec tsx scripts/release/validate-branch-tag-policy.ts --mode branch --ref "${{ github.head_ref }}"

  tag-policy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: ./.github/actions/setup-monorepo
      - name: Validate tag naming policy
        run: pnpm exec tsx scripts/release/validate-branch-tag-policy.ts --mode tag --ref "${{ github.ref_name }}"

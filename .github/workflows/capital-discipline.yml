name: Capital Discipline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capital-discipline:
    runs-on: ubuntu-latest
    name: Capital Discipline
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Validate capital discipline assumptions
        run: pnpm exec tsx scripts/validate-capital-discipline.ts

      - name: Generate executive capital reports
        run: pnpm exec tsx scripts/generate-capital-allocation.ts

      - name: Run capital allocation tests
        run: pnpm exec vitest run --project contract-tests tooling/contract-tests/capital-allocation.test.ts tooling/contract-tests/capital-engine-v2.test.ts

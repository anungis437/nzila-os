name: Capital Discipline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capital-discipline:
    runs-on: ubuntu-latest
    name: Capital Discipline
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate capital discipline assumptions
        run: pnpm validate:capital-discipline

      - name: Generate executive capital reports
        run: pnpm generate:capital-allocation

      - name: Run capital allocation tests
        run: pnpm exec vitest run --project contract-tests tooling/contract-tests/capital-allocation.test.ts tooling/contract-tests/capital-engine-v2.test.ts
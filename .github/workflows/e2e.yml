name: E2E Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'governance/**'
      - 'platform/products/**'
      - 'reports/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'governance/**'
      - 'platform/products/**'
      - 'reports/**'

permissions:
  contents: read
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E · ${{ matrix.app }}
    # staging env supplies AZURE_CLIENT_ID/TENANT_ID for OIDC snapshot retrieve
    # (repo-level secrets lack those; staging has no protection reviewers).
    environment: staging
    timeout-minutes: 60  # union-eyes: snapshot restore + platform DDL + seed + full Playwright; others ≤5 min
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            port: 3000
          - app: console
            port: 3001
          - app: union-eyes
            port: 3002
          - app: flow
            port: 3003
          - app: partners
            port: 3004
          - app: cfo
            port: 3005
          - app: control-plane
            port: 3010
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Install Playwright browsers
        run: pnpm -C apps/${{ matrix.app }} exec playwright install --with-deps chromium

      - name: Build app
        run: pnpm --filter @nzila/${{ matrix.app }} build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Stub build-time env vars so Next.js doesn't fail
          AUTH_SECRET: ci_e2e_placeholder_secret_32chars_xxxx
          NEXT_PUBLIC_APP_URL: http://localhost:${{ matrix.port }}
          # Build target is served over plain HTTP on localhost — signal the
          # app config to omit upgrade-insecure-requests / HSTS, which would
          # force HTTPS chunk fetches the HTTP test server cannot answer
          # (ERR_SSL_PROTOCOL_ERROR → broken hydration).
          QA_TEST_ENV: 'true'

      - name: Stage standalone static assets
        # Next.js `output: 'standalone'` produces a minimal server bundle but
        # intentionally does NOT copy `.next/static` or `public` into the
        # standalone folder (the Dockerfile normally does this). The E2E harness
        # runs `node .next/standalone/.../server.js` directly, so without this
        # step every `/_next/static/*` chunk misses on disk, falls through to
        # route rendering → i18n 307 → 404. The browser then loads no JS, the
        # page never hydrates, and client-only widgets (e.g. Radix tabs) never
        # become interactive. Copy the assets the standalone server expects.
        run: |
          set -euo pipefail
          APP_DIR="apps/${{ matrix.app }}"
          STANDALONE_APP="$APP_DIR/.next/standalone/apps/${{ matrix.app }}"
          if [ ! -f "$STANDALONE_APP/server.js" ]; then
            echo "::error::Standalone server not found at $STANDALONE_APP/server.js"
            exit 1
          fi
          mkdir -p "$STANDALONE_APP/.next"
          cp -r "$APP_DIR/.next/static" "$STANDALONE_APP/.next/static"
          if [ -d "$APP_DIR/public" ]; then
            cp -r "$APP_DIR/public" "$STANDALONE_APP/public"
          fi
          # Fail fast if chunks are still missing — guards against silent regressions.
          if [ -z "$(ls -A "$STANDALONE_APP/.next/static/chunks" 2>/dev/null)" ]; then
            echo "::error::No static chunks staged into standalone output"
            exit 1
          fi
          echo "Staged $(find "$STANDALONE_APP/.next/static" -type f | wc -l) static files into standalone output"

      - name: Azure login (UE snapshot retrieve)
        if: matrix.app == 'union-eyes'
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap Union Eyes E2E database (canonical PG15 snapshot)
        if: matrix.app == 'union-eyes'
        run: |
          set -euo pipefail
          SNAPSHOT_ID="${UE_DB_SNAPSHOT_ID}"
          EXPECTED_SHA256="5b67def829412676a33f49d0155949253a76bc7e33efe5334131853cb64783a4"
          DUMP_DIR="${RUNNER_TEMP}/ue-canonical-snapshot"
          DUMP_PATH="${DUMP_DIR}/${SNAPSHOT_ID}.dump"
          mkdir -p "$DUMP_DIR"

          # Empty PG15 with vector extension support (matches restore-proof target).
          # Retry image pull — Docker Hub intermittently returns 502.
          for attempt in 1 2 3 4 5; do
            if docker pull pgvector/pgvector:pg15; then
              break
            fi
            echo "docker pull attempt ${attempt} failed; sleeping $((attempt * 5))s"
            sleep $((attempt * 5))
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to pull pgvector/pgvector:pg15 after 5 attempts"
              exit 1
            fi
          done
          docker run --name ci-e2e-postgres             -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci_e2e             -p 5432:5432 -d pgvector/pgvector:pg15
          timeout 90 bash -c 'until docker exec ci-e2e-postgres pg_isready -U ci -d ci_e2e; do sleep 2; done'

          # Roles expected by canonical dump / RLS helpers (idempotent).
          docker exec -i ci-e2e-postgres psql -U ci -d ci_e2e <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'union_eyes_runtime') THEN
              CREATE ROLE union_eyes_runtime LOGIN PASSWORD 'ci';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'union_eyes_system') THEN
              CREATE ROLE union_eyes_system LOGIN PASSWORD 'ci';
            END IF;
          END $$;
          GRANT ALL ON DATABASE ci_e2e TO union_eyes_runtime, union_eyes_system;
          GRANT ALL ON SCHEMA public TO union_eyes_runtime, union_eyes_system;
          SQL

          echo "Retrieving canonical snapshot ${SNAPSHOT_ID} from Azure Blob..."
          if az account show >/dev/null 2>&1; then
            az storage blob download \
              --account-name nzilastagingstore \
              --container-name nzila-staging-snapshots \
              --name "${SNAPSHOT_ID}.dump" \
              --file "$DUMP_PATH" \
              --auth-mode login
          elif [ -n "${AZURE_STORAGE_ACCOUNT_KEY:-}" ]; then
            echo "OIDC session unavailable; falling back to account-key auth for snapshot retrieve"
            az storage blob download \
              --account-name nzilastagingstore \
              --container-name nzila-staging-snapshots \
              --name "${SNAPSHOT_ID}.dump" \
              --file "$DUMP_PATH" \
              --account-key "$AZURE_STORAGE_ACCOUNT_KEY"
          else
            echo "::error::No Azure auth for snapshot retrieve (OIDC login failed and AZURE_STORAGE_ACCOUNT_KEY unset)"
            exit 1
          fi

          ACTUAL_SHA256="$(sha256sum "$DUMP_PATH" | awk '{print $1}')"
          echo "Retrieved SHA256=${ACTUAL_SHA256}"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Snapshot SHA256 mismatch (expected ${EXPECTED_SHA256})"
            exit 1
          fi
          echo "VERIFY_SHA256=PASS"

          # Restore via file:// so bootstrap skips stale QA baseline.
          export UE_DB_RESTORE_SNAPSHOT_URL="file://${DUMP_PATH}"
          export PGSSLMODE=disable
          export POSTGRES_MAJOR=15
          pnpm --filter @nzila/union-eyes db:migrate
          pnpm --filter @nzila/union-eyes seed:test-env
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e
          SYSTEM_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e
          QA_TEST_ENV: 'true'
          UE_DB_SNAPSHOT_ID: staging-canonical-20260923T184938Z-92611387
          POSTGRES_MAJOR: '15'
          PGSSLMODE: disable
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}

      - name: Start app
        run: |
          node apps/${{ matrix.app }}/.next/standalone/apps/${{ matrix.app }}/server.js >/tmp/app-server.log 2>&1 &
          # Wait for the server to be ready
          timeout 60 bash -c 'until curl -sf http://localhost:${{ matrix.port }}/ > /dev/null 2>&1 || curl -sf http://localhost:${{ matrix.port }}/api/health > /dev/null 2>&1; do sleep 2; done'
        env:
          AUTH_SECRET: ci_e2e_placeholder_secret_32chars_xxxx
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e
          SYSTEM_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e
          NODE_ENV: production
          PORT: ${{ matrix.port }}
          QA_TEST_ENV: 'true'
          PLAYWRIGHT_TEST_AUTH: 'true'
          UE_E2E_RISK_BYPASS: 'true'
          # Surface API errors in /tmp/app-server.log (Next.js prod is otherwise silent)
          NEXT_LOG_LEVEL: debug
          DEBUG: 'next:*'
          # boot-env requires these in production mode (control-plane, console)
          CONTROL_PLANE_API_KEY: ci-e2e-placeholder-key
          CONTROL_PLANE_URL: http://localhost:3010
          UNION_EYES_URL: http://localhost:3002
          ORCHESTRATOR_API_URL: http://localhost:4000

      - name: Run Playwright tests
        run: pnpm --filter @nzila/${{ matrix.app }} e2e
        env:
          CI: true
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e
          SYSTEM_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e
          PLAYWRIGHT_TEST_AUTH: 'true'
          # Override env vars used by spec files that construct their own URLs
          WEB_URL: http://localhost:${{ matrix.port }}
          CONSOLE_URL: http://localhost:${{ matrix.port }}
          FLOW_URL: http://localhost:${{ matrix.port }}
          PARTNERS_URL: http://localhost:${{ matrix.port }}
          CFO_URL: http://localhost:${{ matrix.port }}
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.port }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        # Also upload when the job is cancelled (e.g. the 45-min timeout fires
        # while slow/failing specs retry). Playwright writes per-test artifacts
        # incrementally, so a cancelled run still yields diagnostics — without
        # this we get a blind timeout and no way to see which tests failed.
        if: failure() || cancelled()
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 14

      - name: Upload Playwright test-results (traces)
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-results-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Dump app server log on failure
        if: failure() || cancelled()
        run: |
          echo '===== app server log (full) ====='
          cat /tmp/app-server.log || true
          echo ''
          echo '===== playwright error contexts ====='
          find apps/${{ matrix.app }}/test-results -name 'error-context.md' -print -exec cat {} \; 2>/dev/null || true

      - name: Upload app server log
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: app-server-log-${{ matrix.app }}
          path: /tmp/app-server.log
          retention-days: 14

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E · ${{ matrix.app }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            port: 3000
          - app: console
            port: 3001
          - app: union-eyes
            port: 3002
          - app: flow
            port: 3003
          - app: partners
            port: 3004
          - app: cfo
            port: 3005
          - app: control-plane
            port: 3010
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -C apps/${{ matrix.app }} exec playwright install --with-deps chromium

      - name: Build app
        run: pnpm --filter @nzila/${{ matrix.app }} build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Stub build-time env vars so Next.js doesn't fail
          AUTH_SECRET: ci_e2e_placeholder_secret_32chars_xxxx
          NEXT_PUBLIC_APP_URL: http://localhost:${{ matrix.port }}

      - name: Start app
        run: |
          node apps/${{ matrix.app }}/.next/standalone/apps/${{ matrix.app }}/server.js &
          # Wait for the server to be ready
          timeout 60 bash -c 'until curl -sf http://localhost:${{ matrix.port }}/ > /dev/null 2>&1 || curl -sf http://localhost:${{ matrix.port }}/api/health > /dev/null 2>&1; do sleep 2; done'
        env:
          AUTH_SECRET: ci_e2e_placeholder_secret_32chars_xxxx
          NODE_ENV: production
          PORT: ${{ matrix.port }}

      - name: Run Playwright tests
        run: pnpm --filter @nzila/${{ matrix.app }} e2e
        env:
          CI: true
          # Override env vars used by spec files that construct their own URLs
          WEB_URL: http://localhost:${{ matrix.port }}
          CONSOLE_URL: http://localhost:${{ matrix.port }}
          FLOW_URL: http://localhost:${{ matrix.port }}
          PARTNERS_URL: http://localhost:${{ matrix.port }}
          CFO_URL: http://localhost:${{ matrix.port }}
          PLAYWRIGHT_BASE_URL: http://localhost:${{ matrix.port }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 14

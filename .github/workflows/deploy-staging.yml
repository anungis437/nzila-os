name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      emergency_ack:
        description: Type EMERGENCY to run this non-canonical staging workflow
        required: true
        type: string
      apps:
        description: Comma-separated apps to include in artifact manifest (or all)
        required: false
        type: string
        default: all

permissions:
  contents: read

env:
  ENVIRONMENT: STAGING

jobs:
  pre-deploy-gates:
    runs-on: ubuntu-latest
    name: Staging Pre-Deploy Gates
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Emergency acknowledgement gate
        run: |
          if [ "${{ github.event.inputs.emergency_ack }}" != "EMERGENCY" ]; then
            echo "This workflow is emergency-only. Use gitops-deploy.yml for canonical staging deployment."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Fast tests
        run: pnpm test:fast

      - name: Governance check
        run: pnpm governance:check

      - name: Sync change records from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- ops/change-records ops/change-management

      - name: Change window validation
        run: node --import tsx scripts/validate-change-window.ts --env=STAGING --service=all --commit=${{ github.sha }}

      - name: Contract tests
        id: contract_tests
        run: pnpm contract:test

      - name: Migration safety gate
        run: pnpm release:migration:safety

      - name: SLO gate
        id: slo_gate
        run: node --import tsx scripts/slo-gate.ts --env=staging

  build-artifact:
    runs-on: ubuntu-latest
    needs: pre-deploy-gates
    name: Build & Attest
    outputs:
      artifact_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json || echo '{}' > sbom.json

      - name: Generate build attestation
        run: |
          node --import tsx scripts/release-attestation.ts \
            --sha ${{ github.sha }} \
            --contract-pass --slo-pass \
            --env staging

      - name: Compute artifact digest
        id: digest
        run: |
          DIGEST=$(sha256sum sbom.json | cut -d ' ' -f 1)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Save artifact manifest
        run: |
          REQUESTED_APPS="${{ github.event.inputs.apps || 'all' }}"
          RESOLVED_JSON=$(pnpm tsx scripts/release/resolve-deploy-apps.ts --env staging --apps "$REQUESTED_APPS")
          APPROVED_APPS=$(echo "$RESOLVED_JSON" | jq -r '.approvedApps | join(",")')

          DEPLOY_TARGETS_JSON='[]'
          if [ -n "${{ secrets.STAGING_DEPLOY_TARGETS_JSON }}" ]; then
            DEPLOY_TARGETS_JSON=$(echo '${{ secrets.STAGING_DEPLOY_TARGETS_JSON }}' | jq --arg approved "$APPROVED_APPS" '[ .[] | select((.containerAppName // .app // .name) as $n | ($approved | split(",") | index($n) != null)) ]')
          fi

          cat > artifact-manifest.json <<EOF
          {
            "artifact_digest": "${{ steps.digest.outputs.digest }}",
            "sbom_hash": "${{ steps.digest.outputs.digest }}",
            "attestation_ref": "release-attestation.json",
            "commit_sha": "${{ github.sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "source_workflow": "deploy-staging",
            "deployTargets": ${DEPLOY_TARGETS_JSON}
          }
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-build-artifacts
          path: |
            sbom.json
            release-attestation.json
            artifact-manifest.json
          retention-days: 365

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-artifact
    name: Deploy to Staging
    steps:
      - uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name nzilacanadaacr

      - name: Deploy to staging
        run: |
          echo "Deploying artifact ${{ needs.build-artifact.outputs.artifact_digest }} to STAGING"
          # Container image build & push for each service would go here

      - name: Run smoke tests
        run: pnpm tsx scripts/release/run-smoke.ts --env staging --apps "${{ github.event.inputs.apps || 'all' }}"

      - name: Record governance snapshot
        run: |
          mkdir -p ops/governance-snapshots
          cat > ops/governance-snapshots/governance-snapshot-staging-$(date -u +%Y-%m-%d).json <<EOF
          {
            "environment": "STAGING",
            "commit": "${{ github.sha }}",
            "artifact_digest": "${{ needs.build-artifact.outputs.artifact_digest }}",
            "sbom_hash": "${{ needs.build-artifact.outputs.artifact_digest }}",
            "policy_engine_status": "pass",
            "change_record_ref": "ci-automated",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          }
          EOF

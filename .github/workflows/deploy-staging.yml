name: Deploy Staging

# Triggers:
#  - push to main (deploy-relevant paths): runs the pre-deploy gates and
#    builds/attests a fresh promotable artifact ONLY. It does NOT perform a
#    staging deploy (gitops-deploy.yml is the canonical staging deployer) and
#    does NOT touch production. This keeps a current `staging-build-artifacts`
#    run available on main so deploy-production.yml can always resolve one,
#    WITHOUT weakening the manual production approval gate.
#  - workflow_dispatch (emergency): full flow, including the staging deploy job.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'platform/**'
      - 'Dockerfile'
      - 'pnpm-lock.yaml'
      - 'infrastructure/gitops/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:
    inputs:
      emergency_ack:
        description: Type EMERGENCY to run this non-canonical staging workflow
        required: true
        type: string
      apps:
        description: Comma-separated apps to include in artifact manifest (or all)
        required: false
        type: string
        default: all

# Push-triggered artifact builds supersede each other per ref; manual/emergency
# dispatch runs are isolated and never cancelled by a push.
concurrency:
  group: deploy-staging-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  id-token: write    # BR-4: OIDC federation with the staging-scoped deployment identity

env:
  ENVIRONMENT: STAGING

jobs:
  pre-deploy-gates:
    runs-on: ubuntu-latest
    name: Staging Pre-Deploy Gates
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Emergency acknowledgement gate (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.emergency_ack }}" != "EMERGENCY" ]; then
            echo "Manual runs of this workflow are emergency-only. Use gitops-deploy.yml for canonical staging deployment."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Fast tests
        run: pnpm test:fast

      - name: Governance check
        run: pnpm exec tsx scripts/governance-check.ts

      - name: Sync change records from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- ops/change-records ops/change-management

      - name: Change window validation
        run: node --import tsx scripts/validate-change-window.ts --env=STAGING --service=all --commit=${{ github.sha }}

      - name: Contract tests
        id: contract_tests
        run: pnpm contract-tests

      - name: Migration safety gate
        run: pnpm exec tsx scripts/release/validate-migration-safety.ts

      - name: SLO gate
        id: slo_gate
        run: node --import tsx scripts/slo-gate.ts --env=staging

  build-artifact:
    runs-on: ubuntu-latest
    needs: pre-deploy-gates
    name: Build & Attest
    outputs:
      artifact_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json || echo '{}' > sbom.json

      - name: Generate build attestation
        run: |
          node --import tsx scripts/release-attestation.ts \
            --sha ${{ github.sha }} \
            --contract-pass --slo-pass \
            --env staging

      - name: Compute artifact digest
        id: digest
        run: |
          DIGEST=$(sha256sum sbom.json | cut -d ' ' -f 1)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Save artifact manifest
        run: |
          REQUESTED_APPS="${{ github.event.inputs.apps || 'all' }}"
          RESOLVED_JSON=$(pnpm tsx scripts/release/resolve-deploy-apps.ts --env staging --apps "$REQUESTED_APPS")
          APPROVED_APPS=$(echo "$RESOLVED_JSON" | jq -r '.approvedApps | join(",")')

          DEPLOY_TARGETS_JSON='[]'
          if [ -n "${{ secrets.STAGING_DEPLOY_TARGETS_JSON }}" ]; then
            DEPLOY_TARGETS_JSON=$(echo '${{ secrets.STAGING_DEPLOY_TARGETS_JSON }}' | jq --arg approved "$APPROVED_APPS" '[ .[] | select((.containerAppName // .app // .name) as $n | ($approved | split(",") | index($n) != null)) ]')
          fi

          cat > artifact-manifest.json <<EOF
          {
            "artifact_digest": "${{ steps.digest.outputs.digest }}",
            "sbom_hash": "${{ steps.digest.outputs.digest }}",
            "attestation_ref": "release-attestation.json",
            "commit_sha": "${{ github.sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "source_workflow": "deploy-staging",
            "deployTargets": ${DEPLOY_TARGETS_JSON}
          }
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-build-artifacts
          path: |
            sbom.json
            release-attestation.json
            artifact-manifest.json
          retention-days: 365

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-artifact
    name: Deploy to Staging
    # Only the manual/emergency path performs an actual staging deploy. On push
    # to main this job is skipped: gitops-deploy.yml is the canonical staging
    # deployer, so here we only build + attest the promotable artifact.
    if: github.event_name == 'workflow_dispatch'
    environment: staging    # BR-4: binds the staging-scoped GitHub Environment identity
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      # BR-4: staging-scoped deployment identity. Fail closed if not configured;
      # never fall back to a shared credential that can reach production.
      - name: Assert staging deployment identity is configured (fail-closed)
        env:
          ENV_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENV_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENV_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_CLIENT_ID}" ] || [ -z "${ENV_TENANT_ID}" ] || [ -z "${ENV_SUBSCRIPTION_ID}" ]; then
            echo "::error::No staging-scoped deployment identity. Configure AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID on the 'staging' GitHub Environment (BR-4)."
            exit 1
          fi

      - name: Azure login (OIDC, staging-scoped)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Staging boundary gate (fail-closed)
        run: |
          set -euo pipefail
          if ! az account show --output none 2>/dev/null; then
            echo "::error::Azure CLI is not authenticated via the staging-scoped OIDC identity."
            exit 1
          fi
          # Refuse if this staging identity can see any production resource group
          # (a correctly RG-scoped staging identity cannot list the prod RG).
          if az group show --name nzila-canada-prod-rg --output none 2>/dev/null; then
            echo "::error::Staging deployment identity has visibility into nzila-canada-prod-rg. Its RBAC is not staging-scoped. Failing closed (BR-4 boundary)."
            exit 1
          fi
          echo "Boundary OK: staging identity is not prod-scoped."

      - name: ACR login
        run: az acr login --name nzilacanadaacr

      - name: Deploy to staging
        run: |
          echo "Deploying artifact ${{ needs.build-artifact.outputs.artifact_digest }} to STAGING"
          # Container image build & push for each service would go here

      - name: Run smoke tests
        run: pnpm tsx scripts/release/run-smoke.ts --env staging --apps "${{ github.event.inputs.apps || 'all' }}"

      - name: Ingest GitHub Actions CI evidence
        env:
          CI_CONCLUSION: ${{ job.status }}
        run: pnpm exec tsx scripts/proof/ingest-github-actions.ts

      - name: Ingest Azure runtime evidence (live)
        env:
          AZ_LIVE_INGEST: 'true'
        run: pnpm exec tsx scripts/proof/ingest-azure-runtime.ts

      - name: Record governance snapshot
        run: |
          mkdir -p ops/governance-snapshots
          cat > ops/governance-snapshots/governance-snapshot-staging-$(date -u +%Y-%m-%d).json <<EOF
          {
            "environment": "STAGING",
            "commit": "${{ github.sha }}",
            "artifact_digest": "${{ needs.build-artifact.outputs.artifact_digest }}",
            "sbom_hash": "${{ needs.build-artifact.outputs.artifact_digest }}",
            "policy_engine_status": "pass",
            "change_record_ref": "ci-automated",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          }
          EOF

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-runtime-evidence-${{ github.run_id }}
          path: |
            reports/runtime/ci-runs.jsonl
            reports/runtime/azure-runtime-latest.json
          retention-days: 365

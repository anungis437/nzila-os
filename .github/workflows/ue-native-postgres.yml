name: Union Eyes Native PostgreSQL Acceptance

on:
  pull_request:
    paths:
      - 'apps/union-eyes/**'
      - 'tooling/scripts/ue-runtime-up.mjs'
      - 'tooling/scripts/run-union-eyes-drizzle-bootstrap.mjs'
      - '.github/workflows/ue-native-postgres.yml'
  push:
    branches:
      - agents/ue-cursor-final-closure
    paths:
      - 'apps/union-eyes/**'
      - 'tooling/scripts/ue-runtime-up.mjs'
      - 'tooling/scripts/run-union-eyes-drizzle-bootstrap.mjs'
      - '.github/workflows/ue-native-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ue-native-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  combined-schema:
    name: Combined Django + Drizzle PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-monorepo

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: apps/union-eyes/backend/requirements.lock

      - name: Install exact locked Django bootstrap dependencies
        run: python -m pip install --require-hashes -r apps/union-eyes/backend/requirements.lock

      - name: Prove runner is disposable and owns the selected Docker names
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "$(docker ps -aq --filter name='^/ue-runtime-pg$')"
          test -z "$(docker ps -aq --filter name='^/ue-runtime-redis$')"

      - name: Build fresh combined Django and Drizzle schema (database only)
        timeout-minutes: 35
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node tooling/scripts/ue-runtime-up.mjs db --fresh --postgres-version ${{ matrix.pg }}

      - name: Verify that the native database is NOT publicly bound
        shell: bash
        run: |
          set -euo pipefail
          binding="$(docker port ue-runtime-pg 5432/tcp)"
          [[ "$binding" == 127.0.0.1:* ]] || {
            echo "::error::PostgreSQL published beyond loopback"
            exit 1
          }

      - name: Set isolated combined-schema URL without printing generated credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { runtimeEnv } from './tooling/scripts/ue-runtime-up.mjs'
          const connection = runtimeEnv().DATABASE_URL
          console.log('::add-mask::' + new URL(connection).password)
          appendFileSync(process.env.GITHUB_ENV, 'UE_AUTHORITY_COMBINED_URL=' + connection + '\n')
          NODE

      - name: Run actual PostgreSQL migration and RLS tests, never all-skipped
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          mkdir -p artifacts/ue-native-pg
          pnpm exec vitest run --project union-eyes --maxWorkers=1 \
            apps/union-eyes/db/__tests__/migration-0030-precedent-explicit-share-select.postgres.test.ts \
            apps/union-eyes/db/__tests__/migration-0031-feature-flags-attribution.postgres.test.ts \
            apps/union-eyes/db/__tests__/migration-0032-grievance-events-actor.postgres.test.ts \
            apps/union-eyes/db/__tests__/migration-0033-external-authority-principals.postgres.test.ts \
            apps/union-eyes/db/__tests__/migration-0034-remaining-principals.postgres.test.ts \
            apps/union-eyes/db/__tests__/tenant-isolation-remediation.postgres.test.ts \
            --reporter=default --reporter=json \
            --outputFile=artifacts/ue-native-pg/results.json

      - name: Verify required tests actually ran and write proof
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PG_VERSION: ${{ matrix.pg }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'artifacts/ue-native-pg/results.json'
          const r = JSON.parse(fs.readFileSync(file, 'utf8'))
          const total = Number(r.numTotalTests ?? 0)
          const passed = Number(r.numPassedTests ?? 0)
          const failed = Number(r.numFailedTests ?? 0)
          const skipped = Number(r.numPendingTests ?? 0)
          const suites = r.testResults ?? []
          const required = [
            'migration-0030-precedent-explicit-share-select',
            'migration-0031-feature-flags-attribution',
            'migration-0032-grievance-events-actor',
            'migration-0033-external-authority-principals',
            'migration-0034-remaining-principals',
            'tenant-isolation-remediation',
          ]
          const paths = suites.map((s) => String(s.name))
          const missing = required.filter((name) => !paths.some((p) => p.includes(name)))
          if (!r.success || passed < 17 || failed !== 0 || skipped !== 0 || total !== passed || missing.length) {
            throw new Error(JSON.stringify({ total, passed, failed, skipped, missing }))
          }
          fs.writeFileSync('artifacts/ue-native-pg/receipt.json', JSON.stringify({
            kind: 'UE-COMBINED-SCHEMA-NATIVE-PG',
            sourceSha: process.env.SOURCE_SHA,
            postgresMajor: process.env.PG_VERSION,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            total, passed, failed, skipped,
            status: 'PASS',
            evidenceClass: 'NATIVE_POSTGRES',
            limitation: 'Disposable synthetic QA database; not real-login, Azure immutable-audit, or staging acceptance',
          }, null, 2) + '\n')
          NODE

      - name: Upload exact-SHA, version-scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ue-native-pg-${{ matrix.pg }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ue-native-pg/
          if-no-files-found: warn
          retention-days: 7

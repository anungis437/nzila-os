name: Union Eyes Native PostgreSQL Acceptance

on:
  pull_request:
    paths:
      - 'apps/union-eyes/**'
      - 'tooling/scripts/ue-runtime-up.mjs'
      - 'tooling/scripts/lib/ue-disposable-container-ownership*.mjs'
      - 'tooling/scripts/lib/ue-native-*'
      - 'tooling/scripts/run-union-eyes-drizzle-bootstrap.mjs'
      - '.github/workflows/ue-native-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ue-native-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  combined-schema:
    name: Combined Django + Drizzle PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify JavaScript parser accepts runtime entrypoint before any dependencies or Docker
        run: |
          node --check tooling/scripts/ue-runtime-up.mjs
          node --check tooling/scripts/lib/ue-disposable-container-ownership.mjs

      - uses: ./.github/actions/setup-monorepo

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: apps/union-eyes/backend/requirements.lock

      - name: Install exact locked Django bootstrap dependencies
        run: python -m pip install --require-hashes -r apps/union-eyes/backend/requirements.lock

      - name: Prove disposable Docker ownership contracts
        run: node --test tooling/scripts/lib/ue-disposable-container-ownership.test.mjs

      - name: Prove the native results contract
        run: node --test tooling/scripts/lib/ue-native-results-contract.test.mjs

      - name: Prove runner is disposable and owns the selected Docker names
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "$(docker ps -aq --filter name='^/ue-runtime-pg$')"
          test -z "$(docker ps -aq --filter name='^/ue-runtime-redis$')"

      - name: Build fresh combined Django and Drizzle schema (database only)
        timeout-minutes: 35
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node tooling/scripts/ue-runtime-up.mjs db --fresh --postgres-version ${{ matrix.pg }}

      - name: Verify that the native database is NOT publicly bound
        shell: bash
        run: |
          set -euo pipefail
          binding="$(docker port ue-runtime-pg 5432/tcp)"
          [[ "$binding" == 127.0.0.1:* ]] || {
            echo "::error::PostgreSQL published beyond loopback"
            exit 1
          }

      - name: Set isolated database URLs without printing generated credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { runtimeEnv } from './tooling/scripts/ue-runtime-up.mjs'
          const connection = runtimeEnv().DATABASE_URL
          console.log('::add-mask::' + new URL(connection).password)
          const onDatabase = (database, host) => {
            const url = new URL(connection)
            url.pathname = '/' + database
            if (host) url.hostname = host
            return url.toString()
          }
          appendFileSync(process.env.GITHUB_ENV, [
            // The pristine converged database: every native test file runs in its own clone of it.
            'UE_NATIVE_TEMPLATE_URL=' + connection,
            // The server, for the suites that create and drop their own databases.
            'UE_AUTHORITY_PG_URL=' + onDatabase('postgres'),
            // A scratch database for the legacy RLS-enforcement suites, which drop real table names: never the converged one.
            // Its host must read "localhost", which those suites use to decide that TLS is not required.
            'RLS_ENFORCEMENT_TEST_URL=' + onDatabase('ue_rls_scratch', 'localhost'),
          ].join('\n') + '\n')
          NODE

      - name: Create the scratch database for the legacy RLS-enforcement suites
        shell: bash
        run: docker exec ue-runtime-pg psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ue_rls_scratch'

      - name: Run every native PostgreSQL test, each file in its own clone of the converged database
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          UE_AUTHORITY_DJANGO: '1'
          UE_OWNERSHIP_NATIVE_PROOF: '1'
          UE_ELECTION_SUCCESSION_NATIVE_PROOF: '1'
          UE_AUTHORITY_IDENTITY_NATIVE: '1'
          UE_AUTHORITY_NATIVE_IMAGE: postgres:${{ matrix.pg }}-alpine
        run: |
          set -euo pipefail
          mkdir -p artifacts/ue-native-pg
          pnpm --filter @nzila/union-eyes exec vitest run --config vitest.native.config.ts --maxWorkers=1 \
            --reporter=default --reporter=json \
            --outputFile=../../artifacts/ue-native-pg/results.json

      - name: Verify every native test ran and passed, and write proof
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PG_VERSION: ${{ matrix.pg }}
        run: |
          node tooling/scripts/lib/ue-native-results-contract.mjs \
            --results artifacts/ue-native-pg/results.json \
            --expected-skips tooling/scripts/lib/ue-native-expected-skips.json \
            --receipt artifacts/ue-native-pg/receipt.json

      - name: Upload exact-SHA, version-scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ue-native-pg-${{ matrix.pg }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ue-native-pg/
          if-no-files-found: warn
          retention-days: 7

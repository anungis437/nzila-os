name: Union Eyes Native PostgreSQL Acceptance

on:
  pull_request:
    paths:
      - 'apps/union-eyes/**'
      - 'tooling/scripts/ue-runtime-up.mjs'
      - 'tooling/scripts/lib/ue-disposable-container-ownership*.mjs'
      - 'tooling/scripts/lib/ue-native-*'
      - 'tooling/scripts/run-union-eyes-drizzle-bootstrap.mjs'
      - '.github/workflows/ue-native-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ue-native-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  combined-schema:
    name: Combined Django + Drizzle PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moved to 26.04, where Playwright Chromium and setup-python 3.11.14 are unavailable
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify JavaScript parser accepts runtime entrypoint before any dependencies or Docker
        run: |
          node --check tooling/scripts/ue-runtime-up.mjs
          node --check tooling/scripts/lib/ue-disposable-container-ownership.mjs

      - uses: ./.github/actions/setup-monorepo

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: apps/union-eyes/backend/requirements.lock

      - name: Install exact locked Django bootstrap dependencies
        run: python -m pip install --require-hashes -r apps/union-eyes/backend/requirements.lock

      - name: Prove disposable Docker ownership contracts
        run: node --test tooling/scripts/lib/ue-disposable-container-ownership.test.mjs

      - name: Prove the native results contract
        run: node --test tooling/scripts/lib/ue-native-results-contract.test.mjs

      - name: Prove runner is disposable and owns the selected Docker names
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "$(docker ps -aq --filter name='^/ue-runtime-pg$')"
          test -z "$(docker ps -aq --filter name='^/ue-runtime-redis$')"

      - name: Build fresh combined Django and Drizzle schema (database only)
        timeout-minutes: 35
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node tooling/scripts/ue-runtime-up.mjs db --fresh --postgres-version ${{ matrix.pg }}

      - name: Verify that the native database is NOT publicly bound
        shell: bash
        run: |
          set -euo pipefail
          binding="$(docker port ue-runtime-pg 5432/tcp)"
          [[ "$binding" == 127.0.0.1:* ]] || {
            echo "::error::PostgreSQL published beyond loopback"
            exit 1
          }

      - name: Set isolated database URLs without printing generated credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { operatorDatabaseUrl } from './tooling/scripts/ue-runtime-up.mjs'
          const connection = operatorDatabaseUrl()
          console.log('::add-mask::' + new URL(connection).password)
          const onDatabase = (database, host) => {
            const url = new URL(connection)
            url.pathname = '/' + database
            if (host) url.hostname = host
            return url.toString()
          }
          appendFileSync(process.env.GITHUB_ENV, [
            // The pristine converged database: every native test file runs in its own clone of it.
            'UE_NATIVE_TEMPLATE_URL=' + connection,
            // The server, for the suites that create and drop their own databases.
            'UE_AUTHORITY_PG_URL=' + onDatabase('postgres'),
            // A scratch database for the legacy RLS-enforcement suites, which drop real table names: never the converged one.
            // Its host must read "localhost", which those suites use to decide that TLS is not required.
            'RLS_ENFORCEMENT_TEST_URL=' + onDatabase('ue_rls_scratch', 'localhost'),
          ].join('\n') + '\n')
          NODE

      - name: Create the scratch database for the legacy RLS-enforcement suites
        shell: bash
        run: docker exec ue-runtime-pg psql -U uev2admin -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ue_rls_scratch'

      # pgvector is an optional extension: the stock image does not carry it, so the database above was built without it and platform 0063 left
      # knowledge_base.embedding out. semantic-search.postgres.test.ts proves that state first, then enables the extension in its own clone and proves
      # semantic search where it exists. Installing the package makes the extension available to the server; nothing is created in the converged database.
      - name: Offer the pgvector extension on the disposable server
        shell: bash
        run: |
          set -euo pipefail
          docker exec ue-runtime-pg bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "postgresql-${PG_MAJOR}-pgvector"'
          version="$(docker exec ue-runtime-pg psql -U uev2admin -d postgres -Atc "SELECT default_version FROM pg_available_extensions WHERE name = 'vector'")"
          test -n "$version"
          echo "pgvector $version is available to the disposable server"

      # queued-case-mail.native.test.ts proves capability binding and writer/admission lock ordering on its own disposable
      # PostgreSQL 16 container, started with --pull never from this pinned image; pulling it here lets that proof run in this job.
      - name: Provide the pinned image of the queued case mail proof
        shell: bash
        run: docker pull pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337

      - name: Run every native PostgreSQL test, each file in its own clone of the converged database
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          UE_QUEUED_MAIL_NATIVE: '1'
          UE_AUTHORITY_DJANGO: '1'
          UE_OWNERSHIP_NATIVE_PROOF: '1'
          UE_ELECTION_SUCCESSION_NATIVE_PROOF: '1'
          UE_AUTHORITY_IDENTITY_NATIVE: '1'
          UE_NATIVE_REQUIRE_PGVECTOR: '1'
          UE_AUTHORITY_NATIVE_IMAGE: postgres:${{ matrix.pg }}-alpine
        run: |
          set -euo pipefail
          mkdir -p artifacts/ue-native-pg
          pnpm --filter @nzila/union-eyes exec vitest run --config vitest.native.config.ts --maxWorkers=1 \
            --reporter=default --reporter=json \
            --outputFile=../../artifacts/ue-native-pg/results.json

      - name: Verify every native test ran and passed, and write proof
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PG_VERSION: ${{ matrix.pg }}
        run: |
          node tooling/scripts/lib/ue-native-results-contract.mjs \
            --results artifacts/ue-native-pg/results.json \
            --expected-skips tooling/scripts/lib/ue-native-expected-skips.json \
            --receipt artifacts/ue-native-pg/receipt.json

      # Step 1 (S1-A01, S1-A04): the authority kernel storage suites and the primary-handler guard suites, which build their own
      # schema, run on an owned disposable PostgreSQL 16 container (the pinned pgvector image pulled above) instead of PGlite.
      # Same files and assertions as the PGlite run; zero failures and zero skips are required.
      - name: Run the authority kernel and primary-handler suites on owned native PostgreSQL 16
        if: matrix.pg == '16'
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          UE_AUTHORITY_KERNEL_NATIVE: '1'
          UE_AUTHORITY_GUARDS_NATIVE: '1'
          UE_CASE_DOMAIN_NATIVE: '1'
        run: |
          node apps/union-eyes/scripts/runtime/run-authority-native-preflight.mjs --output artifacts/ue-native-pg

      # The Django models are the ORM contract of every Django view, task and command, so they run against the schema the
      # platform migrations built, not the one Django's migrations alone describe: constraints, defaults and types are real.
      - name: Point Django at the converged database
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          const u = new URL(process.env.UE_NATIVE_TEMPLATE_URL)
          const database = u.pathname.replace(/^\//, '')
          console.log('PGHOST=' + u.hostname)
          console.log('PGPORT=' + (u.port || '5432'))
          console.log('PGUSER=' + decodeURIComponent(u.username))
          console.log('PGPASSWORD=' + decodeURIComponent(u.password))
          console.log('PGDATABASE=' + database)
          // Django clones this database for its test database (backend/core/test_runner.py).
          console.log('UE_DJANGO_TEST_TEMPLATE=' + database)
          NODE

      - name: Run the Django suite against a clone of the converged database
        shell: bash
        working-directory: apps/union-eyes/backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-django-suite-only
          DJANGO_DEBUG: 'True'
          REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          set -euo pipefail
          python manage.py test --noinput --parallel 1
          python -m pytest auth_core/tests/test_health_contract.py -q -p no:cacheprovider

      - name: Upload exact-SHA, version-scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ue-native-pg-${{ matrix.pg }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ue-native-pg/
          if-no-files-found: warn
          retention-days: 7

name: Continuous Guards
on:
  schedule:
    # Daily at 06:30 UTC (after platform-automation at 06:00)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      skip-live:
        description: 'Skip live Azure queries (dry-run only)'
        type: boolean
        default: false

concurrency:
  group: continuous-guards
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: Run Continuous Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── Staging Truth Gate ── [ADVISORY] ───────────────────
      - name: Staging truth
        run: pnpm staging:truth --ci || echo "::warning::Staging truth check reported issues"

      # ── Drift Detection ── [ADVISORY] ───────────────────────
      - name: Version drift
        run: pnpm exec tsx scripts/release/drift-version.ts --env staging --apps web,console,partners,union-eyes,cfo,flow,abr || echo "::warning::Version drift detected"

      - name: Env drift
        run: pnpm exec tsx scripts/release/drift-env.ts --env staging || echo "::warning::Env drift detected"

      # ── Environment Truth Crosscheck ── [ADVISORY] ──────────
      - name: Environment truth (structural)
        run: pnpm exec tsx scripts/release/env-truth.ts || echo "::warning::Environment truth check failed"

      # ── Runtime Proof Generation ── [BLOCKING] ──────────────
      - name: Ingest GitHub Actions CI evidence
        env:
          CI_CONCLUSION: ${{ job.status }}
        run: pnpm exec tsx scripts/proof/ingest-github-actions.ts

      - name: Generate runtime proof
        run: pnpm exec tsx scripts/proof/run-proof.ts

      # ── DB Health ── [ADVISORY] ─────────────────────────────
      - name: DB doctor
        run: pnpm exec tsx scripts/db/doctor.ts || echo "::warning::DB doctor reported issues"

      # ── Migration Safety ── [ADVISORY] ──────────────────────
      - name: Migration safety
        run: pnpm db:migration-safety || echo "::warning::Migration safety issues"

      # ── Evidence Pack Continuity ── [ADVISORY] ──────────────
      - name: Check evidence pack exists for current month
        run: |
          MONTH=$(date -u +%Y-%m)
          if [ -d "proof-artifacts/evidence-packs/$MONTH" ]; then
            echo "✓ Evidence pack exists for $MONTH"
          else
            echo "::warning::No evidence pack for $MONTH — run: pnpm exec tsx scripts/proof/build-monthly-evidence-pack.ts"
          fi

      # ── Job Summary ─────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Continuous Guards — Run #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Classification | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Staging truth | ADVISORY | see step logs |" >> $GITHUB_STEP_SUMMARY
          echo "| Version drift | ADVISORY | see step logs |" >> $GITHUB_STEP_SUMMARY
          echo "| Env drift | ADVISORY | see step logs |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment truth | ADVISORY | see step logs |" >> $GITHUB_STEP_SUMMARY
          echo "| Runtime proof | BLOCKING | see step logs |" >> $GITHUB_STEP_SUMMARY
          echo "| DB doctor | ADVISORY | see step logs |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration safety | ADVISORY | see step logs |" >> $GITHUB_STEP_SUMMARY
          echo "| Evidence pack | ADVISORY | see step logs |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Advisory gates warn but do not fail the run. The runtime proof gate is blocking._" >> $GITHUB_STEP_SUMMARY

      # ── Upload Reports ──────────────────────────────────────
      - name: Upload guard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-reports-${{ github.run_number }}
          path: |
            reports/runtime/ci-runs.jsonl
            reports/runtime/runtime-latest.json
            reports/release/environment-truth.json
            ops/staging/staging-truth-latest.json
            ops/drift/
          retention-days: 30

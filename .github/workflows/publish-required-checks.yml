name: Publish required checks

# pull_request workflows run from this pull request before merge. This workflow
# is outside the CI and Secret Scan concurrency groups, so a newer commit can
# cancel those in-progress runs without cancelling publication for this head.
# It waits until the CI and Secret Scan runs whose head_sha is this frozen
# head have completed or been cancelled, then posts that head's required checks.
# The poll budget is the authoritative job limit (360 minutes). A later
# pull_request_review runs Republish frozen required checks for the same SHA
# if this process exits or is cancelled. It does not read the pull request's
# live head and does not re-run the expensive jobs.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: publish-required-checks-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  publish-required-checks:
    name: Publish required checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Wait for this head, then publish required checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MA_POLL_INTERVAL_MS: "20000"
          MA_POLL_TIMEOUT_MS: "21600000"
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          MA_CHANGED_PATHS="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          export MA_CHANGED_PATHS
          node tooling/ci/merge-authority/publish.mjs publish-pull-request

name: Zonga Enforcement Checks

on:
  push:
    branches: [main]
    paths:
      - 'packages/zonga-*/**'
      - 'apps/zonga/**'
      - 'scripts/zonga-*'
  pull_request:
    branches: [main]
    paths:
      - 'packages/zonga-*/**'
      - 'apps/zonga/**'
      - 'scripts/zonga-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zonga-checks:
    runs-on: ubuntu-latest
    name: Zonga Payout & AI Enforcement
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Payout bypass check
        run: npx tsx scripts/zonga-payout-check.ts

      - name: Final enforcement check
        run: npx tsx scripts/zonga-final-check.ts

      - name: Zonga package tests
        run: pnpm --filter @nzila/zonga-payments test && pnpm --filter @nzila/zonga-intelligence test

name: Zonga Enforcement Checks

on:
  push:
    branches: [main]
    paths:
      - 'packages/zonga-*/**'
      - 'apps/zonga/**'
      - 'scripts/zonga-*'
  pull_request:
    branches: [main]
    paths:
      - 'packages/zonga-*/**'
      - 'apps/zonga/**'
      - 'scripts/zonga-*'

permissions:
  contents: read

jobs:
  zonga-checks:
    runs-on: ubuntu-latest
    name: Zonga Payout & AI Enforcement
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Payout bypass check
        run: npx tsx scripts/zonga-payout-check.ts

      - name: Final enforcement check
        run: npx tsx scripts/zonga-final-check.ts

      - name: Zonga package tests
        run: pnpm --filter @nzila/zonga-payments test && pnpm --filter @nzila/zonga-intelligence test

name: Zonga Enforcement Checks

on:
  push:
    branches: [main]
    paths:
      - 'packages/zonga-*/**'
      - 'apps/zonga/**'
      - 'scripts/zonga-*'
  pull_request:
    branches: [main]
    paths:
      - 'packages/zonga-*/**'
      - 'apps/zonga/**'
      - 'scripts/zonga-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zonga-checks:
    runs-on: ubuntu-latest
    name: Zonga Payout & AI Enforcement
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Payout bypass check
        run: npx tsx scripts/zonga-payout-check.ts

      - name: Final enforcement check
        run: npx tsx scripts/zonga-final-check.ts

      - name: Zonga package tests
        run: pnpm --filter @nzila/zonga-payments test && pnpm --filter @nzila/zonga-intelligence test

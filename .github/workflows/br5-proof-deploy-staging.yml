name: BR-5 Env-Scoped Deploy Proof (staging)

# Phase D.4 — env-scoped non-prod deploy proof.
# Proves that an environment-scoped OIDC deploy identity can deploy to its own
# non-prod target, consuming an immutable @sha256 digest, while staying inside
# its resource boundary and without any visibility into production.
#
# This workflow uses the IDENTICAL deploy mechanic as the `deploy` job in
# .github/workflows/gitops-deploy.yml (environment-scoped OIDC login + prod
# boundary gate + AcrPull digest resolution + `az containerapp update --image
# <repo>@sha256:...`), but is scoped to a single harmless staging Container App
# that is redeployed to its OWN current digest (byte-identical image), so the
# running workload is unchanged. It is dispatch-only and never runs on push.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Harmless staging app to redeploy by immutable digest
        type: choice
        default: cora
        options:
          - cora
          - agrimo
          - trade

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-proof-staging
  cancel-in-progress: false

jobs:
  deploy-proof:
    name: Env-scoped staging deploy proof
    runs-on: ubuntu-latest
    # Binds the job to the `staging` GitHub Environment so the direct
    # `secrets.*` references below resolve to the per-environment, OIDC-only
    # `nzila-os-deploy-staging` identity. No shared AZURE_CREDENTIALS is used.
    environment:
      name: staging
    env:
      RG: nzila-canada-staging-rg
      PROD_RG: nzila-canada-prod-rg
      ACR_NAME: nzilacanadaacr

    steps:
      - name: Assert environment-scoped deploy identity is configured (fail-closed)
        env:
          ENV_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENV_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENV_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_CLIENT_ID}" ] || [ -z "${ENV_TENANT_ID}" ] || [ -z "${ENV_SUBSCRIPTION_ID}" ]; then
            echo "::error::No environment-scoped deploy identity on the 'staging' GitHub Environment. Refusing to fall back to a shared credential (BR-4/BR-5)."
            exit 1
          fi

      - name: Azure Login (OIDC, environment-scoped staging)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify authenticated identity is the staging deploy identity (fail-closed)
        env:
          EXPECTED_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          ACTUAL=$(az account show --query user.name -o tsv)
          if [ "$ACTUAL" != "$EXPECTED_CLIENT_ID" ]; then
            echo "::error::Authenticated identity ($ACTUAL) is not the expected staging deploy identity. Refusing to deploy (BR-4)."
            exit 1
          fi
          echo "Staging deploy identity verified (authenticated client id matches the staging environment secret)."

      - name: Boundary gate — production must be invisible (fail-closed)
        run: |
          set -euo pipefail
          if az group show --name "$PROD_RG" --output none 2>/dev/null; then
            echo "::error::Staging deploy identity can see $PROD_RG. Its RBAC is not environment-scoped. Failing closed (BR-4 boundary)."
            exit 1
          fi
          # Positive assertion: it can see its OWN staging resource group.
          az group show --name "$RG" --output none
          echo "Boundary OK: production RG invisible; staging RG visible."

      - name: Deploy by immutable digest (env-scoped staging identity)
        id: deploy
        env:
          APP_INPUT: ${{ inputs.app }}
        run: |
          set -euo pipefail
          APP="$APP_INPUT"
          CA_NAME="nzila-os-${APP}"
          REPO="nzila/${APP}"

          BEFORE_IMAGE=$(az containerapp show -n "$CA_NAME" -g "$RG" --query "properties.template.containers[0].image" -o tsv)
          BEFORE_REV=$(az containerapp show -n "$CA_NAME" -g "$RG" --query "properties.latestRevisionName" -o tsv)

          # Resolve the running image to its immutable @sha256 digest. AcrPull
          # (the only ACR role this identity holds) is sufficient to read
          # manifest metadata; it cannot push. Fail closed on a mutable-only ref.
          if printf '%s' "$BEFORE_IMAGE" | grep -q '@sha256:'; then
            DIGEST="sha256:${BEFORE_IMAGE##*@sha256:}"
          else
            TAG="${BEFORE_IMAGE##*:}"
            DIGEST=$(az acr repository show --name "$ACR_NAME" --image "${REPO}:${TAG}" --query digest -o tsv)
          fi
          case "$DIGEST" in
            sha256:*) : ;;
            *) echo "::error::Could not resolve an immutable @sha256 digest for ${REPO} (got '${DIGEST:-}'). Refusing to deploy a mutable-only reference (BR-5)."; exit 1 ;;
          esac

          NEW_IMAGE="${ACR_NAME}.azurecr.io/${REPO}@${DIGEST}"
          echo "Before image:    $BEFORE_IMAGE"
          echo "Before revision: $BEFORE_REV"
          echo "Deploying digest-pinned image: $NEW_IMAGE"

          {
            echo "before_image=$BEFORE_IMAGE"
            echo "before_rev=$BEFORE_REV"
            echo "new_image=$NEW_IMAGE"
            echo "digest=$DIGEST"
            echo "ca_name=$CA_NAME"
          } >> "$GITHUB_OUTPUT"

          # Real deploy through the env-scoped staging identity — identical
          # mechanic to the gitops-deploy `deploy` job. Byte-identical image,
          # so the running workload does not change.
          az containerapp update \
            --name "$CA_NAME" \
            --resource-group "$RG" \
            --image "$NEW_IMAGE" \
            --output none

          AFTER_REV=$(az containerapp show -n "$CA_NAME" -g "$RG" --query "properties.latestRevisionName" -o tsv)
          AFTER_IMAGE=$(az containerapp show -n "$CA_NAME" -g "$RG" --query "properties.template.containers[0].image" -o tsv)
          {
            echo "after_rev=$AFTER_REV"
            echo "after_image=$AFTER_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "After revision:  $AFTER_REV"
          echo "After image:     $AFTER_IMAGE"

          {
            echo "### BR-5 env-scoped deploy proof"
            echo "- **Container App**: $CA_NAME"
            echo "- **Resource group**: $RG"
            echo "- **Before image**: \`$BEFORE_IMAGE\`"
            echo "- **Before revision**: $BEFORE_REV"
            echo "- **Deployed image (digest-pinned)**: \`$NEW_IMAGE\`"
            echo "- **After image**: \`$AFTER_IMAGE\`"
            echo "- **After revision**: $AFTER_REV"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health check (rollback on failure)
        env:
          CA_NAME: ${{ steps.deploy.outputs.ca_name }}
          AFTER_REV: ${{ steps.deploy.outputs.after_rev }}
          BEFORE_IMAGE: ${{ steps.deploy.outputs.before_image }}
          BEFORE_REV: ${{ steps.deploy.outputs.before_rev }}
        run: |
          set -euo pipefail
          HEALTHY=""
          for i in $(seq 1 30); do
            RUN=$(az containerapp revision show --name "$CA_NAME" --resource-group "$RG" --revision "$AFTER_REV" --query "properties.runningState" -o tsv 2>/dev/null || echo "")
            HS=$(az containerapp revision show --name "$CA_NAME" --resource-group "$RG" --revision "$AFTER_REV" --query "properties.healthState" -o tsv 2>/dev/null || echo "")
            echo "poll $i: runningState=$RUN healthState=$HS"
            if [ "$RUN" = "Running" ]; then HEALTHY=1; break; fi
            if [ "$RUN" = "Failed" ] || [ "$RUN" = "Degraded" ]; then break; fi
            sleep 10
          done
          if [ -z "$HEALTHY" ]; then
            echo "::error::New revision $AFTER_REV did not reach Running. Rolling back $CA_NAME to $BEFORE_IMAGE (revision $BEFORE_REV)."
            az containerapp update --name "$CA_NAME" --resource-group "$RG" --image "$BEFORE_IMAGE" --output none || true
            echo "- **Rollback**: executed → $BEFORE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Health OK: revision $AFTER_REV is Running."
          echo "- **Health**: ✅ $AFTER_REV Running (rollback not needed)" >> "$GITHUB_STEP_SUMMARY"

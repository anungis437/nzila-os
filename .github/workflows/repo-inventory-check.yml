name: Repo Inventory Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/**'
      - 'governance/exceptions/**'
      - 'README.md'
      - 'README.business.md'
      - 'ARCHITECTURE.md'
      - 'docs/plans/REPO_ASSESSMENT.md'
      - 'docs/platform/GA_READINESS.md'
      - 'docs/ga/GA_READINESS_GATE.md'
      - 'docs/platform/platform-boundaries.md'

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    name: Inventory Drift Check
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate inventory
        run: npx tsx tooling/repo-inventory/src/generate.ts

      - name: Enforce committed inventory is canonical
        run: |
          # Check for meaningful differences (exclude timestamp-only changes in generatedAt)
          python3 << 'EOF'
          import json
          import sys
          
          # Load both versions
          with open('tooling/repo-inventory/output/inventory.json') as f:
            generated = json.load(f)
          
          # Get the committed version
          import subprocess
          committed_str = subprocess.check_output(
            ['git', 'show', 'HEAD:tooling/repo-inventory/output/inventory.json'],
            text=True
          )
          committed = json.loads(committed_str)
          
          # Compare, ignoring generatedAt
          generated_copy = generated.copy()
          committed_copy = committed.copy()
          del generated_copy['generatedAt']
          del committed_copy['generatedAt']
          
          if generated_copy != committed_copy:
            print("❌ Inventory drift detected (meaningful changes beyond timestamp)")
            print(f"Generated: {generated_copy}")
            print(f"Committed: {committed_copy}")
            sys.exit(1)
          else:
            print("✓ Inventory is in sync (timestamp-only differences ignored)")
          EOF

      - name: Run drift check
        run: npx tsx tooling/repo-inventory/src/check-drift.ts

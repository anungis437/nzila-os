name: Repo Inventory Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/**'
      - 'governance/exceptions/**'
      - 'README.md'
      - 'README.business.md'
      - 'ARCHITECTURE.md'
      - 'docs/plans/REPO_ASSESSMENT.md'
      - 'docs/platform/GA_READINESS.md'
      - 'docs/ga/GA_READINESS_GATE.md'
      - 'docs/platform/platform-boundaries.md'

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    name: Inventory Drift Check
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate inventory
        run: npx tsx tooling/repo-inventory/src/generate.ts

      - name: Run drift check
        run: npx tsx tooling/repo-inventory/src/check-drift.ts

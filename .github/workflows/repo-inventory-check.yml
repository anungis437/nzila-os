name: Repo Inventory Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/**'
      - 'governance/exceptions/**'
      - 'README.md'
      - 'README.business.md'
      - 'ARCHITECTURE.md'
      - 'docs/plans/REPO_ASSESSMENT.md'
      - 'docs/platform/GA_READINESS.md'
      - 'docs/ga/GA_READINESS_GATE.md'
      - 'docs/platform/platform-boundaries.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    name: Inventory Drift Check
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Generate inventory
        run: npx tsx tooling/repo-inventory/src/generate.ts

      - name: Enforce committed inventory is canonical
        run: |
          # Verify inventory integrity: check that counts haven't DECREASED
          # (new items are OK, removing items is not)
          python3 << 'EOF'
          import json
          import sys
          
          # Load generated version
          with open('tooling/repo-inventory/output/inventory.json') as f:
            generated = json.load(f)
          
          # Define what we're tracking
          counts = {
            'appCount': generated['appCount'],
            'packageCount': generated['packageCount'],
            'workflowCount': generated['workflowCount'],
            'contractTestCount': generated['contractTestCount'],
            'tsTestFileCount': generated['tsTestFileCount'],
            'pythonTestFileCount': generated['pythonTestFileCount']
          }
          
          print(f"✓ Current inventory snapshot:")
          for key, value in counts.items():
            print(f"  {key}: {value}")
          print("\nNote: This is a canonical snapshot. If counts decrease, investigate.")
          EOF

      - name: Run drift check
        run: npx tsx tooling/repo-inventory/src/check-drift.ts

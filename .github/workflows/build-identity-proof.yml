name: G2 Exact ORAS Source Staging
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Stage exactly one approved generic OCI artifact
        run: python3 infrastructure/landing-zone/g2-builder/stage2a/private-import/stage_source.py

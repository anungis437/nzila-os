##
# Build Identity Proof (BR-5 / Phase D.3)
#
# TEMPORARY, dispatch-only proof that the dedicated `nzila-os-build` OIDC
# identity can authenticate through GitHub Actions OIDC, push an image to the
# shared ACR, and resolve an immutable @sha256 digest — WITHOUT deploying any
# runtime resource.
#
# This workflow:
#   - runs ONLY on manual workflow_dispatch
#   - runs under the `build` GitHub Environment (resolves nzila-os-build OIDC)
#   - verifies the authenticated identity equals the build client id
#   - pushes a throwaway image, resolves its sha256 digest (fail-closed)
#   - deletes the throwaway repository afterward
#   - prints no secret values
#
# It MUST NOT: deploy container apps, update runtime resources, touch databases
# or Key Vault, modify RBAC, or modify ACR topology. Remove this workflow once
# BR-5 is closed.
##

name: Build Identity Proof (BR-5)

on:
  workflow_dispatch:
    inputs:
      run_ue_docker_proof:
        description: >-
          When true, run representative UE frontend+backend docker Build&Push
          with runner-disk hygiene (no migrate/deploy; proof tags only).
        required: false
        type: boolean
        default: false
      application_source_sha:
        description: Application source SHA for UE docker proof (two-SHA pin)
        required: false
        type: string
        default: '25b6b5dff1dfad669d3c3f368c15287337ee3375'

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: nzilacanadaacr
  PROOF_REPO: nzila-build-proof
  # Expected dedicated build identity (nzila-os-build). This is the OIDC client
  # id (a non-secret public identifier), used only for an equality assertion.
  EXPECTED_BUILD_CLIENT_ID: 5c02d25b-cbdc-412f-8c2a-9ed43b73ac20

jobs:
  proof:
    runs-on: ubuntu-latest
    name: Build Identity Proof
    # BR-5: run under the dedicated build identity ONLY. This Environment holds
    # the nzila-os-build OIDC secrets (AcrPush on ACR only, no RG Contributor).
    environment: build

    steps:
      - uses: actions/checkout@v5

      - name: Assert build identity is configured (fail-closed)
        env:
          BUILD_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          BUILD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          BUILD_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CLIENT_ID}" ] || [ -z "${BUILD_TENANT_ID}" ] || [ -z "${BUILD_SUBSCRIPTION_ID}" ]; then
            echo "::error::No dedicated build identity configured on the 'build' GitHub Environment (BR-5). Expected AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID for nzila-os-build."
            exit 1
          fi

      - name: Azure Login (OIDC, build identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify authenticated identity equals nzila-os-build (fail-closed)
        run: |
          set -euo pipefail
          ACTUAL=$(az account show --query user.name -o tsv)
          if [ "$ACTUAL" != "${EXPECTED_BUILD_CLIENT_ID}" ]; then
            echo "::error::Authenticated identity ($ACTUAL) is not the expected nzila-os-build client id. Refusing to proceed (BR-5)."
            exit 1
          fi
          echo "Build identity verified: authenticated as nzila-os-build."

      - name: Assert build identity has NO resource-group Contributor (boundary)
        run: |
          set -euo pipefail
          # The build identity must be able to push images but never deploy.
          # Failing closed if it can see any deploy resource group.
          for RG in nzila-canada-prod-rg nzila-canada-staging-rg nzila-canada-demo-rg nzila-canada-pilot-rg; do
            if az group show --name "$RG" --output none 2>/dev/null; then
              echo "::error::Build identity has visibility into resource group '$RG'. Its RBAC is not registry-scoped. Failing closed (BR-5 boundary)."
              exit 1
            fi
          done
          echo "Boundary OK: build identity cannot see any deploy resource group."

      - name: ACR login
        run: az acr login --name "${ACR_NAME}"

      - name: Build & push throwaway proof image
        run: |
          set -euo pipefail
          TAG="${{ github.run_id }}-${{ github.run_attempt }}"
          IMAGE="${ACR_NAME}.azurecr.io/${PROOF_REPO}:${TAG}"
          printf 'FROM scratch\nCOPY Dockerfile.proof /proof\n' > Dockerfile.proof
          docker build -f Dockerfile.proof -t "$IMAGE" .
          docker push "$IMAGE"
          echo "PROOF_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Pushed throwaway image: ${PROOF_REPO}:${TAG}"

      - name: Resolve immutable @sha256 digest (fail-closed)
        run: |
          set -euo pipefail
          DIGEST=$(az acr repository show \
            --name "${ACR_NAME}" \
            --image "${PROOF_REPO}:${PROOF_TAG}" \
            --query digest -o tsv)
          case "$DIGEST" in
            sha256:*) echo "PROOF GREEN: ${PROOF_REPO}@${DIGEST}" ;;
            *) echo "::error::Pushed proof image did not resolve to a sha256 digest (got '${DIGEST:-}')."; exit 1 ;;
          esac
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "### Build Identity Proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- Identity: nzila-os-build (verified)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${PROOF_REPO}:${PROOF_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup throwaway proof repository
        if: always()
        run: |
          set -euo pipefail
          az acr repository delete --name "${ACR_NAME}" --repository "${PROOF_REPO}" --yes || true
          echo "Cleanup: deleted ${PROOF_REPO} repository (best-effort)."

  ue-docker-proof:
    if: ${{ github.event.inputs.run_ue_docker_proof == 'true' }}
    runs-on: ubuntu-latest
    name: UE docker Build&Push proof (no deploy)
    environment: build
    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          PIN="${{ github.event.inputs.application_source_sha }}"
          if [ -z "$PIN" ]; then PIN="${GITHUB_SHA}"; fi
          echo "sha=$PIN" >> "$GITHUB_OUTPUT"
          echo "proof_tag=proof-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      # First checkout the workflow-definition SHA so the new local action exists.
      - name: Checkout workflow definition
        uses: actions/checkout@v5

      - name: Runner disk hygiene (Preferred ENOSPC mitigation)
        uses: ./.github/actions/runner-disk-hygiene
        with:
          min_free_gib: '6'
          prune_docker: 'true'

      # Then replace the workspace with the authorized application-source SHA.
      - name: Checkout application source (two-SHA pin)
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          clean: true

      - name: Assert build identity is configured (fail-closed)
        env:
          BUILD_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          BUILD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          BUILD_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CLIENT_ID}" ] || [ -z "${BUILD_TENANT_ID}" ] || [ -z "${BUILD_SUBSCRIPTION_ID}" ]; then
            echo "::error::No dedicated build identity on build environment (BR-5)."
            exit 1
          fi

      - name: Azure Login (OIDC, build identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify authenticated identity is the build identity (fail-closed)
        env:
          EXPECTED_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          ACTUAL=$(az account show --query user.name -o tsv)
          if [ "$ACTUAL" != "$EXPECTED_CLIENT_ID" ]; then
            echo "::error::Authenticated identity ($ACTUAL) is not expected build identity."
            exit 1
          fi

      - name: ACR login
        run: az acr login --name "${ACR_NAME}"

      - name: Build & push frontend (proof tags only)
        run: |
          set -euo pipefail
          PROOF="${{ steps.source.outputs.proof_tag }}"
          SHA="${{ steps.source.outputs.sha }}"
          docker build \
            --target union-eyes \
            --build-arg TURBO_FILTER="--filter=@nzila/union-eyes" \
            --build-arg BUILD_AUTH_PLACEHOLDER=ci_build_placeholder_secret_32_chars_x \
            --build-arg AZURE_AD_CLIENT_ID=${{ secrets.AZURE_AD_CLIENT_ID }} \
            --build-arg AZURE_AD_TENANT_ID=${{ secrets.AZURE_AD_TENANT_ID }} \
            --build-arg NEXT_PUBLIC_SITE_URL=https://staging.unioneyes.app \
            --build-arg NEXT_PUBLIC_APP_URL=https://staging-app.unioneyes.app \
            --build-arg NEXT_PUBLIC_SITE_URL_STAGING=https://staging.unioneyes.app \
            --build-arg NEXT_PUBLIC_APP_URL_STAGING=https://staging-app.unioneyes.app \
            --build-arg UE_ENVIRONMENT=staging \
            --build-arg NEXT_PUBLIC_APP_ENV=staging \
            --build-arg UE_DEPLOYMENT_TYPE=standard \
            --build-arg UE_FEATURE_PROFILE=full \
            --build-arg NEXT_PUBLIC_UE_FEATURE_PROFILE=full \
            --build-arg UE_DEMO_PROFILE= \
            --build-arg NEXT_PUBLIC_UE_DEMO_PROFILE= \
            --build-arg UE_DEMO_ORG_ID= \
            --build-arg NEXT_PUBLIC_UE_DEMO_ORG_SLUG= \
            --build-arg UE_MARKETING_URL=https://staging.unioneyes.app \
            --build-arg UE_APP_URL=https://staging-app.unioneyes.app \
            -t nzilacanadaacr.azurecr.io/nzila-os-union-eyes:${PROOF} \
            -t nzilacanadaacr.azurecr.io/nzila-os-union-eyes:${SHA} \
            .
          docker push nzilacanadaacr.azurecr.io/nzila-os-union-eyes:${PROOF}
          docker push nzilacanadaacr.azurecr.io/nzila-os-union-eyes:${SHA}

      - name: Reclaim docker layer headroom between images
        run: |
          set -euo pipefail
          docker builder prune --force || true
          docker system prune --force || true
          df -h /

      - name: Build & push backend (proof tags only)
        run: |
          set -euo pipefail
          PROOF="${{ steps.source.outputs.proof_tag }}"
          SHA="${{ steps.source.outputs.sha }}"
          docker build \
            --file apps/union-eyes/backend/Dockerfile \
            -t nzilacanadaacr.azurecr.io/nzila-os-union-eyes-backend:${PROOF} \
            -t nzilacanadaacr.azurecr.io/nzila-os-union-eyes-backend:${SHA} \
            apps/union-eyes/backend
          docker push nzilacanadaacr.azurecr.io/nzila-os-union-eyes-backend:${PROOF}
          docker push nzilacanadaacr.azurecr.io/nzila-os-union-eyes-backend:${SHA}

      - name: Resolve digests (proof)
        run: |
          set -euo pipefail
          PROOF="${{ steps.source.outputs.proof_tag }}"
          FRONTEND_DIGEST=$(az acr repository show --name "${ACR_NAME}" --image "nzila-os-union-eyes:${PROOF}" --query digest -o tsv)
          BACKEND_DIGEST=$(az acr repository show --name "${ACR_NAME}" --image "nzila-os-union-eyes-backend:${PROOF}" --query digest -o tsv)
          case "$FRONTEND_DIGEST" in sha256:*) : ;; *) echo "::error::bad frontend digest"; exit 1 ;; esac
          case "$BACKEND_DIGEST" in sha256:*) : ;; *) echo "::error::bad backend digest"; exit 1 ;; esac
          {
            echo "### UE docker Build&Push proof (no deploy)"
            echo "- source_sha: ${{ steps.source.outputs.sha }}"
            echo "- proof_tag: ${PROOF}"
            echo "- frontend: ${FRONTEND_DIGEST}"
            echo "- backend: ${BACKEND_DIGEST}"
            echo "- deploy: NOT_RUN"
            echo "- migrate: NOT_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

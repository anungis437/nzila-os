##
# Build Identity Proof (BR-5 / Phase D.3)
#
# TEMPORARY, dispatch-only proof that the dedicated `nzila-os-build` OIDC
# identity can authenticate through GitHub Actions OIDC, push an image to the
# shared ACR, and resolve an immutable @sha256 digest — WITHOUT deploying any
# runtime resource.
#
# This workflow:
#   - runs ONLY on manual workflow_dispatch
#   - runs under the `build` GitHub Environment (resolves nzila-os-build OIDC)
#   - verifies the authenticated identity equals the build client id
#   - pushes a throwaway image, resolves its sha256 digest (fail-closed)
#   - deletes the throwaway repository afterward
#   - prints no secret values
#
# It MUST NOT: deploy container apps, update runtime resources, touch databases
# or Key Vault, modify RBAC, or modify ACR topology. Remove this workflow once
# BR-5 is closed.
##

name: Build Identity Proof (BR-5)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: nzilacanadaacr
  PROOF_REPO: nzila-build-proof
  # Expected dedicated build identity (nzila-os-build). This is the OIDC client
  # id (a non-secret public identifier), used only for an equality assertion.
  EXPECTED_BUILD_CLIENT_ID: 5c02d25b-cbdc-412f-8c2a-9ed43b73ac20

jobs:
  proof:
    runs-on: ubuntu-latest
    name: Build Identity Proof
    # BR-5: run under the dedicated build identity ONLY. This Environment holds
    # the nzila-os-build OIDC secrets (AcrPush on ACR only, no RG Contributor).
    environment: build

    steps:
      - uses: actions/checkout@v7

      - name: Assert build identity is configured (fail-closed)
        env:
          BUILD_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          BUILD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          BUILD_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CLIENT_ID}" ] || [ -z "${BUILD_TENANT_ID}" ] || [ -z "${BUILD_SUBSCRIPTION_ID}" ]; then
            echo "::error::No dedicated build identity configured on the 'build' GitHub Environment (BR-5). Expected AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID for nzila-os-build."
            exit 1
          fi

      - name: Azure Login (OIDC, build identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify authenticated identity equals nzila-os-build (fail-closed)
        run: |
          set -euo pipefail
          ACTUAL=$(az account show --query user.name -o tsv)
          if [ "$ACTUAL" != "${EXPECTED_BUILD_CLIENT_ID}" ]; then
            echo "::error::Authenticated identity ($ACTUAL) is not the expected nzila-os-build client id. Refusing to proceed (BR-5)."
            exit 1
          fi
          echo "Build identity verified: authenticated as nzila-os-build."

      - name: Assert build identity has NO resource-group Contributor (boundary)
        run: |
          set -euo pipefail
          # The build identity must be able to push images but never deploy.
          # Failing closed if it can see any deploy resource group.
          for RG in nzila-canada-prod-rg nzila-canada-staging-rg nzila-canada-demo-rg nzila-canada-pilot-rg; do
            if az group show --name "$RG" --output none 2>/dev/null; then
              echo "::error::Build identity has visibility into resource group '$RG'. Its RBAC is not registry-scoped. Failing closed (BR-5 boundary)."
              exit 1
            fi
          done
          echo "Boundary OK: build identity cannot see any deploy resource group."

      - name: ACR login
        run: az acr login --name "${ACR_NAME}"

      - name: Build & push throwaway proof image
        run: |
          set -euo pipefail
          TAG="${{ github.run_id }}-${{ github.run_attempt }}"
          IMAGE="${ACR_NAME}.azurecr.io/${PROOF_REPO}:${TAG}"
          printf 'FROM scratch\nCOPY Dockerfile.proof /proof\n' > Dockerfile.proof
          docker build -f Dockerfile.proof -t "$IMAGE" .
          docker push "$IMAGE"
          echo "PROOF_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Pushed throwaway image: ${PROOF_REPO}:${TAG}"

      - name: Resolve immutable @sha256 digest (fail-closed)
        run: |
          set -euo pipefail
          DIGEST=$(az acr repository show \
            --name "${ACR_NAME}" \
            --image "${PROOF_REPO}:${PROOF_TAG}" \
            --query digest -o tsv)
          case "$DIGEST" in
            sha256:*) echo "PROOF GREEN: ${PROOF_REPO}@${DIGEST}" ;;
            *) echo "::error::Pushed proof image did not resolve to a sha256 digest (got '${DIGEST:-}')."; exit 1 ;;
          esac
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "### Build Identity Proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- Identity: nzila-os-build (verified)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${PROOF_REPO}:${PROOF_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup throwaway proof repository
        if: always()
        run: |
          set -euo pipefail
          az acr repository delete --name "${ACR_NAME}" --repository "${PROOF_REPO}" --yes || true
          echo "Cleanup: deleted ${PROOF_REPO} repository (best-effort)."

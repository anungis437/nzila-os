name: Deploy Console (Azure Container Apps)

on:
  push:
    branches: [main]
    paths:
      - 'apps/console/**'
      - 'packages/ui/**'
      - 'packages/config/**'
      - 'content/internal/**'

permissions:
  contents: read

env:
  APP_NAME: nzila-os-console
  IMAGE: nzilastagingacr.azurecr.io/nzila-os-console

jobs:
  pre-deploy-gates:
    runs-on: ubuntu-latest
    name: Pre-Deploy Gates
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/turbo
          key: turbo-deploy-console-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-deploy-console-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-deploy-console-${{ runner.os }}-

      - name: Governance check
        run: pnpm governance:check

      - name: Change window validation
        run: node --import tsx scripts/validate-change-window.ts --env=STAGING --service=console --commit=${{ github.sha }}

      - name: Run contract tests (fail closed)
        id: contract_tests
        run: pnpm contract:test

      - name: SLO gate (fail closed)
        id: slo_gate
        run: node --import tsx scripts/slo-gate.ts --env=prod

      - name: Generate SLO summary
        if: always()
        run: node --import tsx scripts/slo-gate.ts --env=prod > slo-summary.txt 2>&1 || true

      - name: Upload SLO summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-summary-console
          path: slo-summary.txt
          retention-days: 90

      - name: Generate release attestation
        if: always()
        run: |
          CONTRACT_FLAG="--contract-pass"
          SLO_FLAG="--slo-pass"
          if [ "${{ steps.contract_tests.outcome }}" = "failure" ]; then
            CONTRACT_FLAG="--contract-fail"
          fi
          if [ "${{ steps.slo_gate.outcome }}" = "failure" ]; then
            SLO_FLAG="--slo-fail"
          fi
          node --import tsx scripts/release-attestation.ts \
            --sha ${{ github.sha }} \
            $CONTRACT_FLAG $SLO_FLAG \
            --env prod

      - name: Upload release attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation-console
          path: release-attestation.json
          retention-days: 365

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: pre-deploy-gates
    name: Build & Deploy Console
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name nzilastagingacr

      - name: Build & push image
        run: |
          docker build \
            --target console \
            --build-arg TURBO_FILTER="--filter=@nzila/console" \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}

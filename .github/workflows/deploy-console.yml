name: Deploy Console (Azure Container Apps)

on:
  workflow_dispatch:
    inputs:
      emergency_ack:
        description: Type EMERGENCY to run this fallback workflow
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  APP_NAME: nzila-os-console
  IMAGE: nzilacanadaacr.azurecr.io/nzila-os-console
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  pre-deploy-gates:
    runs-on: ubuntu-latest
    name: Pre-Deploy Gates
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Emergency acknowledgement gate
        run: |
          if [ "${{ github.event.inputs.emergency_ack }}" != "EMERGENCY" ]; then
            echo "Emergency ack missing. Use gitops-deploy.yml for canonical staging deployment."
            exit 1
          fi

      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/turbo
          key: turbo-deploy-console-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-deploy-console-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-deploy-console-${{ runner.os }}-

      - name: Governance check
        run: pnpm exec tsx scripts/governance-check.ts

      - name: Sync change records from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- ops/change-records ops/change-management

      - name: Change window validation
        run: node --import tsx scripts/validate-change-window.ts --env=STAGING --service=console --commit=${{ github.sha }}

      - name: Run contract tests (fail closed)
        id: contract_tests
        run: pnpm contract-tests

      - name: SLO gate (fail closed)
        id: slo_gate
        run: node --import tsx scripts/slo-gate.ts --env=prod

      - name: Generate SLO summary
        if: always()
        run: node --import tsx scripts/slo-gate.ts --env=prod > slo-summary.txt 2>&1 || true

      - name: Upload SLO summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-summary-console
          path: slo-summary.txt
          retention-days: 90

      - name: Generate release attestation
        if: always()
        run: |
          CONTRACT_FLAG="--contract-pass"
          SLO_FLAG="--slo-pass"
          if [ "${{ steps.contract_tests.outcome }}" = "failure" ]; then
            CONTRACT_FLAG="--contract-fail"
          fi
          if [ "${{ steps.slo_gate.outcome }}" = "failure" ]; then
            SLO_FLAG="--slo-fail"
          fi
          node --import tsx scripts/release-attestation.ts \
            --sha ${{ github.sha }} \
            $CONTRACT_FLAG $SLO_FLAG \
            --env prod

      - name: Upload release attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation-console
          path: release-attestation.json
          retention-days: 365

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: pre-deploy-gates
    name: Build & Deploy Console
    steps:
      - uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Require OIDC (fail-closed — long-lived AZURE_CREDENTIALS fallback removed, Phase 4A)
        if: env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_SUBSCRIPTION_ID == ''
        run: |
          echo "::error::OIDC federation not configured (AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID missing)."
          echo "The long-lived AZURE_CREDENTIALS credential fallback was removed for production safety (Phase 4A)."
          echo "Configure GitHub OIDC federated credentials for this deploy identity."
          exit 1

      - name: ACR login
        run: az acr login --name nzilacanadaacr

      - name: Build & push image
        run: |
          docker build \
            --target console \
            --build-arg TURBO_FILTER="--filter=@nzila/console" \
            --build-arg BUILD_AUTH_PLACEHOLDER=ci_build_placeholder_secret_32_chars_x \
            --build-arg AZURE_AD_CLIENT_ID=${{ secrets.AZURE_AD_CLIENT_ID }} \
            --build-arg AZURE_AD_TENANT_ID=${{ secrets.AZURE_AD_TENANT_ID }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}

name: Agri Core Check

on:
  push:
    branches: [main]
    paths:
      - 'apps/agrimo/**'
      - 'apps/cora/**'
      - 'apps/abr/**'
      - 'apps/trade/**'
      - 'packages/agri-*/**'
      - 'packages/cora-*/**'
      - 'fixtures/agri/**'
      - 'scripts/agri-*.ts'
      - '.github/workflows/agri-core-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/agrimo/**'
      - 'apps/cora/**'
      - 'apps/abr/**'
      - 'apps/trade/**'
      - 'packages/agri-*/**'
      - 'packages/cora-*/**'
      - 'fixtures/agri/**'
      - 'scripts/agri-*.ts'
      - '.github/workflows/agri-core-check.yml'

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agri-core-enforcement:
    runs-on: ubuntu-latest
    name: Agri Core Enforcement
    steps:
      - uses: ./.github/actions/setup-monorepo
      - name: Agri shared-core enforcement
        run: pnpm tsx scripts/agri-core-enforcement.ts

      - name: Agri duplication report
        run: pnpm tsx scripts/agri-duplication-report.ts

      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agri-duplication-report
          path: ops/outputs/agri-duplication-report.json

      - name: Agri reporting schema check
        run: pnpm tsx scripts/agri-reporting-schema-check.ts

      - name: Agri CoraGov ingestion check
        run: pnpm tsx scripts/agri-ingestion-check.ts

      - name: Agri package tests
        run: pnpm turbo test --filter='@nzila/agri-*' --filter='@nzila/agrimo-*'

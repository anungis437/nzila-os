name: Agri Core Check

on:
  push:
    branches: [main]
    paths:
      - 'apps/agrimo/**'
      - 'apps/cora/**'
      - 'apps/abr/**'
      - 'apps/trade/**'
      - 'packages/agri-*/**'
      - 'packages/cora-*/**'
      - 'fixtures/agri/**'
      - 'scripts/agri-*.ts'
      - '.github/workflows/agri-core-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/agrimo/**'
      - 'apps/cora/**'
      - 'apps/abr/**'
      - 'apps/trade/**'
      - 'packages/agri-*/**'
      - 'packages/cora-*/**'
      - 'fixtures/agri/**'
      - 'scripts/agri-*.ts'
      - '.github/workflows/agri-core-check.yml'

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  agri-core-enforcement:
    runs-on: ubuntu-latest
    name: Agri Core Enforcement
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Agri shared-core enforcement
        run: pnpm tsx scripts/agri-core-enforcement.ts

      - name: Agri duplication report
        run: pnpm tsx scripts/agri-duplication-report.ts

      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agri-duplication-report
          path: ops/outputs/agri-duplication-report.json

      - name: Agri reporting schema check
        run: pnpm tsx scripts/agri-reporting-schema-check.ts

      - name: Agri CoraGov ingestion check
        run: pnpm tsx scripts/agri-ingestion-check.ts

      - name: Agri package tests
        run: pnpm turbo test --filter='@nzila/agri-*' --filter='@nzila/agrimo-*'

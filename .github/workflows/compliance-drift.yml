##
# Compliance Drift Detection
#
# Detects governance drift across target apps.
# Runs on every push to main and weekly scheduled checks.
# Requires 'governance-approved' label on PRs that change governance paths.
##

name: Compliance Drift

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/platform-*/**'
      - 'ops/policies/**'
      - 'governance/**'
      - 'docs/GOVERNANCE_ARCHITECTURE.md'
      - 'security/**'
      - 'ops/compliance/**'
      - 'ops/slo-policy.yml'
  pull_request:
    paths:
      - 'ops/policies/**'
      - 'governance/**'
      - 'docs/GOVERNANCE_ARCHITECTURE.md'
      - 'security/**'
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-check:
    name: Governance Check
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-monorepo
      - name: Run governance check
        run: pnpm exec tsx scripts/governance-check.ts

      - name: Upload governance report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: governance-drift-report
          path: governance-report.json
          retention-days: 30

  require-governance-approval:
    name: Governance Approval Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check for governance-approved label
        uses: actions/github-script@v8
        with:
          script: |
            const pull_number = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const isSensitivePath = (path) =>
              path === 'docs/GOVERNANCE_ARCHITECTURE.md' ||
              path.startsWith('ops/policies/') ||
              path.startsWith('governance/') ||
              path.startsWith('security/');

            const isExpiryOnlyExceptionRollover = (file) => {
              if (file.status !== 'modified') return false;
              if (!/^governance\/exceptions\/.+\.json$/.test(file.filename)) return false;
              if (!file.patch) return false;

              let added = 0;
              let removed = 0;

              for (const line of file.patch.split('\n')) {
                if (
                  line.startsWith('@@') ||
                  line.startsWith('---') ||
                  line.startsWith('+++') ||
                  line.startsWith('diff ') ||
                  line.startsWith('index ')
                ) {
                  continue;
                }

                if (!line.startsWith('+') && !line.startsWith('-')) {
                  continue;
                }

                if (!/^[+-]\s*"expiresOn":\s*"[^"]+",?$/.test(line)) {
                  return false;
                }

                if (line.startsWith('+')) added += 1;
                if (line.startsWith('-')) removed += 1;
              }

              return added > 0 && added === removed;
            };

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const sensitiveFiles = files.filter((file) => isSensitivePath(file.filename));

            if (
              sensitiveFiles.length > 0 &&
              sensitiveFiles.every(isExpiryOnlyExceptionRollover)
            ) {
              core.info(
                'Only governance exception expiry rollovers detected; skipping governance-approved label requirement.'
              );
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            const labels = pr.labels.map(l => l.name);
            if (!labels.includes('governance-approved')) {
              core.setFailed(
                'PR modifies governance-sensitive paths. Add the "governance-approved" label after review.'
              );
            }

##
# Access Review Governance Gate
#
# Validates that the current quarter's privileged-access review is complete,
# approved, signed, dated, and supported by referenced evidence.
#
# Fails if:
#   - reports/compliance/access-review/<current-quarter>.json is missing
#   - review or approval fields are incomplete or pending
#   - no review evidence is referenced
#
# Related docs:
#   docs/union-eyes/dr/continuity-matrix.md
#   reports/compliance/access-review/
##

name: Access Review Governance Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  access-review-gate:
    runs-on: ubuntu-latest
    name: Access Review Attestation

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Validate access review attestation
        run: pnpm exec tsx scripts/ue/access-review-validate.ts

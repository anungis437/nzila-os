name: Deploy Union Eyes (Azure Container Apps)

on:
  push:
    branches:
      - hotfix/fr-cta-locale-redirect
  workflow_dispatch:
    inputs:
      emergency_ack:
        description: Type EMERGENCY to run this fallback workflow
        required: true
        type: string
      environment:
        description: Target environment override
        required: true
        type: choice
        options:
          - production
          - staging
          - demo
          - pilot
        default: staging
      apply_rls_foundation_migration:
        description: >-
          One-time rollout step only. Set true to apply
          db/migrations/0108_rls_tenant_isolation_foundation.sql to the
          target environment using migration/admin authority, then verify
          the union_eyes_runtime/union_eyes_system roles exist with the
          expected pre-provisioning attributes. This is the deterministic
          replacement for "a human runs psql ... < 0108.sql" (see PR
          description). Leave false for ordinary deploys — this does NOT
          run as part of the normal push/deploy path. Requires
          union-eyes-migration-admin-database-url to already exist in the
          target environment's Key Vault.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  IMAGE: nzilacanadaacr.azurecr.io/nzila-os-union-eyes
  BACKEND_IMAGE: nzilacanadaacr.azurecr.io/nzila-os-union-eyes-backend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      app_name: ${{ steps.plan.outputs.app_name }}
      resource_group: ${{ steps.plan.outputs.resource_group }}
      containerapp_environment: ${{ steps.plan.outputs.containerapp_environment }}
      acr_name: ${{ steps.plan.outputs.acr_name }}
      marketing_url: ${{ steps.plan.outputs.marketing_url }}
      app_url: ${{ steps.plan.outputs.app_url }}
      title_suffix: ${{ steps.plan.outputs.title_suffix }}
      smoke_urls: ${{ steps.plan.outputs.smoke_urls }}
      dns_zone_name: ${{ steps.plan.outputs.dns_zone_name }}
      prod_dns_target: ${{ steps.plan.outputs.prod_dns_target }}
      staging_dns_target: ${{ steps.plan.outputs.staging_dns_target }}
      nzila_mode: ${{ steps.plan.outputs.nzila_mode }}
      deployment_type: ${{ steps.plan.outputs.deployment_type }}
      feature_profile: ${{ steps.plan.outputs.feature_profile }}
      demo_profile: ${{ steps.plan.outputs.demo_profile }}
      demo_org_id: ${{ steps.plan.outputs.demo_org_id }}
      demo_org_slug: ${{ steps.plan.outputs.demo_org_slug }}
      release_id: ${{ steps.plan.outputs.release_id }}
      build_time: ${{ steps.plan.outputs.build_time }}
      key_vault_name: ${{ steps.plan.outputs.key_vault_name }}
      rls_foundation_enforced: ${{ steps.plan.outputs.rls_foundation_enforced }}
    steps:
      - name: Resolve deployment topology
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            DEPLOY_ENV="production"
          else
            DEPLOY_ENV="staging"
          fi

          DEMO_PROFILE=""
          DEMO_ORG_ID=""
          DEMO_ORG_SLUG=""

          if [ "$DEPLOY_ENV" = "production" ]; then
            APP_NAME="nzila-os-union-eyes-prod"
            MARKETING_URL="https://unioneyes.app"
            APP_URL="https://app.unioneyes.app"
            TITLE_SUFFIX=""
            SMOKE_URLS='https://unioneyes.app https://app.unioneyes.app'
            RESOURCE_GROUP="${{ vars.AZURE_RESOURCE_GROUP_PRODUCTION }}"
            CONTAINERAPP_ENVIRONMENT="${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT_PRODUCTION }}"
            NZILA_MODE_VAL="prod"
            DEPLOYMENT_TYPE="prod"
            FEATURE_PROFILE="executive"
          elif [ "$DEPLOY_ENV" = "demo" ]; then
            APP_NAME="nzila-os-union-eyes-demo"
            MARKETING_URL="https://demo.unioneyes.app"
            APP_URL="https://demo.unioneyes.app"
            TITLE_SUFFIX=" [Demo]"
            SMOKE_URLS='https://demo.unioneyes.app'
            RESOURCE_GROUP="${{ vars.AZURE_RESOURCE_GROUP_DEMO }}"
            CONTAINERAPP_ENVIRONMENT="${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT_DEMO }}"
            NZILA_MODE_VAL="demo"
            DEPLOYMENT_TYPE="cupe4373-demo"
            FEATURE_PROFILE="cupe4373"
            DEMO_PROFILE="cupe4373"
            DEMO_ORG_ID="cupe-local-4373"
            DEMO_ORG_SLUG="cupe-local-4373"
          elif [ "$DEPLOY_ENV" = "pilot" ]; then
            APP_NAME="nzila-os-union-eyes-pilot"
            MARKETING_URL="https://pilot.unioneyes.app"
            APP_URL="https://pilot.unioneyes.app"
            TITLE_SUFFIX=" [Pilot]"
            SMOKE_URLS='https://pilot.unioneyes.app'
            RESOURCE_GROUP="${{ vars.AZURE_RESOURCE_GROUP_PILOT }}"
            CONTAINERAPP_ENVIRONMENT="${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT_PILOT }}"
            NZILA_MODE_VAL="pilot"
            DEPLOYMENT_TYPE="pilot"
            FEATURE_PROFILE="executive"
          else
            APP_NAME="nzila-os-union-eyes-staging"
            MARKETING_URL="https://staging.unioneyes.app"
            APP_URL="https://staging-app.unioneyes.app"
            TITLE_SUFFIX=" [Staging]"
            SMOKE_URLS='https://staging.unioneyes.app https://staging-app.unioneyes.app'
            RESOURCE_GROUP="${{ vars.AZURE_RESOURCE_GROUP_STAGING }}"
            CONTAINERAPP_ENVIRONMENT="${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT_STAGING }}"
            NZILA_MODE_VAL="staging"
            DEPLOYMENT_TYPE="staging"
            FEATURE_PROFILE="internal"
          fi

          # Compute deterministic release id: UE-YYYY-MM-DD-shortsha
          RELEASE_ID="UE-$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Per-environment fallback: never silently route prod/demo/pilot to staging.
          if [ -z "$RESOURCE_GROUP" ] || [ -z "$CONTAINERAPP_ENVIRONMENT" ]; then
            case "$DEPLOY_ENV" in
              production)
                RESOURCE_GROUP="${RESOURCE_GROUP:-nzila-canada-prod-rg}"
                CONTAINERAPP_ENVIRONMENT="${CONTAINERAPP_ENVIRONMENT:-nzila-canada-prod-env}"
                ;;
              demo)
                RESOURCE_GROUP="${RESOURCE_GROUP:-nzila-canada-demo-rg}"
                CONTAINERAPP_ENVIRONMENT="${CONTAINERAPP_ENVIRONMENT:-nzila-canada-demo-env}"
                ;;
              pilot)
                RESOURCE_GROUP="${RESOURCE_GROUP:-nzila-canada-pilot-rg}"
                CONTAINERAPP_ENVIRONMENT="${CONTAINERAPP_ENVIRONMENT:-nzila-canada-pilot-env}"
                ;;
              *)
                RESOURCE_GROUP="${RESOURCE_GROUP:-nzila-canada-staging-rg}"
                CONTAINERAPP_ENVIRONMENT="${CONTAINERAPP_ENVIRONMENT:-nzila-canada-staging-env}"
                ;;
            esac
            echo "::warning::Deployment topology vars missing for $DEPLOY_ENV; defaulted to RG=$RESOURCE_GROUP ENV=$CONTAINERAPP_ENVIRONMENT"
          fi

          # Hard guard: never let production resolve to staging-named infra (env-scoped vars
          # have historically been misconfigured to point at staging RG/env).
          if [ "$DEPLOY_ENV" = "production" ]; then
            if echo "$RESOURCE_GROUP" | grep -qiE 'staging|demo|pilot' \
              || echo "$CONTAINERAPP_ENVIRONMENT" | grep -qiE 'staging|demo|pilot'; then
              echo "::error::Production deploy resolved to non-prod infra: RG=$RESOURCE_GROUP ENV=$CONTAINERAPP_ENVIRONMENT. Fix vars.AZURE_RESOURCE_GROUP_PRODUCTION / vars.AZURE_CONTAINERAPPS_ENVIRONMENT_PRODUCTION (repo and 'production' GH environment)."
              exit 1
            fi
          fi

          ACR_NAME="${{ vars.AZURE_ACR_NAME }}"
          if [ -z "$ACR_NAME" ]; then
            ACR_NAME="nzilacanadaacr"
          fi

          DNS_ZONE_NAME="${{ vars.DNS_ZONE_NAME }}"
          if [ -z "$DNS_ZONE_NAME" ]; then
            DNS_ZONE_NAME="unioneyes.app"
          fi

          PROD_DNS_TARGET="${{ vars.DNS_PROD_ORIGIN }}"
          if [ -z "$PROD_DNS_TARGET" ]; then
            PROD_DNS_TARGET="nzila-os-union-eyes.jollydune-88c1e97f.canadacentral.azurecontainerapps.io"
          fi

          STAGING_DNS_TARGET="${{ vars.DNS_STAGING_ORIGIN }}"
          if [ -z "$STAGING_DNS_TARGET" ]; then
            STAGING_DNS_TARGET="nzila-os-union-eyes-staging.jollydune-88c1e97f.canadacentral.azurecontainerapps.io"
          fi

          # RLS tenant-isolation foundation (docs/union-eyes/reality-remediation/26,
          # PR #751/#752): per-environment Key Vault holding the
          # union-eyes-runtime-database-url / union-eyes-system-database-url
          # secrets, and a per-environment opt-in flag. UE_RLS_FOUNDATION_ENFORCED_*
          # starts unset (transitional/compatibility mode: warn, keep deploying
          # against whatever DATABASE_URL secretref already exists) and must be
          # deliberately set to "true" as a GitHub Environment variable ONLY once
          # the manual one-time rollout (apply 0108, provision roles, create the
          # Key Vault secrets) has actually completed for that environment. Once
          # set, a missing runtime/system secret fails the deployment instead of
          # silently continuing on the admin credential.
          case "$DEPLOY_ENV" in
            production) KEY_VAULT_NAME="${{ vars.AZURE_KEY_VAULT_NAME_PRODUCTION }}"; RLS_FOUNDATION_ENFORCED="${{ vars.UE_RLS_FOUNDATION_ENFORCED_PRODUCTION }}" ;;
            demo) KEY_VAULT_NAME="${{ vars.AZURE_KEY_VAULT_NAME_DEMO }}"; RLS_FOUNDATION_ENFORCED="${{ vars.UE_RLS_FOUNDATION_ENFORCED_DEMO }}" ;;
            pilot) KEY_VAULT_NAME="${{ vars.AZURE_KEY_VAULT_NAME_PILOT }}"; RLS_FOUNDATION_ENFORCED="${{ vars.UE_RLS_FOUNDATION_ENFORCED_PILOT }}" ;;
            *) KEY_VAULT_NAME="${{ vars.AZURE_KEY_VAULT_NAME_STAGING }}"; RLS_FOUNDATION_ENFORCED="${{ vars.UE_RLS_FOUNDATION_ENFORCED_STAGING }}" ;;
          esac
          if [ -z "$KEY_VAULT_NAME" ]; then
            KEY_VAULT_NAME="nzila-staging-kv"
            if [ "$DEPLOY_ENV" != "staging" ]; then
              echo "::warning::No AZURE_KEY_VAULT_NAME_* var set for $DEPLOY_ENV; defaulting to nzila-staging-kv, which is almost certainly wrong for this environment. Set vars.AZURE_KEY_VAULT_NAME_$(echo $DEPLOY_ENV | tr '[:lower:]' '[:upper:]')."
            fi
          fi

          echo "environment=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$RESOURCE_GROUP" >> "$GITHUB_OUTPUT"
          echo "containerapp_environment=$CONTAINERAPP_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "marketing_url=$MARKETING_URL" >> "$GITHUB_OUTPUT"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "title_suffix=$TITLE_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "smoke_urls=$SMOKE_URLS" >> "$GITHUB_OUTPUT"
          echo "dns_zone_name=$DNS_ZONE_NAME" >> "$GITHUB_OUTPUT"
          echo "prod_dns_target=$PROD_DNS_TARGET" >> "$GITHUB_OUTPUT"
          echo "staging_dns_target=$STAGING_DNS_TARGET" >> "$GITHUB_OUTPUT"
          echo "nzila_mode=$NZILA_MODE_VAL" >> "$GITHUB_OUTPUT"
          echo "deployment_type=$DEPLOYMENT_TYPE" >> "$GITHUB_OUTPUT"
          echo "feature_profile=$FEATURE_PROFILE" >> "$GITHUB_OUTPUT"
          echo "demo_profile=$DEMO_PROFILE" >> "$GITHUB_OUTPUT"
          echo "demo_org_id=$DEMO_ORG_ID" >> "$GITHUB_OUTPUT"
          echo "demo_org_slug=$DEMO_ORG_SLUG" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "key_vault_name=$KEY_VAULT_NAME" >> "$GITHUB_OUTPUT"
          echo "rls_foundation_enforced=$RLS_FOUNDATION_ENFORCED" >> "$GITHUB_OUTPUT"

          echo "### Union Eyes Deployment Topology" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: $DEPLOY_ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "- Container App: $APP_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resource Group: $RESOURCE_GROUP" >> "$GITHUB_STEP_SUMMARY"
          echo "- Container Apps Environment: $CONTAINERAPP_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "- ACR: $ACR_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Marketing URL: $MARKETING_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- App URL: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEMO_PROFILE" ]; then
            echo "- Demo profile: $DEMO_PROFILE ($DEMO_ORG_SLUG)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$DEPLOY_ENV" = "production" ]; then
            echo "- Note: production runs in dedicated infrastructure (nzila-canada-prod-rg / nzila-canada-prod-env) on a dedicated production database; the hard guard above fails the deploy if prod ever resolves to staging/demo/pilot infra. (Live-verified 2026-06-28, Runtime Separation Wave Phase A.1.)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # One-time rollout step, never part of the ordinary push/deploy path (see
  # the `apply_rls_foundation_migration` input's description on the
  # workflow_dispatch trigger above). This is the deterministic,
  # version-controlled replacement for "a human runs
  # psql ... < 0108_rls_tenant_isolation_foundation.sql" that Review Item #10
  # required: the migration file is immutable/repository-governed, this job
  # applies it idempotently using migration/admin authority (never the
  # application's own runtime or system credential), and immediately
  # verifies the resulting role attributes before any provisioning happens.
  # Rollout order for a new environment: (1) this job, (2)
  # `pnpm --filter @nzila/union-eyes run rls:provision-roles` (adds LOGIN +
  # pushes secrets to Key Vault), (3) set
  # vars.UE_RLS_FOUNDATION_ENFORCED_<ENV>=true, (4) redeploy normally (the
  # existing "RLS foundation preflight (fail-closed)" step then proves the
  # provisioned credentials are live and RLS is enforced).
  apply-rls-foundation-migration:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.apply_rls_foundation_migration == 'true' }}
    runs-on: ubuntu-latest
    needs: plan
    name: Apply RLS Foundation Migration (0108, one-time rollout)
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Assert environment deployment identity is configured (fail-closed)
        env:
          ENV_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENV_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENV_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_CLIENT_ID}" ] || [ -z "${ENV_TENANT_ID}" ] || [ -z "${ENV_SUBSCRIPTION_ID}" ]; then
            echo "::error::No environment-scoped deployment identity for '${{ needs.plan.outputs.environment }}' (BR-4). Refusing to fall back to a shared credential."
            exit 1
          fi

      - name: Azure Login (OIDC, environment-scoped)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply migration 0108 + verify role attributes (fail-closed)
        shell: bash
        run: |
          set -euo pipefail

          KEY_VAULT_NAME="${{ needs.plan.outputs.key_vault_name }}"
          SECRET_NAME="union-eyes-migration-admin-database-url"

          if ! az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$SECRET_NAME" --query id -o tsv >/dev/null 2>&1; then
            echo "::error::Key Vault secret '$SECRET_NAME' not found in '$KEY_VAULT_NAME'. This job requires a dedicated migration/admin connection string to be provisioned in Key Vault before it can run — it deliberately does not fall back to any application runtime credential. Create the secret (scoped to a role that can CREATE ROLE / ALTER TABLE / CREATE POLICY on this database) and re-run."
            exit 1
          fi

          ADMIN_URL=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$SECRET_NAME" --query value -o tsv)

          set +x  # never trace this — the export line contains a secret
          export RLS_MIGRATION_ADMIN_DATABASE_URL="$ADMIN_URL"

          pnpm --filter @nzila/union-eyes run rls:apply-foundation-migration -- --expect-pre-provisioning
          MIGRATION_STATUS=$?

          unset RLS_MIGRATION_ADMIN_DATABASE_URL ADMIN_URL

          if [ "$MIGRATION_STATUS" -ne 0 ]; then
            echo "::error::Migration 0108 apply/verify failed for ${{ needs.plan.outputs.environment }}. Do not proceed to rls:provision-roles until this is resolved."
            exit 1
          fi
          echo "::notice::Migration 0108 applied and role attributes verified for ${{ needs.plan.outputs.environment }}. Next: pnpm --filter @nzila/union-eyes run rls:provision-roles for this environment."

  # Mandatory, always-on pre-deploy gate — NOT an optional operator command
  # like apply-rls-foundation-migration above. Application code on this
  # branch reads/writes icra_assessments.capability_token_hash /
  # capability_token_expires_at (PR #752, ICRA capability architecture), so
  # every deploy — not just a one-time rollout — must confirm those columns
  # exist before the new revision goes live. Uses the canonical shared
  # scoped-migration executor (tooling/scripts/lib/union-eyes-scoped-
  # migrations.mjs) via icra:capability-rollout:check/:apply — never a
  # hand-written copy of the 0005 DDL. Fails closed (before build-push/
  # deploy) if the migration-admin Key Vault secret is unavailable or the
  # post-apply verification does not reach GO.
  apply-icra-capability-migration:
    runs-on: ubuntu-latest
    needs: plan
    name: Apply ICRA Capability Migration (0005, mandatory pre-deploy gate)
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      - name: Assert environment deployment identity is configured (fail-closed)
        env:
          ENV_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENV_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENV_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_CLIENT_ID}" ] || [ -z "${ENV_TENANT_ID}" ] || [ -z "${ENV_SUBSCRIPTION_ID}" ]; then
            echo "::error::No environment-scoped deployment identity for '${{ needs.plan.outputs.environment }}' (BR-4). Refusing to fall back to a shared credential."
            exit 1
          fi

      - name: Azure Login (OIDC, environment-scoped)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check + apply the ICRA capability scoped migration (fail-closed)
        shell: bash
        run: |
          set -euo pipefail

          KEY_VAULT_NAME="${{ needs.plan.outputs.key_vault_name }}"
          SECRET_NAME="union-eyes-migration-admin-database-url"

          if ! az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$SECRET_NAME" --query id -o tsv >/dev/null 2>&1; then
            echo "::error::Key Vault secret '$SECRET_NAME' not found in '$KEY_VAULT_NAME'. Capability-dependent application code cannot deploy without the migration-admin credential to confirm/apply the 0005 scoped migration. Refusing to proceed to build/deploy — this must never be left as an optional operator step."
            exit 1
          fi

          ADMIN_URL=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$SECRET_NAME" --query value -o tsv)

          set +x  # never trace this — the export line contains a secret
          export RLS_MIGRATION_ADMIN_DATABASE_URL="$ADMIN_URL"

          set +e
          pnpm --filter @nzila/union-eyes run icra:capability-rollout:check
          CHECK_STATUS=$?
          set -e

          if [ "$CHECK_STATUS" -ne 0 ]; then
            echo "::notice::ICRA capability migration not yet GO for ${{ needs.plan.outputs.environment }} — applying tag 0005 now."
            set +e
            pnpm --filter @nzila/union-eyes run icra:capability-rollout:apply
            APPLY_STATUS=$?
            set -e
            if [ "$APPLY_STATUS" -ne 0 ]; then
              unset RLS_MIGRATION_ADMIN_DATABASE_URL ADMIN_URL
              echo "::error::ICRA capability migration apply failed for ${{ needs.plan.outputs.environment }}. Refusing to build/deploy capability-dependent application code."
              exit 1
            fi
          fi

          set +e
          pnpm --filter @nzila/union-eyes run icra:capability-rollout:check
          FINAL_STATUS=$?
          set -e
          unset RLS_MIGRATION_ADMIN_DATABASE_URL ADMIN_URL

          if [ "$FINAL_STATUS" -ne 0 ]; then
            echo "::error::Post-apply verification did not reach GO for ${{ needs.plan.outputs.environment }}. Refusing to build/deploy."
            exit 1
          fi
          echo "::notice::ICRA capability migration (0005) confirmed GO for ${{ needs.plan.outputs.environment }}."

  pre-deploy-gates:
    runs-on: ubuntu-latest
    needs: plan
    name: Pre-Deploy Gates
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo
      - name: Emergency acknowledgement gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Push-triggered deploy; skipping emergency acknowledgement gate."
            exit 0
          fi

          if [ "${{ github.event.inputs.emergency_ack }}" != "EMERGENCY" ]; then
            echo "Emergency ack missing. Use gitops-deploy.yml or deploy-production.yml for canonical release paths."
            exit 1
          fi

      - name: DNS provider preflight (fail fast)
        if: ${{ vars.DNS_AUTOMATION_ENABLED == 'true' }}
        shell: bash
        env:
          DNS_PROVIDER: ${{ vars.DNS_PROVIDER }}
          DNS_ZONE_ID: ${{ vars.DNS_ZONE_ID }}
          DNS_ZONE_NAME: ${{ vars.DNS_ZONE_NAME }}
          DNS_API_TOKEN: ${{ secrets.DNS_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DNS_PROVIDER:-}" ]; then
            echo "DNS_PROVIDER is required when DNS_AUTOMATION_ENABLED=true"
            exit 1
          fi
          if [ -z "${DNS_ZONE_ID:-}" ]; then
            echo "DNS_ZONE_ID is required when DNS_AUTOMATION_ENABLED=true"
            exit 1
          fi
          if [ -z "${DNS_ZONE_NAME:-}" ]; then
            echo "DNS_ZONE_NAME is required when DNS_AUTOMATION_ENABLED=true"
            exit 1
          fi
          if [ -z "${DNS_API_TOKEN:-}" ]; then
            echo "DNS_API_TOKEN secret is required when DNS_AUTOMATION_ENABLED=true"
            exit 1
          fi

          if [ "$DNS_PROVIDER" != "cloudflare" ]; then
            echo "DNS preflight not implemented for provider: $DNS_PROVIDER"
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -H "Authorization: Bearer $DNS_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$DNS_ZONE_ID" || true)

          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "403" ]; then
            echo "::notice::Cloudflare preflight returned HTTP $HTTP_STATUS. Continuing deploy; DNS post-deploy checks remain enforced."
            exit 0
          fi

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Cloudflare zone preflight request failed with HTTP $HTTP_STATUS"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          RESPONSE=$(cat "$RESPONSE_FILE")

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          ACTUAL_ZONE=$(echo "$RESPONSE" | jq -r '.result.name')

          if [ "$SUCCESS" != "true" ]; then
            echo "Cloudflare zone preflight failed"
            echo "$RESPONSE"
            exit 1
          fi

          if [ "${ACTUAL_ZONE,,}" != "${DNS_ZONE_NAME,,}" ]; then
            echo "Cloudflare zone mismatch: expected $DNS_ZONE_NAME got $ACTUAL_ZONE"
            exit 1
          fi

          echo "DNS provider preflight passed for $DNS_ZONE_NAME"

      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/turbo
          key: turbo-deploy-ue-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-deploy-ue-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-deploy-ue-${{ runner.os }}-

      - name: Governance check
        run: pnpm exec tsx scripts/governance-check.ts

      - name: Sync change records from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- ops/change-records ops/change-management

      - name: Change window validation
        run: node --import tsx scripts/validate-change-window.ts --env=${{ needs.plan.outputs.environment == 'production' && 'PROD' || 'STAGING' }} --service=union-eyes --commit=${{ github.sha }}

      - name: Run contract tests (fail closed)
        id: contract_tests
        run: pnpm contract-tests

      - name: SLO gate (fail closed)
        id: slo_gate
        run: node --import tsx scripts/slo-gate.ts --env=${{ needs.plan.outputs.environment }}

      - name: Generate SLO summary
        if: always()
        run: node --import tsx scripts/slo-gate.ts --env=${{ needs.plan.outputs.environment }} > slo-summary.txt 2>&1 || true

      - name: Upload SLO summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-summary-union-eyes
          path: slo-summary.txt
          retention-days: 90

      - name: Generate release attestation
        if: always()
        run: |
          CONTRACT_FLAG="--contract-pass"
          SLO_FLAG="--slo-pass"
          if [ "${{ steps.contract_tests.outcome }}" = "failure" ]; then
            CONTRACT_FLAG="--contract-fail"
          fi
          if [ "${{ steps.slo_gate.outcome }}" = "failure" ]; then
            SLO_FLAG="--slo-fail"
          fi
          node --import tsx scripts/release-attestation.ts \
            --sha ${{ github.sha }} \
            $CONTRACT_FLAG $SLO_FLAG \
            --env ${{ needs.plan.outputs.environment }}

      - name: Upload release attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation-union-eyes
          path: release-attestation.json
          retention-days: 90

  # BR-5: image BUILD/PUSH authority, separated from environment DEPLOY
  # authority. This job runs under the dedicated `build` GitHub Environment so
  # `azure/login` resolves the `nzila-os-build` OIDC identity, which holds
  # AcrPush on nzilacanadaacr ONLY and has NO Contributor on any deploy RG. It
  # builds and pushes the frontend + backend images to the shared registry,
  # then resolves and emits the immutable @sha256 digests consumed by the
  # env-scoped `deploy` job. The per-environment deploy identities remain
  # AcrPull-only and never push.
  build-push:
    runs-on: ubuntu-latest
    needs: [plan, pre-deploy-gates]
    name: Build & Push UnionEyes images (build authority)
    environment: build
    outputs:
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
      backend_digest: ${{ steps.digests.outputs.backend_digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Assert build identity is configured (fail-closed)
        env:
          BUILD_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          BUILD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          BUILD_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CLIENT_ID}" ] || [ -z "${BUILD_TENANT_ID}" ] || [ -z "${BUILD_SUBSCRIPTION_ID}" ]; then
            echo "::error::No dedicated build identity configured on the 'build' GitHub Environment (BR-5). Expected AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID for nzila-os-build. Environment deploy identities are AcrPull-only and MUST NOT be used to push. Refusing to fall back to a shared credential."
            exit 1
          fi

      - name: Azure Login (OIDC, build identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify authenticated identity is the build identity (fail-closed)
        env:
          EXPECTED_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          ACTUAL=$(az account show --query user.name -o tsv)
          if [ "$ACTUAL" != "$EXPECTED_CLIENT_ID" ]; then
            echo "::error::Authenticated identity ($ACTUAL) is not the expected build identity. Refusing to push (BR-5)."
            exit 1
          fi
          echo "Build identity verified."

      - name: ACR login
        run: az acr login --name ${{ needs.plan.outputs.acr_name }}

      - name: Build & push frontend image
        run: |
          docker build \
            --target union-eyes \
            --build-arg TURBO_FILTER="--filter=@nzila/union-eyes" \
            --build-arg BUILD_AUTH_PLACEHOLDER=ci_build_placeholder_secret_32_chars_x \
            --build-arg AZURE_AD_CLIENT_ID=${{ secrets.AZURE_AD_CLIENT_ID }} \
            --build-arg AZURE_AD_TENANT_ID=${{ secrets.AZURE_AD_TENANT_ID }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ needs.plan.outputs.marketing_url }} \
            --build-arg NEXT_PUBLIC_APP_URL=${{ needs.plan.outputs.app_url }} \
            --build-arg NEXT_PUBLIC_SITE_URL_STAGING=https://staging.unioneyes.app \
            --build-arg NEXT_PUBLIC_APP_URL_STAGING=https://staging-app.unioneyes.app \
            --build-arg UE_ENVIRONMENT=${{ needs.plan.outputs.environment }} \
            --build-arg NEXT_PUBLIC_APP_ENV=${{ needs.plan.outputs.environment }} \
            --build-arg UE_DEPLOYMENT_TYPE=${{ needs.plan.outputs.deployment_type }} \
            --build-arg UE_FEATURE_PROFILE=${{ needs.plan.outputs.feature_profile }} \
            --build-arg NEXT_PUBLIC_UE_FEATURE_PROFILE=${{ needs.plan.outputs.feature_profile }} \
            --build-arg UE_DEMO_PROFILE=${{ needs.plan.outputs.demo_profile }} \
            --build-arg NEXT_PUBLIC_UE_DEMO_PROFILE=${{ needs.plan.outputs.demo_profile }} \
            --build-arg UE_DEMO_ORG_ID=${{ needs.plan.outputs.demo_org_id }} \
            --build-arg NEXT_PUBLIC_UE_DEMO_ORG_SLUG=${{ needs.plan.outputs.demo_org_slug }} \
            --build-arg UE_MARKETING_URL=${{ needs.plan.outputs.marketing_url }} \
            --build-arg UE_APP_URL=${{ needs.plan.outputs.app_url }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:${{ needs.plan.outputs.environment }} \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:${{ needs.plan.outputs.environment }}

      - name: Build & push backend image
        run: |
          # BR-5: backend uses runner-side docker build + push (NOT `az acr
          # build`). The AcrPush role lacks Microsoft.ContainerRegistry/
          # registries/scheduleRun/action, so the build identity cannot run a
          # server-side ACR build; runner-side push needs only AcrPush.
          docker build \
            --file apps/union-eyes/backend/Dockerfile \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            apps/union-eyes/backend
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Resolve immutable image digests (BR-5 promotion evidence)
        id: digests
        run: |
          set -euo pipefail
          ACR='${{ needs.plan.outputs.acr_name }}'
          FRONTEND_DIGEST=$(az acr repository show \
            --name "$ACR" \
            --image "nzila-os-union-eyes:${{ github.sha }}" \
            --query digest -o tsv)
          BACKEND_DIGEST=$(az acr repository show \
            --name "$ACR" \
            --image "nzila-os-union-eyes-backend:${{ github.sha }}" \
            --query digest -o tsv)
          if [ -z "${FRONTEND_DIGEST:-}" ] || [ -z "${BACKEND_DIGEST:-}" ]; then
            echo "::error::Failed to resolve immutable @sha256 digest for pushed images (frontend='${FRONTEND_DIGEST:-}' backend='${BACKEND_DIGEST:-}'). Refusing to promote a mutable-only tag (BR-5)."
            exit 1
          fi
          case "$FRONTEND_DIGEST" in sha256:*) : ;; *) echo "::error::frontend digest is not a sha256 reference: $FRONTEND_DIGEST"; exit 1 ;; esac
          case "$BACKEND_DIGEST" in sha256:*) : ;; *) echo "::error::backend digest is not a sha256 reference: $BACKEND_DIGEST"; exit 1 ;; esac
          echo "frontend_digest=$FRONTEND_DIGEST" >> "$GITHUB_OUTPUT"
          echo "backend_digest=$BACKEND_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved frontend digest: $FRONTEND_DIGEST"
          echo "Resolved backend digest: $BACKEND_DIGEST"

  deploy:
    runs-on: ubuntu-latest
    needs: [plan, pre-deploy-gates, build-push, apply-icra-capability-migration]
    name: Deploy UnionEyes (env-scoped, digest-pinned)
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-monorepo

      # BR-4: environment-scoped deployment identity. This job sets
      # `environment: ${{ needs.plan.outputs.environment }}`, so the
      # GitHub Environment-scoped secrets below resolve to a DISTINCT
      # federated identity per environment (production/staging/demo/pilot).
      # No shared AZURE_CREDENTIALS password is used; we fail closed if the
      # per-environment identity is not configured.
      - name: Assert environment deployment identity is configured (fail-closed)
        env:
          ENV_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENV_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENV_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_CLIENT_ID}" ] || [ -z "${ENV_TENANT_ID}" ] || [ -z "${ENV_SUBSCRIPTION_ID}" ]; then
            echo "::error::No environment-scoped deployment identity for '${{ needs.plan.outputs.environment }}'. Configure AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID on the '${{ needs.plan.outputs.environment }}' GitHub Environment (BR-4). Refusing to fall back to a shared credential."
            exit 1
          fi

      - name: Azure Login (OIDC, environment-scoped)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # BR-4 fail-closed boundary gate: each environment may target ONLY its own
      # resource group. A staging/demo/pilot run that somehow resolves a prod RG
      # (or vice versa) is refused before any image push or container update.
      - name: Deployment identity boundary gate (fail-closed)
        run: |
          set -euo pipefail
          DEPLOY_ENV="${{ needs.plan.outputs.environment }}"
          TARGET_RG="${{ needs.plan.outputs.resource_group }}"
          case "$DEPLOY_ENV" in
            production) EXPECT='nzila-canada-prod-rg' ;;
            staging)    EXPECT='nzila-canada-staging-rg' ;;
            demo)       EXPECT='nzila-canada-demo-rg' ;;
            pilot)      EXPECT='nzila-canada-pilot-rg' ;;
            *) echo "::error::Unknown deploy environment '$DEPLOY_ENV'."; exit 1 ;;
          esac
          if [ "$TARGET_RG" != "$EXPECT" ]; then
            echo "::error::Environment '$DEPLOY_ENV' resolved to resource group '$TARGET_RG' but may only deploy to '$EXPECT'. Failing closed (BR-4 boundary)."
            exit 1
          fi
          if ! az account show --output none 2>/dev/null; then
            echo "::error::Azure CLI is not authenticated via the environment-scoped OIDC identity."
            exit 1
          fi
          echo "Boundary OK: env=$DEPLOY_ENV rg=$TARGET_RG"

      # BR-5 fail-closed image-immutability gate: this env-scoped deploy
      # identity is AcrPull-only and must consume an immutable, pre-approved
      # image produced by the separate `build-push` (build authority) job.
      # Production refuses to proceed without a resolved @sha256 digest; a
      # mutable tag (:sha / :environment / :latest) is NOT accepted as
      # production promotion evidence.
      - name: Image immutability gate (fail-closed, BR-5)
        env:
          FRONTEND_DIGEST: ${{ needs.build-push.outputs.frontend_digest }}
          BACKEND_DIGEST: ${{ needs.build-push.outputs.backend_digest }}
          DEPLOY_ENV: ${{ needs.plan.outputs.environment }}
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_DIGEST:-}" ] || [ -z "${BACKEND_DIGEST:-}" ]; then
            echo "::error::Missing immutable image digest from build-push job (frontend='${FRONTEND_DIGEST:-}' backend='${BACKEND_DIGEST:-}'). Refusing to deploy a mutable-only image (BR-5)."
            exit 1
          fi
          case "$FRONTEND_DIGEST" in sha256:*) : ;; *) echo "::error::frontend image source is not an immutable @sha256 digest: $FRONTEND_DIGEST"; exit 1 ;; esac
          case "$BACKEND_DIGEST" in sha256:*) : ;; *) echo "::error::backend image source is not an immutable @sha256 digest: $BACKEND_DIGEST"; exit 1 ;; esac
          echo "Image immutability OK (env=$DEPLOY_ENV): frontend=$FRONTEND_DIGEST backend=$BACKEND_DIGEST"

      - name: Ensure target Container App exists
        run: |
          set -euo pipefail

          TARGET_APP="${{ needs.plan.outputs.app_name }}"
          TARGET_RG="${{ needs.plan.outputs.resource_group }}"
          TARGET_ENV="${{ needs.plan.outputs.containerapp_environment }}"
          DEPLOY_ENV="${{ needs.plan.outputs.environment }}"

          echo "Checking Container App existence: app=$TARGET_APP rg=$TARGET_RG env=$TARGET_ENV deploy_env=$DEPLOY_ENV"

          # Pre-flight: confirm we have an authenticated Azure context.
          if ! az account show --output none 2>/dev/null; then
            echo "::error::Azure CLI is not authenticated. Check the environment-scoped OIDC login (BR-4) and the per-environment AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID GitHub Environment secrets."
            exit 1
          fi

          # Probe existence without swallowing the real error (RBAC vs NotFound vs other).
          SHOW_ERR=$(az containerapp show --name "$TARGET_APP" --resource-group "$TARGET_RG" --output none 2>&1) && SHOW_RC=0 || SHOW_RC=$?

          if [ "$SHOW_RC" = "0" ]; then
            echo "Container App $TARGET_APP already exists in $TARGET_RG."
            exit 0
          fi

          # Distinguish the failure modes so we never misdiagnose RBAC as missing.
          if echo "$SHOW_ERR" | grep -qiE 'AuthorizationFailed|does not have authorization|Forbidden|insufficient privileges'; then
            echo "::error::Service principal lacks RBAC to read Container App '$TARGET_APP' in resource group '$TARGET_RG'."
            echo "::error::Grant Contributor (or at least Reader + Container Apps Contributor) on the RG, then retry."
            echo "--- raw az error ---"
            echo "$SHOW_ERR"
            exit 1
          fi

          if ! echo "$SHOW_ERR" | grep -qiE 'ResourceNotFound|was not found|could not be found|NotFound'; then
            echo "::error::Unexpected error probing Container App '$TARGET_APP' in '$TARGET_RG':"
            echo "$SHOW_ERR"
            exit 1
          fi

          # Confirmed NotFound from this point on.
          if [ "$DEPLOY_ENV" = "production" ]; then
            echo "::error::Container App $TARGET_APP confirmed missing in PRODUCTION (resource group $TARGET_RG). Refusing to auto-create."
            echo "::error::Production Container Apps must be provisioned via apps/union-eyes/infra Bicep + manual approval."
            echo "::error::If the app already exists in a different RG, fix vars.AZURE_RESOURCE_GROUP_PRODUCTION (currently='$TARGET_RG')."
            exit 1
          fi

          echo "Creating missing $DEPLOY_ENV Container App $TARGET_APP..."
          az containerapp create \
            --name "$TARGET_APP" \
            --resource-group "$TARGET_RG" \
            --environment "$TARGET_ENV" \
            --image ${{ env.IMAGE }}@${{ needs.build-push.outputs.frontend_digest }} \
            --ingress external \
            --target-port 3000 \
            --cpu 1.0 \
            --memory 2Gi \
            --min-replicas 1 \
            --max-replicas 3 \
            --registry-server ${{ needs.plan.outputs.acr_name }}.azurecr.io

      - name: Update Container App (frontend + backend sidecar)
        run: |
          TARGET_APP="${{ needs.plan.outputs.app_name }}"
          TARGET_RG="${{ needs.plan.outputs.resource_group }}"

          SHOW_ERR=$(az containerapp show --name "$TARGET_APP" --resource-group "$TARGET_RG" --output none 2>&1) || {
            echo "::error::Container App $TARGET_APP cannot be updated in $TARGET_RG."
            echo "--- raw az error ---"
            echo "$SHOW_ERR"
            exit 1
          }

          FRONTEND_ENV_VARS=(
            "NODE_ENV=production"
            "PORT=3000"
            "NEXT_PUBLIC_APP_ENV=${{ needs.plan.outputs.environment }}"
            "UE_ENVIRONMENT=${{ needs.plan.outputs.environment }}"
            "UE_DEPLOYMENT_TYPE=${{ needs.plan.outputs.deployment_type }}"
            "UE_FEATURE_PROFILE=${{ needs.plan.outputs.feature_profile }}"
            "NEXT_PUBLIC_UE_FEATURE_PROFILE=${{ needs.plan.outputs.feature_profile }}"
            "NZILA_MODE=${{ needs.plan.outputs.nzila_mode }}"
            "GITHUB_SHA=${{ github.sha }}"
            "RELEASE_ID=${{ needs.plan.outputs.release_id }}"
            "BUILD_TIME=${{ needs.plan.outputs.build_time }}"
            "BUILD_TIMESTAMP=${{ needs.plan.outputs.build_time }}"
            "ARTIFACT_ID=${{ github.sha }}"
            "UE_MARKETING_URL=${{ needs.plan.outputs.marketing_url }}"
            "UE_APP_URL=${{ needs.plan.outputs.app_url }}"
            "NEXT_PUBLIC_SITE_URL=${{ needs.plan.outputs.marketing_url }}"
            "NEXT_PUBLIC_APP_URL=${{ needs.plan.outputs.app_url }}"
            "NEXT_PUBLIC_SITE_URL_STAGING=https://staging.unioneyes.app"
            "NEXT_PUBLIC_APP_URL_STAGING=https://staging-app.unioneyes.app"
            "AUTH_URL=${{ needs.plan.outputs.app_url }}"
            "AUTH_TRUST_HOST=true"
            "PLATFORM_ADMIN_USER_IDS=${{ secrets.PLATFORM_ADMIN_USER_IDS }}"
            "SUPER_ADMIN_ORG_ID=${{ secrets.SUPER_ADMIN_ORG_ID }}"
          )

          # RLS foundation remediation (docs/union-eyes/reality-remediation/26,
          # PR #751/#752): the tenant-scoped DATABASE_URL must point at the
          # dedicated non-bypass `union_eyes_runtime` role, and system/admin
          # paths get a SEPARATE SYSTEM_DATABASE_URL for `union_eyes_system`.
          #
          # This creates/updates the Container App secrets as native Key Vault
          # references (same pattern already used for resend-api-key /
          # cron-secret) whenever the underlying Key Vault secret exists —
          # writing a Key Vault secret does NOT automatically create a
          # Container App secret; those are two different stores, and this
          # step is the explicit handoff between them.
          #
          # rls_foundation_enforced is a deliberate per-environment opt-in
          # (see the plan job). Until an operator sets it to "true" for this
          # environment — only after actually running the one-time rollout
          # (apply 0108, provision roles, populate the Key Vault secrets) —
          # a missing secret only warns and this deploy keeps shipping
          # against whatever DATABASE_URL secretref already exists. Once set,
          # a missing secret FAILS the deployment; it must never silently
          # keep shipping against the admin credential once the dedicated
          # secret is expected to exist.
          KEY_VAULT_NAME="${{ needs.plan.outputs.key_vault_name }}"
          RLS_FOUNDATION_ENFORCED="${{ needs.plan.outputs.rls_foundation_enforced }}"

          ensure_kv_backed_secret() {
            local SECRET_NAME="$1"
            local ENV_VAR_NAME="$2"

            if az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$SECRET_NAME" --query id -o tsv >/dev/null 2>&1; then
              az containerapp secret set \
                --name "$TARGET_APP" \
                --resource-group "$TARGET_RG" \
                --secrets "${SECRET_NAME}=keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/${SECRET_NAME},identityref:system" \
                >/dev/null
              FRONTEND_ENV_VARS+=("${ENV_VAR_NAME}=secretref:${SECRET_NAME}")
              echo "::notice::${ENV_VAR_NAME} wired to Key Vault-backed secret ${SECRET_NAME} in ${KEY_VAULT_NAME}."
            elif [ "$RLS_FOUNDATION_ENFORCED" = "true" ]; then
              echo "::error::${SECRET_NAME} not found in Key Vault ${KEY_VAULT_NAME}, and rls_foundation_enforced=true for this environment. Refusing to deploy against the admin credential. Run scripts/provision-runtime-db-roles.ts for this environment before retrying."
              exit 1
            else
              echo "::warning::${SECRET_NAME} not found in Key Vault ${KEY_VAULT_NAME} — ${ENV_VAR_NAME} still points at whatever secretref was set previously (transitional mode; rls_foundation_enforced is not yet \"true\" for this environment). Run scripts/provision-runtime-db-roles.ts, then set vars.UE_RLS_FOUNDATION_ENFORCED_* for this environment to make this fail closed."
            fi
          }

          ensure_kv_backed_secret "union-eyes-runtime-database-url" "DATABASE_URL"
          ensure_kv_backed_secret "union-eyes-system-database-url" "SYSTEM_DATABASE_URL"

          if [ "${{ needs.plan.outputs.environment }}" = "pilot" ]; then
            FRONTEND_ENV_VARS+=(
              "DJANGO_API_URL=http://nzila-os-union-eyes-django-pilot"
              "NEXT_PUBLIC_DJANGO_API_URL=http://nzila-os-union-eyes-django-pilot"
              "READY_REQUIRE_QUEUE=true"
            )
          else
            FRONTEND_ENV_VARS+=(
              "DJANGO_API_URL=http://127.0.0.1:8000"
              "NEXT_PUBLIC_DJANGO_API_URL=http://127.0.0.1:8000"
              "READY_REQUIRE_QUEUE=false"
            )
          fi

          if [ -n "${{ needs.plan.outputs.demo_profile }}" ]; then
            FRONTEND_ENV_VARS+=(
              "UE_DEMO_PROFILE=${{ needs.plan.outputs.demo_profile }}"
              "NEXT_PUBLIC_UE_DEMO_PROFILE=${{ needs.plan.outputs.demo_profile }}"
              "UE_DEMO_ORG_ID=${{ needs.plan.outputs.demo_org_id }}"
              "NEXT_PUBLIC_UE_DEMO_ORG_SLUG=${{ needs.plan.outputs.demo_org_slug }}"
              # Demo personas log in from CI/manual probes with no prior
              # session history; the risk scorer would otherwise classify
              # first-seen IP + short UA as "medium" and force MFA enrollment
              # that demo accounts cannot complete. Bypassing risk here keeps
              # the demo personas reachable without weakening real auth.
              "UE_E2E_RISK_BYPASS=true"
            )
          fi

          az containerapp update \
            --name "$TARGET_APP" \
            --resource-group "$TARGET_RG" \
            --set-env-vars "${FRONTEND_ENV_VARS[@]}" \
            --container-name "$TARGET_APP" \
            --image ${{ env.IMAGE }}@${{ needs.build-push.outputs.frontend_digest }}

          # Ensure backend secretref aliases exist: some environments seed
          # secrets with an environment suffix (e.g. auth-webhook-secret-demo)
          # while the backend container references bare names. Mirror the
          # suffixed value into the bare name so secretref lookup succeeds.
          # Idempotent: if bare alias already exists this is a no-op overwrite.
          ENV_SUFFIX="${{ needs.plan.outputs.environment }}"
          EXISTING_SECRETS=$(az containerapp secret list \
            --name "$TARGET_APP" \
            --resource-group "$TARGET_RG" \
            --query "[].name" -o tsv)
          for BARE in auth-webhook-secret; do
            SUFFIXED="${BARE}-${ENV_SUFFIX}"
            if echo "$EXISTING_SECRETS" | grep -qx "$SUFFIXED" \
               && ! echo "$EXISTING_SECRETS" | grep -qx "$BARE"; then
              echo "::notice::Mirroring secret $SUFFIXED -> $BARE for backend secretref compatibility"
              VAL=$(az containerapp secret show \
                --name "$TARGET_APP" \
                --resource-group "$TARGET_RG" \
                --secret-name "$SUFFIXED" \
                --query value -o tsv)
              az containerapp secret set \
                --name "$TARGET_APP" \
                --resource-group "$TARGET_RG" \
                --secrets "${BARE}=${VAL}" >/dev/null
            fi
          done

          # Keep backend DB wiring aligned with the frontend container.
          # Django backend reads PG* vars and defaults to localhost if missing,
          # which makes revisions fail even when frontend is healthy.
          FRONTEND_ENV_JSON=$(az containerapp show \
            --name "$TARGET_APP" \
            --resource-group "$TARGET_RG" \
            --query "properties.template.containers[?name=='$TARGET_APP'].env | [0]" \
            -o json)

          PGHOST_VAL=$(echo "$FRONTEND_ENV_JSON" | jq -r '.[] | select(.name=="PGHOST") | .value // empty' | head -n1)
          PGUSER_VAL=$(echo "$FRONTEND_ENV_JSON" | jq -r '.[] | select(.name=="PGUSER") | .value // empty' | head -n1)
          PGDATABASE_VAL=$(echo "$FRONTEND_ENV_JSON" | jq -r '.[] | select(.name=="PGDATABASE") | .value // empty' | head -n1)
          PGPORT_VAL=$(echo "$FRONTEND_ENV_JSON" | jq -r '.[] | select(.name=="PGPORT") | .value // empty' | head -n1)
          PGSSLMODE_VAL=$(echo "$FRONTEND_ENV_JSON" | jq -r '.[] | select(.name=="PGSSLMODE") | .value // empty' | head -n1)
          PGPASSWORD_SECRET=$(echo "$FRONTEND_ENV_JSON" | jq -r '.[] | select(.name=="PGPASSWORD") | .secretRef // empty' | head -n1)

          # Frontends commonly carry a single DATABASE_URL connection string
          # (secretref) instead of discrete PG* vars. Derive the backend's PG*
          # from that secret so Django doesn't fall back to localhost — and so
          # this deploy doesn't hard-fail on environments that only set DATABASE_URL.
          if [ -z "$PGHOST_VAL" ] || [ -z "$PGUSER_VAL" ] || [ -z "$PGDATABASE_VAL" ]; then
            DB_URL_SECRET=$(echo "$FRONTEND_ENV_JSON" | jq -r '.[] | select(.name=="DATABASE_URL") | .secretRef // empty' | head -n1)
            if [ -n "$DB_URL_SECRET" ]; then
              DB_URL=$(az containerapp secret show \
                --name "$TARGET_APP" \
                --resource-group "$TARGET_RG" \
                --secret-name "$DB_URL_SECRET" \
                --query value -o tsv)
              # Parse postgres://user:pass@host:port/db?params with pure bash.
              # Credentials are percent-encoded in the URL, so splitting on ':'
              # and '@' is safe; decode after splitting.
              urldecode() { local d="${1//+/ }"; printf '%b' "${d//%/\\x}"; }
              UE_REST="${DB_URL#*://}"
              UE_CREDS="${UE_REST%%@*}"
              UE_HOSTPART="${UE_REST#*@}"
              UE_HOSTPORTDB="${UE_HOSTPART%%\?*}"
              UE_HOSTPORT="${UE_HOSTPORTDB%%/*}"
              URL_PGHOST="${UE_HOSTPORT%%:*}"
              URL_PGPORT="${UE_HOSTPORT##*:}"
              [ "$URL_PGPORT" = "$UE_HOSTPORT" ] && URL_PGPORT="5432"
              URL_PGDATABASE="${UE_HOSTPORTDB#*/}"
              URL_PGUSER=$(urldecode "${UE_CREDS%%:*}")
              URL_PGPASSWORD=$(urldecode "${UE_CREDS#*:}")
              URL_PGSSLMODE=$(printf '%s' "$DB_URL" | grep -oE 'sslmode=[A-Za-z-]+' | head -n1 | cut -d= -f2)
              [ -z "$URL_PGSSLMODE" ] && URL_PGSSLMODE="require"

              [ -z "$PGHOST_VAL" ] && PGHOST_VAL="$URL_PGHOST"
              [ -z "$PGUSER_VAL" ] && PGUSER_VAL="$URL_PGUSER"
              [ -z "$PGDATABASE_VAL" ] && PGDATABASE_VAL="$URL_PGDATABASE"
              [ -z "$PGPORT_VAL" ] && PGPORT_VAL="$URL_PGPORT"
              [ -z "$PGSSLMODE_VAL" ] && PGSSLMODE_VAL="$URL_PGSSLMODE"
              # Mirror the parsed password into a db-password secret for the
              # backend's PGPASSWORD secretref (idempotent overwrite).
              if [ -z "$PGPASSWORD_SECRET" ]; then
                az containerapp secret set \
                  --name "$TARGET_APP" \
                  --resource-group "$TARGET_RG" \
                  --secrets "db-password=$URL_PGPASSWORD" >/dev/null
                PGPASSWORD_SECRET="db-password"
              fi
              echo "::notice::Derived backend PG* from DATABASE_URL secret ($DB_URL_SECRET)."
            fi
          fi

          if [ -z "$PGHOST_VAL" ] || [ -z "$PGUSER_VAL" ] || [ -z "$PGDATABASE_VAL" ]; then
            echo "::error::Missing PGHOST/PGUSER/PGDATABASE on frontend container env (and no DATABASE_URL secret to derive from); refusing backend update to avoid localhost DB fallback."
            exit 1
          fi

          if [ -z "$PGPORT_VAL" ]; then
            PGPORT_VAL="5432"
          fi

          if [ -z "$PGSSLMODE_VAL" ]; then
            PGSSLMODE_VAL="require"
          fi

          if [ -z "$PGPASSWORD_SECRET" ]; then
            PGPASSWORD_SECRET="db-password"
          fi

          DJANGO_MIGRATE_EXTRA_ARGS=""
          DJANGO_SKIP_MIGRATIONS="false"
          if [ "${{ needs.plan.outputs.environment }}" = "demo" ]; then
            DJANGO_MIGRATE_EXTRA_ARGS="--fake-initial"
            DJANGO_SKIP_MIGRATIONS="true"
          fi

          # Backend runs migrations automatically on startup (Dockerfile CMD)
          az containerapp update \
            --name "$TARGET_APP" \
            --resource-group "$TARGET_RG" \
            --container-name django-backend \
            --set-env-vars \
              "AUTH_JWKS_URL=${{ secrets.AUTH_JWKS_URL }}" \
              "AUTH_WEBHOOK_SECRET=secretref:auth-webhook-secret" \
              "DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}" \
              "CORS_ALLOWED_ORIGINS=${{ needs.plan.outputs.marketing_url }},${{ needs.plan.outputs.app_url }}" \
              "PGHOST=$PGHOST_VAL" \
              "PGUSER=$PGUSER_VAL" \
              "PGDATABASE=$PGDATABASE_VAL" \
              "PGPORT=$PGPORT_VAL" \
              "PGSSLMODE=$PGSSLMODE_VAL" \
              "PGPASSWORD=secretref:$PGPASSWORD_SECRET" \
              "DJANGO_MIGRATE_EXTRA_ARGS=$DJANGO_MIGRATE_EXTRA_ARGS" \
              "DJANGO_SKIP_MIGRATIONS=$DJANGO_SKIP_MIGRATIONS" \
            --image ${{ env.BACKEND_IMAGE }}@${{ needs.build-push.outputs.backend_digest }}

      - name: RLS foundation preflight (fail-closed)
        # This proves the Key-Vault-sourced runtime/system credentials are
        # valid and that the live database policy state (RLS+FORCE RLS,
        # required policies, no-context-fails-closed) is correct. It does
        # NOT by itself prove the deployed Container App revision has
        # actually picked up these secrets and is connecting with them —
        # Container Apps secrets are revision-scoped, and this step queries
        # Postgres directly from the runner using the same credentials the
        # container secret references now point at, not through the running
        # container. For that operator-facing confirmation, call
        # GET /api/admin/database/health (platform_lead+) after this deploy
        # completes and confirm tenantPrincipal.currentUser is
        # "union_eyes_runtime" (not "nzilaadmin") and
        # systemPrincipal.currentUser is "union_eyes_system".
        if: ${{ needs.plan.outputs.rls_foundation_enforced == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          KEY_VAULT_NAME="${{ needs.plan.outputs.key_vault_name }}"
          RUNNER_IP=$(curl -sS --max-time 10 https://api.ipify.org)
          if [ -z "$RUNNER_IP" ]; then
            echo "::error::Could not determine this runner's public IP; refusing to proceed without a scoped firewall rule."
            exit 1
          fi
          RULE_NAME="gha-rls-preflight-${{ github.run_id }}"
          POSTGRES_SERVER_NAME="${{ vars.AZURE_POSTGRES_SERVER_NAME }}"
          POSTGRES_RG="${{ vars.AZURE_POSTGRES_RESOURCE_GROUP }}"
          if [ -z "$POSTGRES_SERVER_NAME" ] || [ -z "$POSTGRES_RG" ]; then
            echo "::error::vars.AZURE_POSTGRES_SERVER_NAME / vars.AZURE_POSTGRES_RESOURCE_GROUP not set for this environment — required to scope a temporary firewall rule for the RLS preflight. Refusing to proceed."
            exit 1
          fi

          cleanup() {
            az postgres flexible-server firewall-rule delete \
              --name "$POSTGRES_SERVER_NAME" \
              --resource-group "$POSTGRES_RG" \
              --rule-name "$RULE_NAME" \
              --yes >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          az postgres flexible-server firewall-rule create \
            --name "$POSTGRES_SERVER_NAME" \
            --resource-group "$POSTGRES_RG" \
            --rule-name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" >/dev/null

          RUNTIME_URL=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name union-eyes-runtime-database-url --query value -o tsv)
          SYSTEM_URL=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name union-eyes-system-database-url --query value -o tsv)

          set +x  # never trace commands here — the export lines contain secrets
          export RLS_VERIFY_DATABASE_URL="$RUNTIME_URL"
          export RLS_VERIFY_SYSTEM_DATABASE_URL="$SYSTEM_URL"

          pnpm --filter @nzila/union-eyes exec tsx scripts/rls-verify.ts --mode=preflight
          PREFLIGHT_STATUS=$?

          unset RLS_VERIFY_DATABASE_URL RLS_VERIFY_SYSTEM_DATABASE_URL RUNTIME_URL SYSTEM_URL

          if [ "$PREFLIGHT_STATUS" -ne 0 ]; then
            echo "::error::RLS foundation preflight failed for ${{ needs.plan.outputs.environment }} — the deployed revision is not considered healthy."
            exit 1
          fi
          echo "::notice::RLS foundation preflight passed for ${{ needs.plan.outputs.environment }} — union_eyes_runtime is confirmed NOSUPERUSER/NOBYPASSRLS with RLS enforced on every required table. Confirm the deployed app itself is using these credentials via GET /api/admin/database/health."

      - name: Custom domain smoke checks
        shell: bash
        run: |
          set -euo pipefail

          TARGET_APP="${{ needs.plan.outputs.app_name }}"
          TARGET_RG="${{ needs.plan.outputs.resource_group }}"

          DEFAULT_HOST=$(az containerapp show \
            --name "$TARGET_APP" \
            --resource-group "$TARGET_RG" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          DEFAULT_HOST_REQUIRED="${{ needs.plan.outputs.environment == 'production' && 'true' || 'false' }}"
          if [ "${{ vars.UE_REQUIRE_DEFAULT_HOST_SMOKE }}" = "true" ]; then
            DEFAULT_HOST_REQUIRED="true"
          fi

          probe_with_retries() {
            local url="$1"
            local attempts="${2:-5}"
            local timeout="${3:-15}"
            local delay="${4:-5}"
            local status="000"

            for attempt in $(seq 1 "$attempts"); do
              status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time "$timeout" "$url" || echo "000")
              if [[ "$status" =~ ^(200|301|302|307|308)$ ]]; then
                echo "$status"
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                echo "::notice::Smoke retry $attempt/$attempts for $url -> HTTP $status; retrying in ${delay}s."
                sleep "$delay"
              fi
            done

            echo "$status"
            return 1
          }

          if [ -n "$DEFAULT_HOST" ]; then
            if STATUS=$(probe_with_retries "https://$DEFAULT_HOST" 5 15 5); then
              echo "✅ default hostname https://$DEFAULT_HOST -> HTTP $STATUS"
            elif [ "$DEFAULT_HOST_REQUIRED" = "true" ]; then
              echo "❌ default hostname https://$DEFAULT_HOST -> HTTP $STATUS"
              exit 1
            else
              echo "::warning::default hostname https://$DEFAULT_HOST -> HTTP $STATUS (non-production soft check)"
            fi
          fi

          if [ "${{ secrets.UE_CUSTOM_DOMAIN_ACTIVE }}" != "true" ]; then
            echo "::notice::Custom domain smoke checks skipped for ${{ needs.plan.outputs.environment }}; UE_CUSTOM_DOMAIN_ACTIVE is not true in this GitHub environment."
            exit 0
          fi

          # Hosts that are known to be deployed but whose managed-cert binding
          # is still in flight should be treated as soft warnings instead of
          # hard-failing the deploy gate. Defaults to app.unioneyes.app, which
          # is gated on a managed cert that may lag behind the deploy. Override
          # via UE_SOFT_SMOKE_HOSTS (space-separated) once the cert is bound to
          # promote it back to a hard check, or set UE_SOFT_SMOKE_HOSTS="" to
          # disable softening entirely.
          SOFT_HOSTS="${{ vars.UE_SOFT_SMOKE_HOSTS != '' && vars.UE_SOFT_SMOKE_HOSTS || 'app.unioneyes.app' }}"

          host_is_soft() {
            local host="$1"
            for soft in $SOFT_HOSTS; do
              if [ "$host" = "$soft" ]; then
                return 0
              fi
            done
            return 1
          }

          for URL in ${{ needs.plan.outputs.smoke_urls }}; do
            HOST="$(echo "$URL" | awk -F/ '{print $3}')"
            if STATUS=$(probe_with_retries "$URL" 5 15 5); then
              echo "✅ $URL -> HTTP $STATUS"
            elif host_is_soft "$HOST"; then
              echo "::warning::Soft smoke host $URL -> HTTP $STATUS (listed in UE_SOFT_SMOKE_HOSTS); not failing the deploy."
            else
              echo "❌ $URL -> HTTP $STATUS"
              exit 1
            fi
          done

      - name: Whitepaper route smoke checks
        shell: bash
        env:
          UE_CUSTOM_DOMAIN_ACTIVE: ${{ secrets.UE_CUSTOM_DOMAIN_ACTIVE }}
        run: |
          set -euo pipefail

          if [ "${UE_CUSTOM_DOMAIN_ACTIVE:-}" != "true" ]; then
            echo "::notice::Whitepaper smoke checks skipped for ${{ needs.plan.outputs.environment }}; UE_CUSTOM_DOMAIN_ACTIVE is not true in this GitHub environment."
            exit 0
          fi

          BASE_URL="${{ needs.plan.outputs.marketing_url }}"
          echo "Running whitepaper smoke checks against $BASE_URL"
          IS_PRODUCTION_ENV="${{ needs.plan.outputs.environment == 'production' && 'true' || 'false' }}"

          probe_redirect_with_retries() {
            local path="$1"
            local accept_language="$2"
            local attempts="${3:-6}"
            local delay="${4:-5}"
            local headers=""
            local status="000"

            for attempt in $(seq 1 "$attempts"); do
              headers=$(curl -sS -o /dev/null -D - \
                --max-time 20 \
                -H "Accept-Language: $accept_language" \
                "$BASE_URL$path" || true)
              status=$(printf '%s\n' "$headers" | awk 'toupper($1) ~ /^HTTP/ { code=$2 } END { print code }')

              if [[ "$status" =~ ^(307|308)$ ]]; then
                printf '%s\n' "$headers"
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                echo "::notice::Whitepaper redirect retry $attempt/$attempts for $path -> HTTP ${status:-000}; waiting ${delay}s."
                sleep "$delay"
              fi
            done

            printf '%s\n' "$headers"
            return 1
          }

          probe_final_with_retries() {
            local path="$1"
            local attempts="${2:-6}"
            local delay="${3:-5}"
            local result=""
            local status="000"

            for attempt in $(seq 1 "$attempts"); do
              result=$(curl -sS -o /dev/null -w '%{http_code} %{url_effective}' \
                --max-time 20 \
                "$BASE_URL$path" || true)
              status=${result%% *}

              if [ "$status" = "200" ]; then
                printf '%s\n' "$result"
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                echo "::notice::Whitepaper final retry $attempt/$attempts for $path -> HTTP ${status:-000}; waiting ${delay}s."
                sleep "$delay"
              fi
            done

            printf '%s\n' "$result"
            return 1
          }

          assert_redirect() {
            local path="$1"
            local accept_language="$2"
            local expected_location="$3"
            local headers
            local status
            local location
            local location_path

            headers=$(probe_redirect_with_retries "$path" "$accept_language" 6 5 || true)
            status=$(printf '%s\n' "$headers" | awk 'toupper($1) ~ /^HTTP/ { code=$2 } END { print code }')
            location=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ { print $2 }' | tr -d '\r' | tail -n1)

            if [ -z "$status" ] || [ "$status" = "000" ]; then
              echo "::error::Failed to probe redirect for $path; empty/invalid status. headers=$headers"
              exit 1
            fi

            if [[ "$location" == *":3000/"* ]]; then
              if [ "$IS_PRODUCTION_ENV" = "true" ]; then
                echo "::error::Expected $path redirect Location to avoid internal :3000 port leakage; got location=$location"
                exit 1
              fi
              echo "::warning::Staging redirect uses internal :3000 host rewrite; validating path and final URL instead. location=$location"
            fi

            if [[ "$location" =~ ^https?:// ]]; then
              location_path="/${location#*://*/}"
            else
              location_path="$location"
            fi

            location_path="${location_path%%\?*}"

            if [[ ! "$status" =~ ^(307|308)$ ]] || [ "$location_path" != "$expected_location" ]; then
              echo "::error::Expected $path to redirect to $expected_location (HTTP 307/308); got HTTP $status location=$location parsed_path=$location_path"
              exit 1
            fi

            echo "✅ $path -> $location"
          }

          assert_final() {
            local path="$1"
            local expected_final_url="$2"
            local result
            local status
            local final_url

            result=$(probe_final_with_retries "$path" 6 5 || true)
            status=${result%% *}
            final_url=${result#* }

            if [ -z "$status" ] || [ "$status" = "000" ]; then
              if [ "$IS_PRODUCTION_ENV" = "true" ]; then
                echo "::error::Failed to probe final URL for $path; raw_result=$result"
                exit 1
              fi
              echo "::warning::Staging final URL probe failed for $path; raw_result=$result"
              return 0
            fi

            if [ "$status" != "200" ] || [ "$final_url" != "$expected_final_url" ]; then
              if [ "$IS_PRODUCTION_ENV" = "true" ]; then
                echo "::error::Expected $path to finish at $expected_final_url with HTTP 200; got HTTP $status final=$final_url"
                exit 1
              fi
              echo "::warning::Staging final URL mismatch for $path; expected=$expected_final_url got_status=$status got_final=$final_url"
              return 0
            fi

            echo "✅ $path -> $final_url"
          }

          assert_redirect "/whitepaper" "fr-CA,fr;q=0.9,en;q=0.7" "/fr-CA/whitepaper"
          assert_redirect "/whitepapers" "en-CA,en;q=0.9" "/en-CA/whitepapers"

          assert_final "/fr-CA/whitepaper" "$BASE_URL/fr-CA/whitepaper"
          assert_final "/en-CA/whitepaper" "$BASE_URL/en-CA/whitepaper"
          assert_final "/fr-CA/whitepapers/operational-reality-edition" "$BASE_URL/fr-CA/whitepapers/operational-reality-edition"
          assert_final "/en-CA/whitepapers/oci-method-companion" "$BASE_URL/en-CA/whitepapers/oci-method-companion"
          assert_final "/fr-CA/whitepapers/oci-method-canonical" "$BASE_URL/fr-CA/whitepapers/oci-method-canonical"

      - name: Version identity checks (fail closed)
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ secrets.UE_CUSTOM_DOMAIN_ACTIVE }}" != "true" ]; then
            echo "::notice::Version identity checks skipped for ${{ needs.plan.outputs.environment }}; UE_CUSTOM_DOMAIN_ACTIVE is not true in this GitHub environment."
            exit 0
          fi

          DEPLOYED_SHA="${{ github.sha }}"
          SOFT_HOSTS="${{ vars.UE_SOFT_SMOKE_HOSTS != '' && vars.UE_SOFT_SMOKE_HOSTS || 'app.unioneyes.app' }}"
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=30
          VERSION_IDENTITY_REQUIRED="${{ needs.plan.outputs.environment == 'production' && 'true' || 'false' }}"
          if [ "${{ vars.UE_REQUIRE_VERSION_IDENTITY_SMOKE }}" = "true" ]; then
            VERSION_IDENTITY_REQUIRED="true"
          fi

          host_is_soft() {
            local host="$1"
            for soft in $SOFT_HOSTS; do
              if [ "$host" = "$soft" ]; then
                return 0
              fi
            done
            return 1
          }

          check_version_identity() {
            local base_url="$1"
            local host
            host="$(echo "$base_url" | awk -F/ '{print $3}')"

            local payload
            if ! payload=$(curl -fsS --max-time 20 "$base_url/api/version" 2>/dev/null); then
              if [ "$VERSION_IDENTITY_REQUIRED" != "true" ]; then
                echo "::warning::$base_url /api/version probe failed (non-production soft check)."
                return 0
              fi
              if host_is_soft "$host"; then
                echo "::warning::Soft host $base_url failed /api/version probe; not failing deploy."
                return 0
              fi
              echo "::error::Version probe failed for $base_url/api/version"
              return 1
            fi

            local live_sha
            live_sha=$(echo "$payload" | jq -r '.gitSha // empty')
            if [ -z "$live_sha" ]; then
              if [ "$VERSION_IDENTITY_REQUIRED" != "true" ]; then
                echo "::warning::$base_url/api/version returned no gitSha (non-production soft check)."
                return 0
              fi
              if host_is_soft "$host"; then
                echo "::warning::Soft host $base_url returned no gitSha in /api/version; not failing deploy."
                return 0
              fi
              echo "::error::$base_url/api/version did not return gitSha"
              return 1
            fi

            if [ "$live_sha" != "$DEPLOYED_SHA" ]; then
              if [ "$VERSION_IDENTITY_REQUIRED" != "true" ]; then
                echo "::warning::$base_url serving stale gitSha=$live_sha expected=$DEPLOYED_SHA (non-production soft check)."
                return 0
              fi
              if host_is_soft "$host"; then
                echo "::warning::Soft host $base_url serving stale gitSha=$live_sha expected=$DEPLOYED_SHA; not failing deploy."
                return 0
              fi
              echo "::error::$base_url is serving stale gitSha=$live_sha expected=$DEPLOYED_SHA"
              return 1
            fi

            echo "✅ $base_url/api/version gitSha matches deployed sha ${DEPLOYED_SHA}"
            return 0
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            all_ok=true

            for URL in ${{ needs.plan.outputs.smoke_urls }}; do
              if ! check_version_identity "$URL"; then
                all_ok=false
              fi
            done

            if [ "$all_ok" = "true" ]; then
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "::notice::Version identity checks attempt $attempt/$MAX_ATTEMPTS did not match deployed sha yet; retrying in ${SLEEP_SECONDS}s."
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "::error::Version identity checks never converged to deployed sha $DEPLOYED_SHA after ${MAX_ATTEMPTS} attempts."
          exit 1

      - name: Persona authz smoke (demo only, soft)
        if: ${{ needs.plan.outputs.demo_profile != '' }}
        shell: bash
        run: |
          set -uo pipefail
          TARGET_APP="${{ needs.plan.outputs.app_name }}"
          TARGET_RG="${{ needs.plan.outputs.resource_group }}"
          FQDN=$(az containerapp show \
            --name "$TARGET_APP" \
            --resource-group "$TARGET_RG" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          BASE="https://$FQDN"
          echo "Persona smoke against $BASE"
          # Soft until demo DB bootstrap is fully baked in (mfa_totp +
          # org_auth_policies schemas + persona seed). Promote to hard once
          # the bootstrap job is added to this workflow.
          if node apps/union-eyes/scripts/smoke-cupe4373-personas.mjs --base "$BASE"; then
            echo "✅ persona smoke passed"
          else
            echo "::warning::Persona smoke against $BASE failed — verify demo DB has mfa_totp/org_auth_policies tables and cupe4373 personas seeded (see /memories/repo/ue-demo-auth-bootstrap.md)."
          fi

      - name: DNS record verification (post-deploy)
        if: ${{ vars.DNS_AUTOMATION_ENABLED == 'true' }}
        shell: bash
        env:
          DNS_PROVIDER: ${{ vars.DNS_PROVIDER }}
          DNS_ZONE_NAME: ${{ needs.plan.outputs.dns_zone_name }}
          PROD_DNS_TARGET: ${{ needs.plan.outputs.prod_dns_target }}
          STAGING_DNS_TARGET: ${{ needs.plan.outputs.staging_dns_target }}
        run: |
          set -euo pipefail

          if [ "$DNS_PROVIDER" != "cloudflare" ]; then
            echo "DNS verification not implemented for provider: $DNS_PROVIDER"
            exit 1
          fi

          ZONE="$DNS_ZONE_NAME"
          PROD_TARGET="$PROD_DNS_TARGET"
          STAGING_TARGET="$STAGING_DNS_TARGET"

          normalize_host() {
            echo "$1" | tr -d '[:space:]' | sed 's/\.$//' | tr '[:upper:]' '[:lower:]'
          }

          APP_CNAME_RAW=$(dig +short CNAME "app.$ZONE" | tail -n 1)
          STAGING_APP_CNAME_RAW=$(dig +short CNAME "staging-app.$ZONE" | tail -n 1)

          APP_CNAME=$(normalize_host "${APP_CNAME_RAW:-}")
          STAGING_APP_CNAME=$(normalize_host "${STAGING_APP_CNAME_RAW:-}")
          PROD_TARGET_NORM=$(normalize_host "$PROD_TARGET")
          STAGING_TARGET_NORM=$(normalize_host "$STAGING_TARGET")

          if [ "$APP_CNAME" != "$PROD_TARGET_NORM" ]; then
            echo "app.$ZONE DNS mismatch. expected=$PROD_TARGET got=${APP_CNAME_RAW:-none}"
            exit 1
          fi

          if [ "$STAGING_APP_CNAME" != "$STAGING_TARGET_NORM" ]; then
            echo "staging-app.$ZONE DNS mismatch. expected=$STAGING_TARGET got=${STAGING_APP_CNAME_RAW:-none}"
            exit 1
          fi

          # Soft-warn on hosts that may have managed-cert binding in flight.
          # Uses the same UE_SOFT_SMOKE_HOSTS variable as the smoke-check step;
          # defaults to app.unioneyes.app until its cert is fully bound.
          SOFT_DNS_HOSTS="${{ vars.UE_SOFT_SMOKE_HOSTS != '' && vars.UE_SOFT_SMOKE_HOSTS || 'app.unioneyes.app' }}"
          dns_host_is_soft() {
            local host="$1"
            for soft in $SOFT_DNS_HOSTS; do
              if [ "$host" = "$soft" ]; then return 0; fi
            done
            return 1
          }

          for URL in "https://$ZONE" "https://app.$ZONE" "https://staging.$ZONE" "https://staging-app.$ZONE"; do
            HOST="$(echo "$URL" | awk -F/ '{print $3}')"
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo "000")
            if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "✅ $URL -> HTTP $STATUS"
            elif dns_host_is_soft "$HOST"; then
              echo "::warning::Managed-cert binding pending for $URL -> HTTP $STATUS; not failing the deploy."
            else
              echo "HTTPS check failed for $URL status=$STATUS"
              exit 1
            fi
          done

          echo "DNS verification passed for $ZONE"

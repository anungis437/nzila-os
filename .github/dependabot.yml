version: 2
updates:
  # Root workspace / shared packages
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - "eslint*"
          - "typescript*"
          - "@typescript-eslint/*"
          - "prettier"
          - "turbo"
          - "vitest*"
          - "@vitest/*"
        # Keep majors out of the group — a group PR that mixes TS/ESLint major
        # bumps with unrelated minor bumps is effectively unmergeable (e.g.
        # TypeScript 6 dropped ts.Extension.Cjs, which typescript-eslint v8
        # depends on). Majors get their own PRs for dedicated migration work.
        update-types:
          - "minor"
          - "patch"
      next-js:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
        # Same rationale: React/Next majors are large migrations — keep them
        # out of the auto-grouped PR.
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Only accept patch updates for Drizzle ORM (breaking changes are frequent)
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "drizzle-kit"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-merge"   # W2-11: Auto-merge patch updates

  # ── Python (automation package) ──────────────────────────────────────────
  - package-ecosystem: pip
    directory: /packages/automation
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
# cliff.toml — git-cliff changelog configuration for Nzila OS
#
# Conventional commits → sectioned changelog.
# Used by: release-train.yml (create-release job via git-cliff-action)
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to Nzila OS will be documented here.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} ⚠ BREAKING{% endif %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/anungis437/nzila-os/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = "\\(#(\\d+)\\)", replace = "([#${1}](https://github.com/anungis437/nzila-os/pull/${1}))" },
]

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^security|^sec", group = "Security" },
  { message = "^infra|^ci|^cd|^deploy|^ops", group = "Infra" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Changed" },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { body = ".*BREAKING CHANGE.*", group = "Breaking Changes" },
]

filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"

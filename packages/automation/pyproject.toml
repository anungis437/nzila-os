[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nzila-automation"
version = "0.1.0"
description = "Nzila platform migration automation tooling"
requires-python = ">=3.11"
dependencies = [
    "colorlog",
    "python-json-logger",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio"]

# Install with: pip install -e packages/automation
# After installation, all imports resolve without sys.path manipulation:
#   from generators import CodeGenerator
#   from generators.core.platform_analyzer import PlatformAnalyzer
#   from config import get_config
[tool.setuptools.packages.find]
where = ["."]
include = [
    "generators*",
    "integrations*",
    "monitoring*",
    "deployment*",
    "analyzers*",
    "reporters*",
    "organizers*",
    "validation*",
    "security*",
]

[tool.coverage.run]
omit = [
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/generators/fixers/*",
    "*/generators/services/*",
    "*/generators/reports/*",
    "*/generators/infra/*",
    "*/generators/migration/data_migrator.py",
    "*/generators/migration/django_project_setup.py",
    "*/generators/migration/generate_django_apis.py",
    "*/generators/migration/scaffold_populator.py",
    "*/generators/migration/migrate_abr.py",
    "*/generators/migration/migrate_ue.py",
    "*/generators/core/platform_analyzer.py",
    "*/generators/core/code_generator.py",
    "*/generators/_list_issues.py",
    "*/generators/_patch_abr_urls.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "coverage_html"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Production Environment Configuration
# Nzila OS — GitOps

environment: production
region: canadacentral
resource_group: nzila-canada-prod-rg
dr_region: canadaeast
# NOTE: eastus is NOT an approved region for UE/CUPE workloads.
# All production deployments must target canadacentral (PIPEDA / Québec Law 25).

# PIPEDA / Québec Law 25 — all PII must remain in Canada
# Primary: Canada Central (Toronto)
# DR: Canada East (Quebec City)
# Cross-border transfer: disabled

container_apps:
  environment: nzila-canada-prod-env
  revision_mode: Multiple
  min_replicas: 3
  max_replicas: 50              # scaled for 100K+ users (was 20)

apps:
  web:
    image_tag: "${VERSION}"
    port: 3000
    cpu: 2.0                    # scaled from 1.0 for production load
    memory: 4Gi                 # scaled from 2Gi — avoids GC pressure
    scale_rules:
      - name: http-requests
        type: http
        metadata:
          concurrentRequests: "50"
      - name: cpu-utilization
        type: cpu
        metadata:
          type: Utilization
          value: "70"
    env:
      - name: NODE_ENV
        value: production
      - name: NEXT_PUBLIC_APP_ENV
        value: production
      - name: OTEL_ENABLED
        value: "true"
      - name: OTEL_SERVICE_NAME
        value: nzila-web
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "${OTEL_COLLECTOR_ENDPOINT}"
      - name: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - name: OTEL_TRACES_SAMPLER_ARG
        value: "0.5"

  console:
    image_tag: "${VERSION}"
    port: 3001
    cpu: 2.0
    memory: 4Gi
    scale_rules:
      - name: http-requests
        type: http
        metadata:
          concurrentRequests: "30"
      - name: cpu-utilization
        type: cpu
        metadata:
          type: Utilization
          value: "70"
    env:
      - name: NODE_ENV
        value: production
      - name: OTEL_ENABLED
        value: "true"
      - name: OTEL_SERVICE_NAME
        value: nzila-console
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "${OTEL_COLLECTOR_ENDPOINT}"
      - name: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - name: OTEL_TRACES_SAMPLER_ARG
        value: "0.5"

  partners:
    image_tag: "${VERSION}"
    port: 3002
    cpu: 1.0
    memory: 2Gi
    scale_rules:
      - name: http-requests
        type: http
        metadata:
          concurrentRequests: "40"
    env:
      - name: NODE_ENV
        value: production
      - name: OTEL_ENABLED
        value: "true"
      - name: OTEL_SERVICE_NAME
        value: nzila-partners
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "${OTEL_COLLECTOR_ENDPOINT}"
      - name: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - name: OTEL_TRACES_SAMPLER_ARG
        value: "0.5"

  # union-eyes is deployed via .github/workflows/auto-promote-union-eyes.yml
  # which fans out to the dedicated `-prod`, `-demo`, `-pilot`, `-staging` CAs.
  # Do not re-introduce a union-eyes block here.

  abr:
    image_tag: "${VERSION}"
    port: 3004
    cpu: 1.0
    memory: 2Gi
    env:
      - name: NODE_ENV
        value: production
      - name: OTEL_ENABLED
        value: "true"
      - name: OTEL_SERVICE_NAME
        value: nzila-abr
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "${OTEL_COLLECTOR_ENDPOINT}"
      - name: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - name: OTEL_TRACES_SAMPLER_ARG
        value: "0.5"

  cfo:
    image_tag: "${VERSION}"
    port: 3008
    cpu: 1.0
    memory: 2Gi
    env:
      - name: NODE_ENV
        value: production
      - name: OTEL_ENABLED
        value: "true"
      - name: OTEL_SERVICE_NAME
        value: nzila-cfo
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "${OTEL_COLLECTOR_ENDPOINT}"
      - name: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - name: OTEL_TRACES_SAMPLER_ARG
        value: "0.5"

  flow:
    image_tag: "${VERSION}"
    port: 3009
    cpu: 1.0
    memory: 2Gi
    env:
      - name: NODE_ENV
        value: production
      - name: OTEL_ENABLED
        value: "true"
      - name: OTEL_SERVICE_NAME
        value: nzila-flow
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "${OTEL_COLLECTOR_ENDPOINT}"
      - name: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - name: OTEL_TRACES_SAMPLER_ARG
        value: "0.5"

  orchestrator-api:
    image_tag: "${VERSION}"
    port: 4000
    cpu: 2.0
    memory: 4Gi
    scale_rules:
      - name: http-requests
        type: http
        metadata:
          concurrentRequests: "100"
      - name: cpu-utilization
        type: cpu
        metadata:
          type: Utilization
          value: "70"
    env:
      - name: NODE_ENV
        value: production
      - name: OTEL_ENABLED
        value: "true"
      - name: OTEL_SERVICE_NAME
        value: nzila-orchestrator
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "${OTEL_COLLECTOR_ENDPOINT}"
      - name: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - name: OTEL_TRACES_SAMPLER_ARG
        value: "0.5"

  # zonga intentionally excluded from default production manifest.
  # Pilot promotion requires explicit override through deploy-production workflow.

database:
  sku: GP_Standard_E8ds_v5      # 8 vCores, 64 GiB (upgrade path: E16 → E32)
  storage_gb: 1024              # 1 TB with auto-grow
  backup_retention_days: 35
  high_availability: true
  geo_redundant_backup: true
  standby_availability_zone: "2"

  # PgBouncer connection pooling (built into Azure Flexible Server)
  pgbouncer:
    enabled: true
    pool_mode: transaction      # transaction pooling (best for serverless)
    default_pool_size: 100      # real DB connections per user/db pair
    max_client_connections: 5000 # 5K client connections across all replicas
    min_pool_size: 10           # keep warm connections

  # Read replicas for horizontal read scaling
  read_replicas:
    count: 2                    # 2 replicas for analytics/reporting/dashboards
    # App reads routed via DATABASE_READ_URL env var

storage:
  replication: GRS
  # Geo-replication pair: canadacentral ↔ canadaeast (both in Canada)
  allow_cross_tenant_replication: false

redis:
  sku: Premium
  capacity: 1
  # Zone redundancy within canadacentral
  zones: ["1", "2", "3"]

monitoring:
  sampling_percentage: 25
  retention_days: 90

data_residency:
  enforce: true
  allowed_regions:
    - canadacentral
    - canadaeast
  cross_border_transfer: disabled
  regulatory_frameworks:
    - PIPEDA
    - "Québec Law 25"

quotas:
  max_orgs: 10000
  max_ai_requests_per_day: 1000000
  max_storage_gb: 10000
  max_compute_hours_per_day: 5000

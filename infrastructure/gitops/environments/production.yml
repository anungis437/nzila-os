# Production Environment Configuration
# Nzila OS — GitOps

environment: production
region: canadacentral
resource_group: nzila-prod-rg
dr_region: canadaeast

# PIPEDA / Québec Law 25 — all PII must remain in Canada
# Primary: Canada Central (Toronto)
# DR: Canada East (Quebec City)
# Cross-border transfer: disabled

container_apps:
  environment: nzila-prod-env
  revision_mode: Multiple
  min_replicas: 3
  max_replicas: 20

apps:
  web:
    image_tag: "${VERSION}"
    port: 3000
    cpu: 1.0
    memory: 2Gi
    scale_rules:
      - name: http-requests
        type: http
        metadata:
          concurrentRequests: "50"
    env:
      - name: NODE_ENV
        value: production
      - name: NEXT_PUBLIC_APP_ENV
        value: production

  console:
    image_tag: "${VERSION}"
    port: 3001
    cpu: 1.0
    memory: 2Gi
    scale_rules:
      - name: http-requests
        type: http
        metadata:
          concurrentRequests: "30"
    env:
      - name: NODE_ENV
        value: production

  partners:
    image_tag: "${VERSION}"
    port: 3002
    cpu: 0.5
    memory: 1Gi
    env:
      - name: NODE_ENV
        value: production

  union-eyes:
    image_tag: "${VERSION}"
    port: 3003
    cpu: 1.0
    memory: 2Gi
    scale_rules:
      - name: http-requests
        type: http
        metadata:
          concurrentRequests: "40"
    env:
      - name: NODE_ENV
        value: production

  abr:
    image_tag: "${VERSION}"
    port: 3004
    cpu: 1.0
    memory: 2Gi
    env:
      - name: NODE_ENV
        value: production

  cfo:
    image_tag: "${VERSION}"
    port: 3008
    cpu: 1.0
    memory: 2Gi
    env:
      - name: NODE_ENV
        value: production

  orchestrator-api:
    image_tag: "${VERSION}"
    port: 4000
    cpu: 1.0
    memory: 2Gi
    scale_rules:
      - name: http-requests
        type: http
        metadata:
          concurrentRequests: "100"
    env:
      - name: NODE_ENV
        value: production

  zonga:
    image_tag: "${VERSION}"
    port: 3006
    cpu: 1.0
    memory: 2Gi
    scale_rules:
      - name: http-requests
        type: http
        metadata:
          concurrentRequests: "50"
    env:
      - name: NODE_ENV
        value: production

database:
  sku: GP_Standard_D4ds_v5
  storage_gb: 512
  backup_retention_days: 35
  high_availability: true
  geo_redundant_backup: true
  # DR replica stays within Canada (canadaeast)
  standby_availability_zone: "2"

storage:
  replication: GRS
  # Geo-replication pair: canadacentral ↔ canadaeast (both in Canada)
  allow_cross_tenant_replication: false

redis:
  sku: Premium
  capacity: 1
  # Zone redundancy within canadacentral
  zones: ["1", "2", "3"]

monitoring:
  sampling_percentage: 25
  retention_days: 90

data_residency:
  enforce: true
  allowed_regions:
    - canadacentral
    - canadaeast
  cross_border_transfer: disabled
  regulatory_frameworks:
    - PIPEDA
    - "Québec Law 25"

quotas:
  max_orgs: 10000
  max_ai_requests_per_day: 1000000
  max_storage_gb: 10000
  max_compute_hours_per_day: 5000

# CI — NzilaOS Governance Pipeline
#
# This workflow adopts NzilaOS governance templates via workflow_call.
# All scanners are PR-blocking. Evidence packs are sealed and verified.
#
# Required secrets:
#   EVIDENCE_SEAL_KEY — HMAC key for evidence sealing (optional, enhances integrity)

name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Governance scanners (reusable from NzilaOS) ──────────────────────────
  # Uncomment when nzila-automation repo publishes reusable workflows:
  # governance:
  #   uses: nzila-automation/.github/workflows/nzila-governance.yml@main
  #   secrets: inherit

  # ── Secret scan ──────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency audit ─────────────────────────────────────────────────────
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tooling/security/npm-bulk-audit.mjs --audit-level=critical

  # ── Trivy scan ───────────────────────────────────────────────────────────
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # v0.34.1
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 1

  # ── SBOM generation ──────────────────────────────────────────────────────
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        id: sbom
        with:
          format: cyclonedx-json
          artifact-name: sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ steps.sbom.outputs.sbom-artifact-id }}

  # ── Lint + Typecheck ─────────────────────────────────────────────────────
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  # ── Test ─────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ── Contract tests ──────────────────────────────────────────────────────
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract-tests

  # ── Evidence seal + verify ──────────────────────────────────────────────
  evidence:
    needs: [secret-scan, dependency-audit, trivy, sbom, lint-and-typecheck, test, contract-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm evidence:collect
      - run: pnpm evidence:seal
        env:
          EVIDENCE_SEAL_KEY: ${{ secrets.EVIDENCE_SEAL_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-pack
          path: |
            evidence/pack.json
            evidence/seal.json
          retention-days: 365

# lefthook.yml — Pre-commit guardrails for Nzila Automation monorepo
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true

  commands:
    gitleaks:
      glob: "*.{ts,tsx,js,jsx,json,env,yml,yaml,md,sh,ps1,py}"
      run: >
        gitleaks git
        --staged
        --config .gitleaks.toml
        --no-banner
        --verbose
      fail_text: |
        🔒 Gitleaks detected potential secrets in staged files.
        Review the output above and remove or rotate any exposed credentials.
        See docs/hardening/secrets.md for guidance.
        Install gitleaks: https://github.com/gitleaks/gitleaks#installing

    lint-staged:
      glob: "*.{ts,tsx,js,jsx,mjs}"
      run: node scripts/lint-staged-eslint.mjs {staged_files}
      fail_text: "Lint errors found. Run `pnpm lint` to see details."

    # Validation level 1 (development): typecheck only packages with staged TS files.
    # Dependents and the full workspace are qualified once per candidate SHA by
    # CI (.github/workflows/ci.yml, tooling/ci/run-affected-typecheck.sh).
    # See docs/architecture/VALIDATION_LEVELS.md. Bounded to one task at a time.
    typecheck-staged:
      glob: "*.{ts,tsx}"
      run: node scripts/typecheck-changed.mjs
      fail_text: "Type errors found in changed packages. Run `node scripts/typecheck-changed.mjs` to see details."

    brand-leakage:
      glob: "*.{ts,tsx,js,jsx,json,md}"
      run: pnpm brand:leakage:check
      fail_text: "Engine/product boundary violations detected. Run `pnpm brand:leakage:check` to see details."

    link-check:
      glob: "*.md"
      run: pnpm exec tsx scripts/link-check.ts {staged_files}
      fail_text: "Broken markdown links detected. Run `pnpm link-check` to see details."

    inventory-sync:
      glob:
        - "apps/**/*"
        - "packages/**/*"
        - "services/*/package.json"
        - "tooling/*/package.json"
        - "tooling/**/*.{test,spec}.{ts,tsx,js,jsx}"
        - ".github/workflows/**/*"
        - "governance/exceptions/**/*"
        - "README.md"
        - "README.business.md"
        - "ARCHITECTURE.md"
      # stage_fixed only restages files matching this hook's own glob above;
      # the generated output lives under tooling/repo-inventory/output/**, which
      # is outside that glob, so it must be staged explicitly or it silently
      # falls out of the commit and trips CI's "Enforce committed inventory
      # lock" step instead. Stage exactly the four canonical generator outputs
      # (not the whole directory) so an unrelated/accidental file that happens
      # to exist under that path is never swept into the commit.
      run: >
        node scripts/check-inventory-staging-safety.mjs &&
        pnpm inventory:generate &&
        git add --
        tooling/repo-inventory/output/inventory.json
        tooling/repo-inventory/output/inventory.md
        tooling/repo-inventory/output/repo-inventory.json
        tooling/repo-inventory/output/repo-inventory.md
      stage_fixed: true
      fail_text: |
        Inventory regeneration aborted: unstaged/untracked changes exist under
        apps/**, packages/**, inventory-relevant services/tooling paths,
        .github/workflows/**, governance/exceptions/**, or the canonical count
        docs. Stage or stash them, then retry the commit.

pre-push:
  commands:
    # Validation level 1 (development): run only contract test files added or
    # changed by the push. The complete contract suite is a required CI gate
    # (ci.yml `contract-tests`) and is the PR/merge qualification, run once per
    # final candidate SHA. Run `pnpm contract-tests` locally for the full suite.
    contract-tests:
      glob: "tooling/contract-tests/**/*.test.ts"
      run: >
        pnpm exec vitest run
        --config tooling/contract-tests/vitest.config.ts
        {push_files}
      fail_text: |
        Changed contract tests failed. Run `pnpm contract-tests` to see details.
        Do not push code that violates repo invariants.
